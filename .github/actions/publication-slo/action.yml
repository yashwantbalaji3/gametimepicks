name: Publication SLO check
description: >-
  Classify today's slate against a deadline derived from the earliest scheduled start, and alert
  when it is late. Cheap and side-effect-light by design so it can ride EVERY workflow that runs
  during the day.

# ── WHY THIS IS AN ACTION AND NOT A WORKFLOW ────────────────────────────────────────────────────
#
# On 2026-08-27 five scheduled workflows in a row — sport-schedules, morning-projections,
# mlb-daily-production, cron-watchdog and daily-products — received no scheduled events at all,
# across a 13:00–16:40 UTC band. Everything outside that band ran normally. The single job whose
# purpose is noticing that scheduled jobs did not run, cron-watchdog, fires at 14:30 UTC: it was
# inside the band, so the watchdog shared the exact failure mode it exists to detect, and the site
# said "Today's slate isn't published yet" for six hours past its deadline.
#
# A watchdog on its own cron is a single point of failure no matter how good it is. This is a step
# instead, so detection rides on a dozen independent schedules. Any one of them firing is enough.

inputs:
  now:
    description: "ISO instant to evaluate against. Blank = now."
    required: false
    default: ""
  lead-minutes:
    description: "Minutes before the earliest start by which the slate must be published."
    required: false
    default: "90"
  dispatch-recovery:
    description: >-
      On INCIDENT, dispatch morning-projections for the date. Guarded to at most one automatic
      attempt per ET day so a dozen detectors cannot spend a dozen times.
    required: false
    default: "false"
  gh-token:
    description: "Token for the run query and the recovery dispatch. Required only for dispatch."
    required: false
    default: ""
  ops-webhook-url:
    description: "Optional alert sink. Unset is an honest no-op, never a failure."
    required: false
    default: ""

outputs:
  state:
    description: "PUBLISHED | PUBLISHING | INPUT_GATED | NO_EVENT | INCIDENT | UNKNOWN"
    value: ${{ steps.check.outputs.state }}
  date:
    description: "The ET date evaluated."
    value: ${{ steps.check.outputs.date }}

runs:
  using: composite
  steps:
    - name: Classify today's publication state
      id: check
      shell: bash
      run: |
        set -uo pipefail
        NOW_ARG=""; [ -n "${{ inputs.now }}" ] && NOW_ARG="--now ${{ inputs.now }}"
        # Never --fail-on-incident here. A watchdog that fails the run it is watching becomes its own
        # outage, and this step is attached to jobs whose real work is unrelated.
        node app/scripts/ops/publication-slo.mjs $NOW_ARG --lead-minutes "${{ inputs.lead-minutes }}" || true
        SLO=app/public/data/ops/publication-slo.json
        if [ ! -f "$SLO" ]; then
          echo "::warning::publication-slo produced no artifact — state UNKNOWN"
          { echo "state=UNKNOWN"; echo "date="; } >> "$GITHUB_OUTPUT"; exit 0
        fi
        STATE="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).state)' "$SLO")"
        DATE="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).date)' "$SLO")"
        { echo "state=$STATE"; echo "date=$DATE"; } >> "$GITHUB_OUTPUT"
        echo "publication state for $DATE: $STATE"
        if [ "$STATE" = "INCIDENT" ] || [ "$STATE" = "UNKNOWN" ]; then
          echo "::warning::publication SLO for $DATE is $STATE — see app/public/data/ops/publication-slo.json"
        fi

    # ── EVERY DAILY OWNER, NOT JUST THE SLATE ───────────────────────────────────────────────────
    #
    # The publication check above watches ONE artifact. Three of the four dropped-cron incidents
    # since 2026-08-27 were other owners entirely — mlb-daily-production's markets, nightly-settle,
    # sport-schedules — and nothing was watching any of them. This asks the same question of all of
    # them, from receipts rather than run lists, so a cron that created no run object is still
    # visible. It rides here to inherit this action's redundancy across a dozen schedules.
    - name: Daily-owner SLO (did every owner's work actually happen?)
      id: owners
      shell: bash
      run: |
        set -uo pipefail
        NOW_ARG=""; [ -n "${{ inputs.now }}" ] && NOW_ARG="--now ${{ inputs.now }}"
        node app/scripts/ops/daily-owner-slo.mjs $NOW_ARG || true
        SLO=app/public/data/ops/daily-owner-slo.json
        if [ ! -f "$SLO" ]; then
          echo "::warning::daily-owner-slo produced no artifact"
          echo "state=UNKNOWN" >> "$GITHUB_OUTPUT"; exit 0
        fi
        STATE="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).state)' "$SLO")"
        echo "state=$STATE" >> "$GITHUB_OUTPUT"
        if [ "$STATE" = "INCIDENT" ] || [ "$STATE" = "UNKNOWN" ] || [ "$STATE" = "STALE" ]; then
          echo "::warning::daily-owner SLO is $STATE — see app/public/data/ops/daily-owner-slo.json"
        fi

    - name: Alert on a late owner
      if: steps.owners.outputs.state == 'INCIDENT' || steps.owners.outputs.state == 'STALE'
      shell: bash
      env:
        OPS_WEBHOOK_URL: ${{ inputs.ops-webhook-url }}
      run: |
        set -uo pipefail
        DETAIL="$(node -e '
          const d = JSON.parse(require("fs").readFileSync("app/public/data/ops/daily-owner-slo.json","utf8"));
          console.log(d.owners.filter(o => ["INCIDENT","STALE","UNKNOWN"].includes(o.state)).map(o => `${o.id}:${o.state}`).join(" "));
        ')"
        node app/scripts/ops-notify.mjs --status fail --phase daily-owner-slo           --date "${{ steps.owners.outputs.date || steps.check.outputs.date }}" --message "$DETAIL" || true

    - name: Alert on a late slate
      if: steps.check.outputs.state == 'INCIDENT'
      shell: bash
      env:
        OPS_WEBHOOK_URL: ${{ inputs.ops-webhook-url }}
      run: |
        set -uo pipefail
        REASON="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("app/public/data/ops/publication-slo.json","utf8")).reason)')"
        node app/scripts/ops-notify.mjs --status fail --phase publication-slo \
          --date "${{ steps.check.outputs.date }}" --message "$REASON" || true

    - name: Dispatch one guarded recovery
      # P243 · A-7: also runs pre-deadline (PUBLISHING). Waiting for the publish deadline to PASS
      # before recovering guaranteed a miss: the pipeline needs ~75 minutes end to end, so a
      # dispatch at deadline+1 lands after the first pitch (2026-09-07: 6 of 11 games missed).
      # The step itself decides whether the generator is overdue against the artifact's deadline.
      if: inputs.dispatch-recovery == 'true' && (steps.check.outputs.state == 'INCIDENT' || steps.check.outputs.state == 'PUBLISHING')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -uo pipefail
        DATE="${{ steps.check.outputs.date }}"
        STATE="${{ steps.check.outputs.state }}"
        if [ -z "${GH_TOKEN:-}" ]; then echo "no token — recovery dispatch skipped (honest no-op)"; exit 0; fi
        # Pre-deadline (PUBLISHING): dispatch ONLY once the remaining time to the artifact's own
        # publish deadline is smaller than the pipeline needs (75 min measured: projections ~12m +
        # production ~15m + products ~3m + build/deploy ~15m + margin). Before that point a
        # normally-drifting cron still has room to arrive on time, and this step stays quiet.
        if [ "$STATE" = "PUBLISHING" ]; then
          OVERDUE="$(node -e '
            const a = JSON.parse(require("fs").readFileSync("app/public/data/ops/publication-slo.json","utf8"));
            const dl = Date.parse(a.publishDeadlineUtc ?? "");
            if (!Number.isFinite(dl)) { console.log("no-deadline"); process.exit(0); }
            console.log(Date.now() >= dl - 75 * 60_000 ? "yes" : "no");
          ')"
          if [ "$OVERDUE" != "yes" ]; then
            echo "generator not yet overdue against the publish deadline — no pre-deadline dispatch"
            exit 0
          fi
        fi
        # IDEMPOTENCY. Every workflow carrying this action will reach this step on the same incident.
        # At most ONE automatic attempt per ET day: a second dispatch would re-run the paid odds
        # ingest against the same slate, which is the "spend twice on one recovery" failure the
        # program forbids. A human dispatch still works, and still counts as the day's attempt.
        ALREADY="$(gh run list --workflow=morning-projections.yml --limit 20 \
          --json createdAt,event --jq "[.[] | select((.createdAt | fromdateiso8601 | strftime(\"%Y-%m-%d\")) >= \"$DATE\")] | length" 2>/dev/null || echo 0)"
        if [ "${ALREADY:-0}" -gt 0 ]; then
          echo "morning-projections already has ${ALREADY} run(s) on or after $DATE — not dispatching again"
          exit 0
        fi
        echo "no generation run exists for $DATE — dispatching recovery ($STATE)"
        if ! gh workflow run morning-projections.yml --ref main \
          -f projections_date="$DATE" -f skip_nba=true; then
          # 2026-09-07: this failed with HTTP 403 (token lacked actions:write) and the quiet echo
          # buried the one fact that mattered. A failed recovery dispatch is loud now.
          echo "::warning::recovery dispatch FAILED — likely a missing 'actions: write' permission on the carrier workflow"
        fi

    - name: Complete a stalled recovery chain
      # P243 · A-7 (second half): GitHub suppresses workflow_run events from GITHUB_TOKEN
      # dispatches, so a recovered morning-projections run finishes and NOTHING downstream fires
      # (proven live on 2026-09-07: the chain needed a manual dispatch). Every carrier of this
      # action re-checks: a successful projections run for today with no production run after it,
      # 10+ minutes on, means the chain is stalled — dispatch the next link, once per day.
      if: inputs.dispatch-recovery == 'true' && steps.check.outputs.state != 'NO_EVENT' && steps.check.outputs.state != 'UNKNOWN'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -uo pipefail
        DATE="${{ steps.check.outputs.date }}"
        if [ -z "${GH_TOKEN:-}" ]; then echo "no token — chain check skipped (honest no-op)"; exit 0; fi
        VERDICT="$(gh run list --workflow=morning-projections.yml --limit 20 \
          --json createdAt,updatedAt,status,conclusion \
          --jq "[.[] | select((.createdAt | fromdateiso8601 | strftime(\"%Y-%m-%d\")) >= \"$DATE\")
                     | select(.status == \"completed\" and .conclusion == \"success\")
                     | .updatedAt] | sort | last // \"\"" 2>/dev/null || echo "")"
        if [ -z "$VERDICT" ]; then echo "no successful projections run for $DATE yet — nothing to chain"; exit 0; fi
        AGE_OK="$(node -e 'console.log(Date.now() - Date.parse(process.argv[1]) >= 10 * 60_000 ? "yes" : "no")' "$VERDICT")"
        if [ "$AGE_OK" != "yes" ]; then echo "projections finished under 10 minutes ago — the natural chain still has time"; exit 0; fi
        PROD="$(gh run list --workflow=mlb-daily-production.yml --limit 20 \
          --json createdAt --jq "[.[] | select(.createdAt >= \"$VERDICT\")] | length" 2>/dev/null || echo 0)"
        if [ "${PROD:-0}" -gt 0 ]; then echo "production already ran after projections — chain is intact"; exit 0; fi
        echo "projections succeeded at $VERDICT with no production run since — chaining was suppressed; dispatching mlb-daily-production"
        if ! gh workflow run mlb-daily-production.yml --ref main; then
          echo "::warning::chain-completion dispatch FAILED — likely a missing 'actions: write' permission on the carrier workflow"
        fi
