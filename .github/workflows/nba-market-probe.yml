name: nba-market-probe
on:
  workflow_dispatch:
    inputs:
      date: { description: "Slate date YYYY-MM-DD", type: string, required: false, default: "2026-06-10" }
permissions:
  contents: write
concurrency:
  group: nba-market-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Probe NBA markets (credit-bounded)
        run: python -m pipeline.probe_nba_markets --date "${{ github.event.inputs.date || '2026-06-10' }}"
      - name: Show result
        run: cat app/public/data/nba/market-probe-latest.json
      - name: Commit probe artifacts
        run: |
          git add app/public/data/nba/market-probe-latest.json docs/audits/nba-oddsapi-market-coverage-*.md 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "GametimePicks Bot"; git config user.email "noreply@github.com"
          git commit -m "auto: NBA OddsAPI market probe [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
