# Cron-fallback watchdog (Program 092-095 §6.5) — GitHub crons are best-effort and have skipped
# real morning runs. This checks, one hour after the morning-projections window, whether the day's
# primary generation actually happened, and dispatches the NORMAL workflow only when it provably
# did not. It cannot duplicate paid ingestion: it fires only when no board exists, no primary run
# happened, and no writer is queued/running — and the dispatched workflow re-enters its own credit
# guards and the shared writer queue. Decision logic lives in scripts/cron_watchdog.sh (tested).
name: cron-watchdog

on:
  schedule:
    # 14:30 UTC = 10:30 ET — after morning-projections (13:30 UTC) and before/near the
    # mlb-daily-production backstop (14:15 UTC) has finished queueing.
    # P256: an early check at 10:53 UTC (6:53 AM EDT) so a stalled morning chain is recovered before
    # 8:00 AM ET, and the original 14:30 check as a second look.
    - cron: "53 10 * * *"
    - cron: "30 14 * * *"
    # P197 · Release B: the single 14:30 UTC slot could not cover a weekend cluster's EARLIEST
    # kickoff (Saturday 11:30, Sunday 13:00 UTC) — the EPL monitoring stage recorded that as
    # residualGap rather than rounding it away. A 09:30 weekend slot runs BEFORE the earliest
    # kickoff either day, so a matchweek job that died overnight is caught while the fix still
    # matters, not three hours into the slate.
    - cron: "30 9 * * 6,0"
  workflow_dispatch:

# P253: this was `contents: read` from the day the job was written, and the job's last step
# commits a coverage report. So every run since built the report, committed it locally, took a
# 403 on the push, and threw it away — for three weeks, against a green board, while the report
# it could not publish said "34 missed slots". A workflow that writes needs write; the swallow
# that hid the 403 is removed in the commit step below.
permissions:
  contents: write
  actions: write

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Decide (tested logic, explicit inputs)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY_ET="$(TZ=America/New_York date +%F)"
          NEWEST_BOARD="$(ls app/public/data/mlb/boards 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | sed 's/\.json//')"
          [ -n "$NEWEST_BOARD" ] || NEWEST_BOARD=none
          PRIMARY_RUNS_TODAY="$(gh run list --workflow=morning-projections --created "$(date -u +%F)" --json databaseId --jq 'length' || echo 0)"
          # P256: the chain's head. Dealing today's cards before yesterday settles strands yesterday's
          # grades, so a recovery with no settlement today dispatches SETTLEMENT (which chains the rest),
          # never the morning refresh. Unknown (the query failed) is passed as empty, not 0.
          SETTLE_RUNS_TODAY="$(gh run list --workflow=nightly-settle --created "$(date -u +%F)" --status success --json databaseId --jq 'length' 2>/dev/null || echo "")"
          ACTIVE=0
          for wf in nightly-settle morning-projections mlb-daily-production; do
            n="$(gh run list --workflow="$wf" --status in_progress --json databaseId --jq 'length' || echo 0)"
            q="$(gh run list --workflow="$wf" --status queued --json databaseId --jq 'length' || echo 0)"
            ACTIVE=$((ACTIVE + n + q))
          done
          # Events that could STILL legitimately gain coverage (uncovered + pregame). The
          # classifier is free and read-only; its eligible set is exactly what a missed refresh
          # would have had a chance to fix.
          # NOTE the idiom: `grep -c` prints 0 AND exits 1 when there are no matches, so the
          # familiar `|| echo 0` appends a SECOND zero and yields "0\n0" — a malformed integer.
          # Caught live 2026-08-04. `|| true` keeps the single count under `set -e`.
          RECOVERABLE_EVENTS="$(node app/scripts/mlb-topup-classify.mjs 2>/dev/null \
                                 | grep -c 'MARKETS_AVAILABLE_ADD_OFFICIAL_PATCH' || true)"
          RECOVERABLE_EVENTS="${RECOVERABLE_EVENTS:-0}"
          echo "recoverable pregame events lacking coverage: $RECOVERABLE_EVENTS"
          OUT="$(TODAY_ET="$TODAY_ET" NEWEST_BOARD="$NEWEST_BOARD" \
                 PRIMARY_RUNS_TODAY="$PRIMARY_RUNS_TODAY" ACTIVE_RUNS="$ACTIVE" SETTLE_RUNS_TODAY="$SETTLE_RUNS_TODAY" \
                 RECOVERABLE_EVENTS="$RECOVERABLE_EVENTS" \
                 bash scripts/cron_watchdog.sh)"
          echo "$OUT"
          # The script emits TWO lines: the human decision, then WATCHDOG_STATE=. Parse them
          # separately — reading the whole capture as one string pollutes `reason` with the state
          # line (introduced when the state line was added; caught wiring the consumer).
          DECISION_LINE="$(printf '%s\n' "$OUT" | head -1)"
          STATE="$(printf '%s\n' "$OUT" | sed -n 's/^WATCHDOG_STATE=\([A-Z_]*\).*/\1/p')"
          echo "decision=${DECISION_LINE%% *}" >> "$GITHUB_OUTPUT"
          echo "reason=${DECISION_LINE#* }" >> "$GITHUB_OUTPUT"
          echo "state=${STATE:-UNKNOWN}" >> "$GITHUB_OUTPUT"
          # Machine-readable classification in the run summary — this is the consumer that makes
          # the six-state taxonomy operational rather than merely emitted.
          {
            echo "### Coverage watchdog"
            echo ""
            echo "- state: \`${STATE:-UNKNOWN}\`"
            echo "- decision: \`${DECISION_LINE%% *}\`"
            echo "- reason: ${DECISION_LINE#* }"
          } >> "$GITHUB_STEP_SUMMARY"

      # P256: the chain's head was missed — dispatch settlement; its completion chains the morning
      # band (settle → morning-projections → production → products). A GITHUB_TOKEN dispatch still
      # emits workflow_run for the next stage (observed live: every morning-projections dispatch
      # chained into mlb-daily-production).
      - name: Dispatch the missed settlement (chain head) and alert
        if: steps.decide.outputs.decision == 'DISPATCH_SETTLE'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: cron-watchdog
          EXIT_STATUS: "0"
          ERROR_LINE: "[${{ steps.decide.outputs.state }}] ${{ steps.decide.outputs.reason }}"
        run: |
          gh workflow run nightly-settle
          echo "::notice::cron-watchdog [${{ steps.decide.outputs.state }}] dispatched nightly-settle (chain head)"
          node app/scripts/ops-notify.mjs || true

      - name: Dispatch the missed primary and alert
        if: steps.decide.outputs.decision == 'DISPATCH'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: cron-watchdog
          EXIT_STATUS: "0"
          # The alert now carries the machine state, so an operator can tell a recovered missed
          # refresh (REFRESH_MISSING) from a never-generated board (BOARD_MISSING) without
          # reading prose.
          ERROR_LINE: "[${{ steps.decide.outputs.state }}] ${{ steps.decide.outputs.reason }}"
        run: |
          gh workflow run morning-projections
          echo "::notice::cron-watchdog [${{ steps.decide.outputs.state }}] dispatched morning-projections"
          bash scripts/ops_alert.sh

      # ── EPL matchday watch ───────────────────────────────────────────────────────────────────────
      #
      # The monitoring registry had EPL as `alerted: true, watched: false`, and its own gap text said
      # "alerted, but nothing watches whether the matchweek run happened at all". Alerting covers a run
      # that ran and broke; nothing covered a run that never started. GitHub crons are best-effort and
      # a morning cron has already silently skipped in this repo's history — which is exactly why MLB
      # has the watchdog above.
      #
      # EPL's stakes are concentrated rather than daily: a skipped run leaves the published forecast
      # silently stale for a whole matchweek while every surface keeps rendering it confidently.
      #
      # This slot is 14:30 UTC and EPL's first cron is 14:00 UTC, so a missed Friday opener is caught
      # 30 minutes later with hours to spare before a 19:00 kickoff. HONEST LIMIT: later clusters
      # (Saturday 09:00, Sunday 10:00) are only caught by this slot if their kickoff is still more
      # than the lead time away — full coverage would need a slot per cluster, and that is a follow-up
      # rather than a claim made here.
      #
      # Matchday is DERIVED from the committed fixture capture, never from the weekday: a watchdog
      # keyed to "it's Friday" goes quiet in precisely the weeks the schedule is unusual.
      - name: EPL matchday watch
        id: epl_watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAN_TODAY="$(gh run list --workflow=epl-matchweek --created "$(date -u +%F)" --json databaseId --jq 'length' || echo 0)"
          export RAN_TODAY
          node --input-type=module -e "
            import fs from 'node:fs';
            const { eplMatchdayWatch } = await import('./app/src/lib/sports/epl/matchday-watch.mjs');
            const dir = 'app/public/data/soccer/epl/fixtures';
            const cap = fs.readdirSync(dir).find((f) => f.startsWith('capture-') && f.endsWith('.json'));
            const fixtures = cap ? (JSON.parse(fs.readFileSync(dir + '/' + cap, 'utf8')).rows ?? []) : [];
            let gen = null;
            try { gen = JSON.parse(fs.readFileSync('app/public/data/soccer/epl/forecasts/latest.json', 'utf8')).generatedAt ?? null; } catch {}
            const out = eplMatchdayWatch({
              fixtures,
              nowIso: new Date().toISOString(),
              ranToday: Number(process.env.RAN_TODAY || '0') > 0,
              forecastGeneratedAt: gen,
            });
            console.log('epl-watch: ' + JSON.stringify(out));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'state=' + out.state + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dispatch=' + (out.shouldDispatch ? 'yes' : 'no') + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'reason=' + out.reason.replace(/[\r\n]+/g, ' ') + '\n');
          "

      - name: Dispatch the missed EPL matchweek and alert
        if: steps.epl_watch.outputs.dispatch == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: epl-matchday-watch
          EXIT_STATUS: "0"
          ERROR_LINE: "[${{ steps.epl_watch.outputs.state }}] ${{ steps.epl_watch.outputs.reason }}"
        run: |
          set -euo pipefail
          gh workflow run epl-matchweek
          echo "::notice::epl-matchday-watch [${{ steps.epl_watch.outputs.state }}] dispatched epl-matchweek"
          bash scripts/ops_alert.sh

      # ── A CANCELLED RUN IS NOT A MISSED SLOT AND NOT A FAILURE ──────────────────────────────────
      #
      # P258: every writer shares the gtp-generated-artifacts queue (guarded — the July-30 lost board),
      # and GitHub keeps ONE pending run per group: a second pending run replaces the first, which
      # ends "cancelled". Normally a later run covers it. When nothing does, the day's slate never
      # lands — and slot coverage (a run fired) and failure alerts (not a failure) both stay quiet.
      # Recovery re-dispatches the earliest stranded stage; the chain carries the rest, and the paid
      # stages re-enter their once-per-ET-day gates, so this cannot buy odds twice. Skipped when the
      # decision above already dispatched the chain.
      - name: Morning-chain cancel watch
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node app/scripts/ops/chain-cancel-watch.mjs | tee /tmp/chain.txt
          { echo "### Morning-chain cancel watch"; echo '```'; cat /tmp/chain.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-dispatch the stranded chain stage and alert
        if: steps.chain.outputs.state == 'STRANDED' && steps.decide.outputs.decision != 'DISPATCH' && steps.decide.outputs.decision != 'DISPATCH_SETTLE'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: chain-cancel-watch
          EXIT_STATUS: "0"
          ERROR_LINE: "[STRANDED] ${{ steps.chain.outputs.reason }}"
        run: |
          set -euo pipefail
          # Chain order: re-running the EARLIEST stranded stage re-runs everything after it.
          STAGE="$(grep -m1 -oE '^(morning-projections|mlb-daily-production|daily-products): STRANDED' /tmp/chain.txt | cut -d: -f1)"
          gh workflow run "${STAGE}.yml"
          echo "::warning::chain-cancel-watch: ${STAGE} was cancelled with no later success today — re-dispatched"
          bash scripts/ops_alert.sh

      # ── THE FREE FEEDS THE ENGINES STAND ON ─────────────────────────────────────────────────────
      #
      # ESPN, StatsAPI, nflverse, football-data.co.uk and the NWS cost nothing and page no one when
      # they change shape — a capture writes an empty file and a model runs on less. REPORT ONLY, like
      # the slot check below was at first: a detector that has not been quiet through a real week has
      # not earned the right to page. The runner retries once and always exits 0.
      - name: Free data-feed health (report only)
        continue-on-error: true
        id: feeds
        run: |
          set -euo pipefail
          node app/scripts/ops/feed-health.mjs --json app/public/data/ops/feed-health.json | tee /tmp/feeds.txt
          { echo "### Free data-feed health"; echo '```'; cat /tmp/feeds.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          STATE="$(sed -n 's/^FEED_HEALTH state=\([A-Z]*\).*/\1/p' /tmp/feeds.txt)"
          if [ "$STATE" != "OK" ]; then
            echo "::warning::free data-feed health $STATE — $(grep '^FAIL' /tmp/feeds.txt | tr -s ' ' | cut -d' ' -f2 | paste -sd, -)"
          fi

      # ── IS TODAY'S FIGHT CARD PRICED? ───────────────────────────────────────────────────────────
      #
      # P265. On 2026-09-12 the Saturday capture slot (11:00 UTC) had not fired by 13:12 UTC, the card
      # was at 18:00 UTC, and the published odds still described the previous event. Nothing noticed:
      # slot coverage only asks whether a run exists, failure alerts only fire on a failed run, and the
      # matchday watch beside this one covers football only.
      #
      # It judges the ARTIFACT, not the schedule — a capture that ran and produced last week's prices is
      # not coverage — and it refuses past the first bout, because the feed serves in-play prices then.
      # The dispatch spends one credit against the UFC receipt, the same authorised capture the Tue/Thu/Sat
      # schedule makes, and only on a fight day whose card is still unpriced inside the lead window.
      - name: UFC fight-day watch
        id: ufc_watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAN_TODAY="$(gh run list --workflow=ufc-fight-week --created "$(date -u +%F)" --json databaseId --jq 'length' || echo 0)"
          export RAN_TODAY
          node --input-type=module -e "
            import fs from 'node:fs';
            const { ufcFightdayWatch } = await import('./app/src/lib/sports/ufc/fightday-watch.mjs');
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; } };
            const card = read('app/public/data/ufc/card-latest.json');
            const odds = read('app/public/data/ufc/odds-latest.json');
            const out = ufcFightdayWatch({
              card,
              oddsEventId: odds?.event?.providerEventId ?? null,
              nowIso: new Date().toISOString(),
              ranToday: Number(process.env.RAN_TODAY || '0') > 0,
            });
            console.log('ufc-watch: ' + JSON.stringify(out));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'state=' + out.state + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dispatch=' + (out.shouldDispatch ? 'yes' : 'no') + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'reason=' + out.reason.replace(/[\r\n]+/g, ' ') + '\n');
          "

      - name: Dispatch the missed UFC capture and alert
        if: steps.ufc_watch.outputs.dispatch == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: ufc-fightday-watch
          EXIT_STATUS: "0"
          ERROR_LINE: "[${{ steps.ufc_watch.outputs.state }}] ${{ steps.ufc_watch.outputs.reason }}"
        run: |
          set -euo pipefail
          gh workflow run ufc-fight-week.yml
          echo "::notice::ufc-fightday-watch [${{ steps.ufc_watch.outputs.state }}] dispatched ufc-fight-week"
          bash scripts/ops_alert.sh

      # ── Cross-sport cron-slot check (UFC / NFL / EPL / MLB) ──────────────────────────────────────
      #
      # The step above recovers the MLB chain and knows nothing about the other sports. This one asks
      # a different question for all of them: did each SCHEDULED run actually fire? It deliberately
      # does not look at output — those sports have quiet weeks (no card, a bye, an international
      # break) and alarming on "produced nothing" would cry wolf every one of them.
      #
      # REPORTS ONLY, ON PURPOSE. It does not page and does not dispatch. On its first live run this
      # check raised five missed slots and every one predated the workflow existing; the creation
      # floor that fixed it is one commit old. A check that has never been quiet through a real week
      # has not earned the right to wake anyone, so it writes a ::notice:: and nothing else until it
      # has. Promoting it to ops_alert.sh is a deliberate follow-up, not an oversight.
      #
      # `continue-on-error` + `|| true`: this is an observer bolted onto the MLB recovery job, and it
      # must never be the reason that job fails.
      - name: Cron-slot coverage (report only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Unshallow enough history to date each workflow file; the floor needs the ADD commit.
          git fetch --deepen=1000 --quiet 2>/dev/null || true
          OUT=app/public/data/ops/cron-slot-watchdog.json
          node app/scripts/ops/cron-slot-watchdog.mjs \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json "$OUT" | tee /tmp/slots.txt || true
          MISSED="$(node -e "try{console.log(require('./$OUT').missedTotal)}catch{console.log(0)}")"
          if [ "$MISSED" != "0" ]; then
            echo "::notice::cron-slot watchdog: $MISSED missed slot(s) — see $OUT (report-only; not paging yet)"
          fi
          # A workflow that FIRES AND FAILS is not a quiet week. nfl-event-window failed all three of
          # its daily slots on 2026-08-21 while this watchdog reported OK, because it only ever asked
          # whether a run existed. This surfaces the other half at WARNING, above a missed slot: a
          # slot that never fired may simply have had nothing to do, whereas a run that crashed had
          # work and did not do it.
          FAILING="$(node -e "try{console.log(require('./$OUT').failingTotal)}catch{console.log(0)}")"
          if [ "$FAILING" != "0" ]; then
            echo "::warning::cron-slot watchdog: $FAILING workflow(s) fired and FAILED their most recent run(s) — see $OUT"
            node -e "
              const r = require('./$OUT');
              for (const [s, v] of Object.entries(r.sports ?? {}))
                if (v && v.consecutiveFailures > 0)
                  console.log('::warning::' + s + ' (' + v.workflow + '): last ' + v.consecutiveFailures + ' run(s) ' + v.lastConclusion);
            " || true
          fi

      # ── A JOB THAT NEVER EXISTED LEAVES NO TRACE IN RUN HISTORY ────────────────────────────────
      #
      # Everything above watches JOBS: did a slot fire, and did the run end well. Neither could see
      # what went wrong with UFC, because nothing broke — build-ufc-ladder was in no workflow at all,
      # so there was no run to miss and no failure to report. A ladder from 2026-08-18 served an
      # event on 2026-08-22 for four days while every surface reported the sport live, against a
      # completely green board.
      #
      # The only evidence of that is the OUTPUT. This reads each sport's lane-status artifact and
      # reports the combinations that cannot both be true — a lane calling itself live while its
      # cards belong to another event, or one whose settler cannot grade what it publishes.
      # ── DID IT RUN, AND DID IT RUN ON TIME ────────────────────────────────────────────────────
      #
      # The step above answers the first question. It has answered it correctly and uselessly for
      # three weeks: from 2026-08-27 this repo's scheduled dispatch drifted to 2.5-5 hours late, and
      # a drift wider than cron-slots' ±2h tolerance comes out of it labelled MISSED — the same word
      # it uses for a slot that never fired at all. Everyone read the missed slots as GitHub being
      # GitHub. Nobody had a number for how late anything actually was.
      #
      # This produces that number, and produces it here rather than in its own workflow ON PURPOSE:
      # a punctuality instrument that is itself a fresh cron would be one more thing to be dispatched
      # four hours late, and — worse — one more artifact that can quietly stop regenerating. Bolting
      # it to a job that already runs daily and already commits keeps it in the same failure domain
      # as the report beside it, where a single push covers both.
      #
      # NOT continue-on-error, unlike the observer above. That step was allowed to fail because it
      # was bolted onto the MLB recovery job and must never be why recovery fails. This one runs
      # after every recovery decision has already been made, so a failure here costs nothing but a
      # red job — which is the point, since a silent instrument is the failure being fixed.
      - name: Cron punctuality (how late, not just whether)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=app/public/data/ops/cron-punctuality.json
          node app/scripts/ops/cron-punctuality.mjs \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --days 7 --json "$OUT" | tee /tmp/punct.txt
          STATE="$(node -e "try{console.log(require('./$OUT').summary.state)}catch{console.log('UNKNOWN')}")"
          MEDIAN="$(node -e "try{console.log(require('./$OUT').summary.fleetMedianDelayMinutes)}catch{console.log('null')}")"
          case "$STATE" in
            SEVERE)
              echo "::error::cron punctuality $STATE — scheduled dispatch is running a median of ${MEDIAN} minutes late across the measurable fleet. The morning band is not arriving in the morning." ;;
            DEGRADED)
              echo "::warning::cron punctuality $STATE — median ${MEDIAN} minutes late across the measurable fleet." ;;
            UNKNOWN)
              echo "::warning::cron punctuality could not be measured — this is not evidence that dispatch is healthy." ;;
            *)
              echo "cron punctuality $STATE (median ${MEDIAN}m)" ;;
          esac
          {
            echo "### Cron punctuality"
            echo ""
            echo '```'
            cat /tmp/punct.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check each lane agrees with itself
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=app/public/data/ops/lane-staleness.json
          npx tsx app/scripts/ops/lane-staleness-watch.mjs \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json "$OUT" | tee /tmp/lanes.txt || true
          WORST="$(node -e "try{console.log(require('./$OUT').worst)}catch{console.log('UNKNOWN')}")"
          if [ "$WORST" = "ALERT" ]; then
            echo "::error::lane staleness: a published lane contradicts itself — see $OUT"
            grep -E '^  ALERT' /tmp/lanes.txt | while read -r line; do echo "::error::$line"; done
          elif [ "$WORST" = "WARN" ]; then
            echo "::warning::lane staleness: see $OUT"
          fi

      # NOT continue-on-error. It used to be, and that is exactly how a 403 on every push since
      # 2026-08-20 stayed invisible: the report was built, committed locally, refused by the
      # remote, and discarded, while the step — and the job — reported success. An observer that
      # cannot publish its observation is DOWN, and a down observer must look down.
      #
      # The retry is for the one failure this genuinely shares with every other writer here: a
      # concurrent bot push moving main under us. That is transient and rebasing fixes it. A 403,
      # a protected branch or a missing token is not transient, and after three tries this step
      # fails and takes the job red — which is the only way anyone finds out.
      - name: Commit the coverage report
        run: |
          set -euo pipefail
          git config user.name  "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Allowlisted single file. An artifact that is generated and never committed is the
          # 62-hour-outage shape, and this repo has hit it twice.
          git add app/public/data/ops/cron-slot-watchdog.json app/public/data/ops/lane-staleness.json \
                  app/public/data/ops/cron-punctuality.json app/public/data/ops/feed-health.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no coverage change"; exit 0; fi
          git commit -m "auto: cron-slot coverage $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "coverage report published (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::coverage push attempt ${attempt} failed — retrying"
            sleep $((attempt * 5))
          done
          echo "::error::cron-slot coverage could not be published after 3 attempts — the watchdog's own report is not reaching main, which is how this went unnoticed for three weeks"
          exit 1
