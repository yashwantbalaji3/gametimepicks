name: ufc-fight-week

# A UFC week has a rhythm, and this follows it rather than a generic daily tick:
#   Tuesday    the next card is the story — full model read published for the week
#   Thursday   mid-week refresh; replacements and late bookings land here
#   Saturday   the last look before the card walks
#
# 11:00 UTC = 7am ET, so each refresh is on the site before the US morning. GitHub crons are
# best-effort and drift 20-60 minutes in this repo; that is fine for a cadence measured in days.
on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesday
    - cron: "0 11 * * 4"   # Thursday
    - cron: "0 11 * * 6"   # Saturday
  workflow_dispatch:

concurrency:
  group: gtp-generated-artifacts     # the one queue every generated-data writer shares
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Stamped before any step runs, so "was this written by THIS run" has an anchor.
      - name: Record the run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: app/package-lock.json }
      # The lockfile lives in app/, not at the repo root. Without this the step dies on
      # "npm ci can only install with an existing package-lock.json" — which is how this workflow
      # failed on its very first scheduled run and captured nothing.
      - run: npm ci
        working-directory: app

      # ── FREE SOURCES ONLY ──────────────────────────────────────────────────
      # ESPN's MMA scoreboard is a public JSON endpoint with no key. The card and
      # every model head are computed from it plus the committed fight corpus, so
      # this whole job costs nothing and can run three times a week indefinitely.
      #
      # Prices are now refreshed too, under a SEPARATE committed receipt
      # (docs/receipts/ODDS_AUTHORIZATION_UFC.md, founder-authorised 2026-08-18):
      # UFC/MMA only, h2h only, us region only, bulk endpoint only, 500-credit
      # cumulative ceiling. That receipt cannot fund an NFL call and the NFL one
      # cannot fund this — the parser refuses a receipt naming another sport key
      # in both directions, and each sport keeps its own cumulative ledger.
      #
      # One bulk call prices the whole card for ONE credit (markets x regions =
      # 1 x 1). Three runs a week is ~3 credits, so the ceiling is roughly three
      # years of this cadence: a circuit breaker, not a budget.
      - name: Capture the next card (auto-advances past a finished event)
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/capture-ufc-events.mjs --now "$NOW"

      - name: Rebuild the card with the three model heads
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/build-ufc-card.mjs --now "$NOW"

      # Fight-winner prices. Fail-closed on the receipt, the cumulative ledger and
      # the duplicate-request window, so a re-run inside 30 minutes cannot re-buy
      # prices we already hold. `|| echo` keeps a refusal from failing the whole
      # job: no prices is a legitimate state, and the eligibility gate closes the
      # Lab stream on its own while they are stale.
      - name: Refresh fight-winner prices (1 credit, UFC receipt)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY is not configured — skipping the priced step, card and model heads still refreshed"
            exit 0
          fi
          node app/scripts/ufc/capture-ufc-odds.mjs --now "$NOW" --apply || \
            echo "ufc odds: refused or unavailable this run — see the step log; nothing was spent beyond what the ledger records"

      - name: Settle any card that has now been fought
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/capture-ufc-results.mjs --now "$NOW" || \
            echo "no newly-settled UFC card — the honest state between events"

      # With fresh prices UFC can clear the Lab's eligibility gate, so the grids
      # are re-resolved here. Multi is included deliberately: a second live sport
      # is exactly what opens the cross-sport lane, and it must not wait a day.
      # THE UFC RISK LADDER — and until now it was in no workflow at all.
      #
      # The only ladder on disk was written by hand on 2026-08-18 for an event on 2026-08-22, and
      # nothing had rebuilt it since. The tier grid served it through a latest.json fallback and
      # published it under a third date entirely. A card surface built on that would have shown
      # four-day-old selections under tonight's heading.
      #
      # Runs BEFORE the tier grids, which consume it. Non-fatal: a week with no scheduled card
      # publishes no ladder and says so.
      - name: Build the UFC risk ladder
        working-directory: app
        run: |
          set -uo pipefail
          node scripts/ufc/build-ufc-ladder.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || \
            echo "::warning::UFC risk ladder refused this run"

      - name: Re-resolve the parlay tier grids
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for SPORT in mlb ufc nfl epl multi; do
            node app/scripts/parlays/build-tier-grid.mjs --sport "$SPORT" --now "$NOW" || \
              echo "tier grid $SPORT: refused this run"
          done

      # A zero exit code means the command returned; it does not mean the pipeline ran. This run
      # produced these or it failed — the class fix for three green-but-broken jobs in one day.
      - name: Assert this run produced its artifacts
        run: |
          set -euo pipefail
          node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" \
            app/public/data/ufc/card-latest.json

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Allowlisted paths only. A generated-data job never touches money artifacts.
          git add app/public/data/ufc/schedule app/public/data/ufc/card-latest.json \
                  app/public/data/ufc/schedule-latest.json app/public/data/ufc/graded-moneylines-latest.json \
                  app/public/data/ufc/odds-latest.json app/public/data/parlays/tier-grid \
                  app/public/data/parlays/risk-ladder-ufc \
                  data/internal/research/odds/ufc/authorization-ledger.json \
                  data/internal/research/odds/ufc/shadow-snapshot-latest.json \
                  "data/internal/research/odds/ufc/shadow-snapshot-"*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "auto: ufc fight-week refresh $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PHASE: ufc-fight-week
        run: |
          # One alert per failed run, built and redacted by scripts/ops_alert.sh so every workflow
          # reports the same contract (docs/OPS_ALERTING_CONTRACT.md). Never exits non-zero: the
          # failing step above is what fails the run.
          EXIT_STATUS="${EXIT_STATUS:-1}" bash scripts/ops_alert.sh
