name: ufc-fight-week

# A UFC week has a rhythm, and this follows it rather than a generic daily tick:
#   Tuesday    the next card is the story — full model read published for the week
#   Thursday   mid-week refresh; replacements and late bookings land here
#   Saturday   the last look before the card walks
#
# 11:00 UTC = 7am ET, so each refresh is on the site before the US morning. GitHub crons are
# best-effort and drift 20-60 minutes in this repo; that is fine for a cadence measured in days.
on:
  schedule:
    # ── THE PRICED CADENCE, unchanged: three runs a week, ~3 credits. ──────────────────────────
    - cron: "0 11 * * 2"   # Tuesday
    - cron: "0 11 * * 4"   # Thursday
    - cron: "0 11 * * 6"   # Saturday
    # ── THE FREE CADENCE ──────────────────────────────────────────────────────────────────────
    #
    # Everything in this job except ONE step is free: the card, the three model heads, results
    # capture, the model card, the ladder and the lane status all read committed artifacts or the
    # public ESPN scoreboard. Only the odds refresh spends a credit.
    #
    # Running only Tue/Thu/Sat meant that after a Saturday card the newest card artifact described a
    # FOUGHT event until Tuesday morning — three days out of every seven where the hub had no read
    # for the next card because nothing had built one. The page now says "Last card" instead of
    # calling it next, which is the honesty fix; this is the freshness one, and both are needed.
    #
    # 13:00 UTC daily, after the sport-schedules capture at ~13:20 has refreshed the forward event
    # list the card builder scans. The priced step below is gated OFF on this cron, so the credit
    # burn is unchanged.
    - cron: "0 13 * * 0,1,3,5"
  workflow_dispatch:

concurrency:
  group: gtp-generated-artifacts     # the one queue every generated-data writer shares
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Stamped before any step runs, so "was this written by THIS run" has an anchor.
      - name: Record the run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: app/package-lock.json }
      # The lockfile lives in app/, not at the repo root. Without this the step dies on
      # "npm ci can only install with an existing package-lock.json" — which is how this workflow
      # failed on its very first scheduled run and captured nothing.
      - run: npm ci
        working-directory: app

      # ── FREE SOURCES ONLY ──────────────────────────────────────────────────
      # ESPN's MMA scoreboard is a public JSON endpoint with no key. The card and
      # every model head are computed from it plus the committed fight corpus, so
      # this whole job costs nothing and can run three times a week indefinitely.
      #
      # Prices are now refreshed too, under a SEPARATE committed receipt
      # (docs/receipts/ODDS_AUTHORIZATION_UFC.md, founder-authorised 2026-08-18):
      # UFC/MMA only, h2h only, us region only, bulk endpoint only, 500-credit
      # cumulative ceiling. That receipt cannot fund an NFL call and the NFL one
      # cannot fund this — the parser refuses a receipt naming another sport key
      # in both directions, and each sport keeps its own cumulative ledger.
      #
      # One bulk call prices the whole card for ONE credit (markets x regions =
      # 1 x 1). Three runs a week is ~3 credits, so the ceiling is roughly three
      # years of this cadence: a circuit breaker, not a budget.
      - name: Capture the next card (auto-advances past a finished event)
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/capture-ufc-events.mjs --now "$NOW"

      - name: Rebuild the card with the three model heads
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/build-ufc-card.mjs --now "$NOW"

      # POPULATION-EXACT OR RED (P197 · Release A1). The 08-22 card shipped 7 of 13 bouts looking
      # complete; this re-fetches the provider's own event and refuses (exit 2, job fails) when the
      # just-built card and the authority disagree. A fetch failure is SOURCE_STALE and exits 0 —
      # last-known-good stands; only a PROVEN mismatch is a failure.
      - name: Audit card population against the provider's own event
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd app && npx --yes tsx scripts/ufc/audit-ufc-card-population.mjs --now "$NOW" --write)

      # LINEAGE ON A CADENCE (P199 · Release A1). The classifier existed since Aug 12; nothing ran
      # it on a schedule, so a fight-week replacement would have been an unrecorded diff between
      # two files nobody compared. Diffs the two newest dated captures; a quiet week records
      # NO_CHANGE — fight week is exactly when "nothing changed" must be a fact, not an assumption.
      - name: Track card lineage against the previous capture
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd app && npx --yes tsx scripts/ufc/track-ufc-card-lineage.mjs --now "$NOW" --write)

      # Fight-winner prices. Fail-closed on the receipt, the cumulative ledger and
      # the duplicate-request window, so a re-run inside 30 minutes cannot re-buy
      # prices we already hold. `|| echo` keeps a refusal from failing the whole
      # job: no prices is a legitimate state, and the eligibility gate closes the
      # Lab stream on its own while they are stale.
      # SPENDS A CREDIT, so it runs ONLY on the three priced crons and on a manual dispatch —
      # never on the daily free refresh added above. A cost boundary that depends on remembering
      # not to schedule something is not a boundary; this one is a condition on the step itself.
      - name: Refresh fight-winner prices (1 credit, UFC receipt)
        if: github.event_name != 'schedule' || contains(fromJSON('["0 11 * * 2","0 11 * * 4","0 11 * * 6"]'), github.event.schedule)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY is not configured — skipping the priced step, card and model heads still refreshed"
            exit 0
          fi
          node app/scripts/ufc/capture-ufc-odds.mjs --now "$NOW" --apply || \
            echo "ufc odds: refused or unavailable this run — see the step log; nothing was spent beyond what the ledger records"

      - name: Settle any card that has now been fought
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/ufc/capture-ufc-results.mjs --now "$NOW" || \
            echo "no newly-settled UFC card — the honest state between events"

      # With fresh prices UFC can clear the Lab's eligibility gate, so the grids
      # are re-resolved here. Multi is included deliberately: a second live sport
      # is exactly what opens the cross-sport lane, and it must not wait a day.
      # Re-evaluate BEFORE the card is built. The card builder refuses to publish against an
      # evaluation computed from different code than is running — which is exactly what happened for
      # four days when the model library was edited eighteen minutes after the last evaluation and
      # nobody re-ran it. Running it here makes the refusal unreachable in the normal case.
      - name: Re-evaluate the fight model and write its card
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/ufc/evaluate-ufc-fight-model.mjs
          node scripts/ufc/build-ufc-model-card.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # THE UFC RISK LADDER — and until now it was in no workflow at all.
      #
      # The only ladder on disk was written by hand on 2026-08-18 for an event on 2026-08-22, and
      # nothing had rebuilt it since. The tier grid served it through a latest.json fallback and
      # published it under a third date entirely. A card surface built on that would have shown
      # four-day-old selections under tonight's heading.
      #
      # Runs BEFORE the tier grids, which consume it. Non-fatal: a week with no scheduled card
      # publishes no ladder and says so.
      - name: Build the UFC risk ladder
        working-directory: app
        run: |
          set -uo pipefail
          node scripts/ufc/build-ufc-ladder.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || \
            echo "::warning::UFC risk ladder refused this run"

      # THE PRE-FIGHT COMPARISON: what the model said, and what the market said, on the same bouts.
      #
      # The gate has recorded UFC calibration as UNPROVEN because the model had "never been compared
      # against a no-vig line". Every ingredient was already on disk — the model's winner probability,
      # both sides' posted prices, the official results — and nothing joined them. That is a missing
      # instrument, not a small sample, and it is the fixable half.
      #
      # Runs AFTER the ladder so it sees the same card the ladder was built from. Non-fatal: a week
      # with no card, or a card with no usable price, records nothing and says so.
      - name: Record the pre-fight model-vs-market comparison
        working-directory: app
        run: |
          set -uo pipefail
          npx tsx scripts/ufc/capture-ufc-model-vs-market.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write || \
            echo "::warning::UFC model-vs-market snapshot refused this run"

      # The product-state contract for this lane. Built LAST so it summarises what this run produced,
      # and it checks the two things that silently broke the lane before: whether the published
      # ladder belongs to the card on the page, and whether the settler can grade this sport at all.
      #
      # working-directory AND tsx: it imports the sport gate and the eligibility module.
      - name: Publish the UFC lane status
        working-directory: app
        run: |
          set -uo pipefail
          npx tsx scripts/ufc/build-ufc-lane-status.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || \
            echo "::warning::UFC lane status refused this run"

      - name: Re-resolve the parlay tier grids
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for SPORT in mlb ufc nfl epl multi; do
            node app/scripts/parlays/build-tier-grid.mjs --sport "$SPORT" --now "$NOW" || \
              echo "tier grid $SPORT: refused this run"
          done

      # A zero exit code means the command returned; it does not mean the pipeline ran. This run
      # produced these or it failed — the class fix for three green-but-broken jobs in one day.
      - name: Assert this run produced its artifacts
        run: |
          set -euo pipefail
          node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" \
            app/public/data/ufc/card-latest.json

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Allowlisted paths only. A generated-data job never touches money artifacts.
          git add app/public/data/ufc/schedule app/public/data/ufc/card-latest.json \
                  app/public/data/ufc/schedule-latest.json app/public/data/ufc/graded-moneylines-latest.json \
                  app/public/data/ufc/odds-latest.json app/public/data/parlays/tier-grid \
                  app/public/data/parlays/risk-ladder-ufc app/public/data/admin/ufc-lane.json \
                  app/public/data/ufc/fight-model-evaluation.json data/internal/research/ufc/model-card-fight-v1.json \
                  data/internal/research/ufc/model-vs-market \
                  data/internal/research/ufc/population \
                  data/internal/research/ufc/lineage \
                  data/internal/research/odds/ufc/authorization-ledger.json \
                  data/internal/research/odds/ufc/shadow-snapshot-latest.json \
                  "data/internal/research/odds/ufc/shadow-snapshot-"*.json \
                  data/internal/research/odds/ufc/acquisitions/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "auto: ufc fight-week refresh $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PHASE: ufc-fight-week
        run: |
          # One alert per failed run, built and redacted by scripts/ops_alert.sh so every workflow
          # reports the same contract (docs/OPS_ALERTING_CONTRACT.md). Never exits non-zero: the
          # failing step above is what fails the run.
          EXIT_STATUS="${EXIT_STATUS:-1}" bash scripts/ops_alert.sh
