# NFL live player-prop tracking (Phase 5 · V1).
#
# ⚠ WHY THIS IS DENSE AND SCHEDULED EARLY, not "every 5 minutes from kickoff".
#
# GitHub's scheduled delivery in this repository is min 1h40m, median 2h52m, max 4h55m late over 40
# observations — not one punctual run. A cron asking to fire at kickoff fires somewhere in the
# second half. What a dense schedule DOES deliver is a dense STREAM: publication-watchdog runs every
# 30 minutes and its runs arrive a median of 27 minutes apart. So the slots sit EARLIER than the
# band they cover, and the producer decides what is actually live from the canonical schedule.
#
# THE PRODUCER OWNS THE LIFECYCLE, NOT THE CRON:
#   pregame           outside the window — no fetch, and a PRE read publishes no stat and no score
#   kickoff passed    inside the window — factual polling begins
#   in progress       the stat so far, the clock and the score are refreshed
#   final             the final stat is captured and the prediction settles ONCE
#   settled           the game leaves the loop and is not polled again
#
# FREE. ESPN's public summary endpoint: no provider credit, no key, and no paid lane is touched —
# which is why a fifteen-minute cadence is affordable at all.
name: nfl-live-props

on:
  schedule:
    # Sunday: the 1pm and 4pm ET blocks and the night game. Slots run 13:00-23:45Z so the delivered
    # stream covers roughly 16:00Z through the small hours.
    - cron: "*/15 13-23 * * 0"
    # Monday night, and the tail of Sunday night that spills past midnight UTC.
    - cron: "*/15 0-4 * * 1"
    - cron: "*/15 20-23 * * 1"
    # Thursday night.
    - cron: "*/15 20-23 * * 4"
    - cron: "*/15 0-4 * * 5"
  workflow_dispatch:
    inputs:
      event:
        description: "A single providerEventId to track, or empty for every live game"
        required: false
      dry_run:
        description: "Read and report, write nothing"
        required: false
        default: "false"

concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Capture live player-prop state
        id: capture
        working-directory: app
        run: |
          set -euo pipefail
          ARGS=(--now "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          if [ -n "${{ github.event.inputs.event }}" ]; then ARGS+=(--event "${{ github.event.inputs.event }}"); fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/nfl/capture-live-props.mjs "${ARGS[@]}" | tee /tmp/live.txt

      # ── PHASE H · THE LIVE-ODDS PROBE, THEN THE BOUNDED PILOT ───────────────────────────────────
      #
      # Both are hosted here because this is the only job that runs WHILE games are in play, and both
      # decide for themselves whether to spend. Nothing about this cron's timing is load-bearing:
      #
      #   the probe    fires once, ever, on the first run that finds a game genuinely in progress,
      #                and is a no-op on every run afterwards whatever its verdict
      #   the pilot    refuses until the probe has PASSED, enforces its own ~30-minute interval
      #                against the last recorded call, and stops at 90 Phase H credits
      #
      # So a fifteen-minute cron cannot overspend a thirty-minute cadence, and the repository's own
      # measured cron lateness (1h40m to 4h55m) cannot either — the bounds are on the ledger, not on
      # the schedule. `continue-on-error` because a provider hiccup must not fail the live-stat lane
      # that shares this job; the credit ledger records a charged failure either way.
      - name: Phase H · live-odds probe (one 3-credit call, only while a game is in play)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        working-directory: app
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/nfl/probe-nfl-live-odds.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --authorized

      - name: Phase H · bounded live-odds pilot (refuses until the probe passes)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        working-directory: app
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/nfl/capture-nfl-live-odds.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --authorized --write

      # ── THE DURABLE RECORD (Phase D) ────────────────────────────────────────────────────────────
      #
      # The artifacts above are the CURRENT state and are rewritten on every poll; the ledger is the
      # append-only record they feed. It runs here so a settled row is recorded in the same run that
      # settled it, and AGAIN in the daily lifecycle — because an official stat correction arrives
      # long after this workflow has stopped running for that game, and the fold only ever re-reads
      # committed evidence, so applying one later costs nothing and reopens no polling.
      #
      # It grades nothing: every result is copied from the settlement the producer already wrote.
      - name: Fold settled rows into the prop-settlement ledger
        if: github.event.inputs.dry_run != 'true'
        working-directory: app
        run: node scripts/nfl/settle-nfl-live-props.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write

      # A run with no live game is the normal case for most of the week and must not look like a
      # failure, so the commit step exits clean when nothing changed.
      - name: Commit the live state
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Path-scoped: the live artifacts this run rewrote, and the ledger they were folded into.
          # Path-scoped: the live artifacts, the settlement ledger, and Phase H's probe verdict,
          # credit ledger and current-market artifact. A writer whose output is outside its job's
          # allowlist is an artifact that is built and never published — this repo has lost three
          # days of an archive to exactly that.
          git add app/public/data/nfl/live-props/ data/internal/nfl/prop-settlement/ \
                  data/internal/research/odds/nfl/ app/public/data/nfl/live-markets/
          if git diff --cached --quiet; then echo "no live change"; exit 0; fi
          git commit -m "auto: nfl live props $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "live state published (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::live-props push attempt ${attempt} failed — retrying"
            sleep $((attempt * 5))
          done
          echo "::error::live player-prop state could not be published after 3 attempts"
          exit 1
