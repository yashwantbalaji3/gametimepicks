# ufc-results-refresh.yml — derive UFC results + grade moneylines from free data
# (Greco1899 UFCStats CSVs, GPL-3.0). Derived artifacts only; no raw CSV, no picks.
name: ufc-results-refresh
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "Build + print only", type: boolean, required: false, default: false }
concurrency: { group: ufc-results-refresh, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: "America/New_York" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: python -m pip install --upgrade pip && pip install requests
      - name: Build results, grade moneylines, rebuild readiness
        run: |
          set -e
          python -m pipeline.ufc.build_results
          python -m pipeline.ufc.grade_moneylines
          python -m pipeline.ufc.build_readiness
      - name: Summary
        run: |
          python -c "import json;d=json.load(open('app/public/data/ufc/results-latest.json'));print('results final',d['finalBoutCount'],'latest',d['latestEventDate'])"
          python -c "import json;d=json.load(open('app/public/data/ufc/readiness-latest.json'));print('publicLevel',d['publicLevel'],'gradingReady',d['gradingReady'],'projectionsReady',d['projectionsReady'],'parlayReady',d['parlayReady'])"
      - name: Commit derived UFC artifacts only (no raw CSV)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git add app/public/data/ufc/results-latest.json app/public/data/ufc/graded-moneylines-latest.json app/public/data/ufc/readiness-latest.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "GametimePicks Bot"; git config user.email "noreply@github.com"
          git commit -m "auto: refresh UFC results + moneyline grading (derived, GPL-attributed) [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
          exit 1
