# NFL player props — P300 blind forward test (research only, $0, free nflverse data CC BY 4.0).
#
# Grades finished weeks, then forecasts the next week BEFORE its first kickoff, and commits only derived files
# under data/internal/research/nfl/replay/player-props-share-level-forward/. Nothing here touches app/, so the
# Vercel ignore step skips the build. Protocol: data/internal/research/nfl/reports/player-props-share-level-forward-protocol.json
name: nfl-props-forward-shadow

on:
  schedule:
    # Both run ahead of nfl-event-window (14:30/15:00/21:00 UTC), which builds the public player board from these files.
    - cron: "30 13 * 9-12,1 *"  # daily 09:30 ET in season — grades when snap sheets land, forecasts once stats are in
    - cron: "0 20 * 9-12,1 4"   # Thursday 16:00 ET — a second chance before Thursday Night Football
  workflow_dispatch: {}

# OWN group: a shared group can silently cancel a pending run (P257).
concurrency:
  group: nfl-props-forward-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full commit history (no blobs) so grading can read when each forecast file was first committed.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Grade finished weeks
        run: |
          set -euo pipefail
          node scripts/research/nfl/forward-player-props-share-level.mjs --grade --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # !cancelled(): a grading failure must not silently skip the pre-kickoff forecast (P265).
      - name: Forecast the next week
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/research/nfl/forward-player-props-share-level.mjs --forecast --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Commit derived files
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/internal/research/nfl/replay/player-props-share-level-forward/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto: P300 player props forward shadow [skip ci]"
          for a in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $a) — merging origin/main (never rebase: the forecast commit date is the on-time proof)"
            git fetch origin main
            git merge --no-edit origin/main
            sleep $((a * 5))
          done
          echo "::error::push never landed after 4 attempts"
          exit 1
