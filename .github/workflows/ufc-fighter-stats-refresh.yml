# ----------------------------------------------------------------------------
# ufc-fighter-stats-refresh.yml — derive UFC fighter stats from the Greco1899
# UFCStats CSVs (GPL-3.0, daily-refreshed) and update the derived artifact +
# readiness. DERIVED FEATURES ONLY — never raw CSVs, never picks. UFC-only writes.
# ----------------------------------------------------------------------------
name: ufc-fighter-stats-refresh
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + print only; do not commit."
        type: boolean
        required: false
        default: false
concurrency: { group: ufc-fighter-stats-refresh, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { TZ: "America/New_York" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: python -m pip install --upgrade pip && pip install requests
      - name: Build fighter stats + readiness (derived only)
        run: |
          set -e
          python -m pipeline.ufc.build_fighter_stats
          python -m pipeline.ufc.build_readiness
      - name: Show summary
        run: |
          python -c "import json;d=json.load(open('app/public/data/ufc/fighters-latest.json'));print('fighters',d['fighterCount'],'fights',d['fightCount'],'latest',d['latestFightDate'],'license',d['sourceLicense'])"
          python -c "import json;d=json.load(open('app/public/data/ufc/readiness-latest.json'));print('publicLevel',d['publicLevel'],'fighterStatsReady',d['fighterStatsReady'],'projectionsReady',d['projectionsReady'],'parlayReady',d['parlayReady'])"
      - name: Commit derived UFC artifacts only (no raw CSV)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git add app/public/data/ufc/fighters-latest.json app/public/data/ufc/readiness-latest.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "GametimePicks Bot"; git config user.email "noreply@github.com"
          git commit -m "auto: refresh UFC fighter stats (derived, GPL-attributed) [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
          exit 1
