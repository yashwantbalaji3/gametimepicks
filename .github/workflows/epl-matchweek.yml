name: epl-matchweek

# Premier League matchweek refresh — fixtures, prices, and the parlay grids.
#
# TIMING IS PRE-KICKOFF BY CONSTRUCTION. The receipt permits captures before kickoff only, and
# EPL's earliest regular kickoff is Saturday 12:30 UK (11:30 UTC in summer). GitHub crons are
# best-effort and routinely drift an hour or more, so these fire at 07:00 UTC — 08:00 UK — which
# still lands ahead of the earliest kickoff even after a 90-minute drift.
#
#   Thursday  previews the whole weekend once the fixtures are settled
#   Saturday  refreshes before the Saturday matches
#   Sunday    refreshes before the Sunday matches
#
# Three captures a matchweek at 2 credits each is 6 credits, against a 500-credit ceiling.
on:
  schedule:
    # ── NIGHT BEFORE · the product is finished before anyone sleeps ─────────────────────────────
    #
    # Each of these fires at 21:00 UTC the evening before a matchday and produces the COMPLETE
    # publishable set for it: fresh prices, a forecast for every fixture the ladder can price, and
    # player projections. runEplShadow measures odds freshness at BUILD time rather than against
    # kickoff, so a 21:00 capture builds a perfectly valid forecast for an 11:30 kickoff the next
    # morning — 14.5h ahead, and published while there is still a whole night to notice a problem.
    #
    # This is the answer to cron drift. GitHub's scheduler is best-effort and has drifted well over
    # an hour in this repository; the lineup slots below sit only an hour ahead of kickoff, so one
    # bad drift puts them past it, where the engine refuses them. When that happens the night-before
    # set is what the page keeps showing. It is a floor under the product, not a replacement for
    # what comes after.
    - cron: "0 21 * * 4"  # Thursday evening — for a Friday fixture
    - cron: "0 21 * * 5"  # Friday evening   — for the Saturday clusters
    - cron: "0 21 * * 6"  # Saturday evening — for the Sunday clusters
    - cron: "0 21 * * 0"  # Sunday evening   — for a Monday fixture
    #
    # ── LINEUP TIME · and why these CANNOT move to the night before ─────────────────────────────
    #
    # These are not a second opinion on the same product. They are the only slots that can produce
    # the real one.
    #
    # Until a lineup is published the player model can answer only a CONDITIONAL question —
    # P(scores | he starts) — because it does not know who is playing. Once ESPN posts the XI, the
    # match simulation allocates the team's goal distribution across the named eleven and every
    # player row becomes coherent with the team forecast by construction: the shares sum to one, so
    # the players sum to the team. Lineups appear about an hour before kickoff and not before, so a
    # run the night before cannot see one no matter how well it is written. Moving these earlier
    # would not deliver the same product sooner; it would quietly replace it with a weaker one.
    #
    # Real 2026-27 slots (UTC): Fri 19:00 · Sat 11:30/14:00/16:30 · Sun 13:00/15:30 · Mon 19:00.
    # Every cluster is served ~1h ahead — checked mechanically against the committed fixture list by
    # lib/sports/epl/lineup-slot-coverage.mjs, which counts MATCHES rather than clusters.
    - cron: "0 18 * * 5"  # Friday   — 19:00 kickoff
    - cron: "30 10 * * 6" # Saturday — 11:30 cluster
    - cron: "0 13 * * 6"  # Saturday — 14:00 cluster
    - cron: "30 15 * * 6" # Saturday — 16:30 cluster
    - cron: "0 12 * * 0"  # Sunday   — 13:00 cluster
    - cron: "30 14 * * 0" # Sunday   — 15:30 cluster
    - cron: "0 18 * * 1"  # Monday   — 19:00 kickoff
    #
    # ── WHAT THIS COSTS, MEASURED AND NOT ESTIMATED ────────────────────────────────────────────
    #
    # The old cadence had no fixture guard: every slot called the provider whether or not a match
    # was coming, so a week with no Friday and no Monday match still bought prices for both.
    # Projected against the real 380-fixture season that spends 892 credits. The receipt's ceiling
    # is 500. Nothing said so, because nothing multiplied the crons by the season — the ledger's
    # per-call check would have found it in February, as every remaining fixture fell to
    # READY_EXCEPT_ODDS with no explanation on the page.
    #
    # The capture now refuses to spend unless a kickoff falls within 30 hours. Guarded by
    # lib/sports/epl/odds-budget.mjs, which reads THESE cron lines, the committed fixture list and
    # the real ledger, and fails the suite if the cadence cannot finish the season.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan the capture without spending"
        type: boolean
        default: false

concurrency:
  group: epl-matchweek
  cancel-in-progress: false

jobs:
  matchweek:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record the run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app

      # Fixtures come from a public-domain source with no key, so this half costs nothing and is
      # safe to run whether or not the priced step below is authorised or configured.
      # working-directory: app AND npx tsx, neither optional. This script reaches lib/soccer/epl-clubs.ts, which
      # imports "@/lib/..." — an alias declared in app/tsconfig.json and therefore only resolvable
      # with app/ as the working directory. Run from the repository root it dies MODULE_NOT_FOUND
      # every single time, and the `|| echo` below caught the failure and printed "fixtures unchanged
      # or unavailable this run" — a reassuring sentence over a step that had never once worked.
      - name: Refresh the fixture list
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx tsx scripts/epl/capture-epl-fixtures.mjs --now "$NOW" || \
            echo "fixtures unchanged or unavailable this run"

      # Prices, under docs/receipts/ODDS_AUTHORIZATION_EPL.md: EPL only, h2h + totals, us region,
      # bulk endpoint only, 500-credit cumulative ceiling, its own ledger. The receipt cannot fund an
      # NFL or UFC call and neither of theirs can fund this — the parser refuses a receipt naming
      # another sport key in every direction.
      #
      # `|| echo` keeps a refusal from failing the job: no prices is a legitimate state, and the
      # Parlay Lab's eligibility gate closes the EPL stream on its own while they are stale.
      - name: Capture match result + total goals (2 credits)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node app/scripts/epl/capture-epl-odds.mjs --now "$NOW"
            exit 0
          fi
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "ODDS_API_KEY is not configured — skipping the priced step; fixtures still refreshed"
            exit 0
          fi
          node app/scripts/epl/capture-epl-odds.mjs --now "$NOW" --apply || \
            echo "epl odds: refused or unavailable this run — see the step log; nothing was spent beyond what the ledger records"

      - name: Settle any match that has finished
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/epl/capture-epl-results.mjs --now "$NOW" || \
            echo "no newly-settled EPL match — the honest state between matchweeks"

      # ---- Grading: the loop that makes the record mean something ----
      #
      # Joins each finished match to the forecast that was published BEFORE its kickoff and appends
      # the hit or the miss. Runs after settlement so results/latest.json is fresh, and before the
      # forecast rebuild so a match that just finished is graded against what we actually said.
      #
      # The ledger is APPEND-ONLY and a graded row is immutable — this is a DAILY job writing to a
      # CUMULATIVE record, which is the exact shape that wiped two ledgers in one day.
      #
      # Its failure is deliberately NOT raised here. The grader exits non-zero on a BROKEN JOIN
      # (completed fixtures that none of our forecasts could be matched to), and failing at this
      # point would abort the run BEFORE the commit step and throw away the odds capture and the
      # forecasts this run legitimately produced. Same lesson as the assertion below: a check that
      # reports on work must never be the reason the work is lost. The status is carried forward and
      # raised after the commit.
      - name: Grade finished matches against their pre-kickoff forecasts
        working-directory: app
        run: |
          set -uo pipefail
          if npx tsx scripts/epl/grade-epl-forecasts.mjs --write; then
            echo "GRADE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "GRADE_STATUS=refused" >> "$GITHUB_ENV"
          fi

      # ---- Player grading ----
      #
      # The team forecasts have been graded since they existed; player projections shipped without any
      # of it — publishing and never learning, which is the shape this repo keeps finding.
      #
      # Runs after the team grader and before the rebuild, so a match that just finished is scored
      # against what was actually published before kickoff. A CONDITIONAL row is VOIDED when its
      # condition did not hold: "if he starts" against a substitute is not a miss, and scoring it
      # would punish the model for refusing to guess a lineup. Voids are written too, so the
      # population reconciles.
      #
      # Same failure handling as the team grader: a broken join exits non-zero, and that is raised
      # AFTER the commit so a refusal never costs the run its artifacts.
      - name: Grade player projections against official results
        working-directory: app
        run: |
          set -uo pipefail
          if npx tsx scripts/epl/grade-epl-player-projections.mjs --write; then
            echo "PLAYER_GRADE_STATUS=ok" >> "$GITHUB_ENV"
          else
            echo "PLAYER_GRADE_STATUS=refused" >> "$GITHUB_ENV"
          fi

      # ---- Forecasts ----
      #
      # Runs AFTER the odds capture (it consumes odds/latest.json) and AFTER settlement (so a match
      # that just finished is no longer in the forward window). Without this step the chain captured
      # prices and predicted nothing: capture, evaluate, replay and simulate all existed while
      # NOTHING turned fixtures + odds + strength into a published forecast.
      #
      # Fail-loud: the builder REFUSES its whole set if any row claims CURRENT_PRE_EVENT without
      # probabilities, and that refusal must fail the run rather than be swallowed. A forecast set
      # that looks like coverage and carries no prediction is worse than an absent one.
      - name: Build EPL forecasts
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/epl/build-epl-forecasts.mjs --now "$NOW" --lookahead-hours 96 --write

      # ---- Player projections ----
      #
      # Runs AFTER the team forecasts because it projects the SAME priced fixture set. The model
      # cleared its preregistered bars (holdout 2024-25, log loss 0.25062 against a 0.26043
      # position-only baseline) and the generator REFUSES to run at all if the recorded verdict is
      # ever anything other than ACCEPTED — a published probability beside a named person is the last
      # place to fail open.
      #
      # It reads ESPN's lineup when one is posted and falls back to the CONDITIONAL quantity when it
      # is not. That is why the extra pre-kickoff crons above exist: lineups land about an hour before
      # kickoff, and the matchweek's own slots are hours earlier, so without a late run every row
      # would stay conditional through the match itself.
      #
      # Not fail-loud: a projection set is additive. If it cannot build, the team forecasts and the
      # odds capture still commit, and the page renders its honest empty state.
      - name: Build EPL player projections
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node app/scripts/epl/build-epl-player-projections.mjs --now "$NOW" --write || \
            echo "player projections: refused this run — the team forecast is unaffected"

      # With real prices EPL can clear the Parlay Lab's eligibility gate, so the grids are
      # re-resolved. `multi` is included deliberately: a second live sport is what opens the
      # cross-sport lane, and it must not wait a day.
      - name: Re-resolve the parlay tier grids
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for SPORT in mlb ufc nfl epl multi; do
            node app/scripts/parlays/build-tier-grid.mjs --sport "$SPORT" --now "$NOW" || \
              echo "tier grid $SPORT: refused this run"
          done

      # See ufc-fight-week: a green step is not evidence the pipeline ran.
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Allowlisted paths only. A generated-data job never touches money artifacts.
          # The forecast set is a generated artifact; an artifact that is not allowlisted is
          # regenerated and dropped at the end of every run, which is the shape that hid the
          # model-learning audit for weeks.
          git add app/public/data/soccer/epl app/public/data/parlays/tier-grid \
                  data/internal/research/epl/forecasts \
                  data/internal/research/odds/epl/authorization-ledger.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "auto: epl matchweek refresh $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Runs AFTER the commit, deliberately. It used to sit before, and a legitimate skip — the
      # odds capture refusing a duplicate request inside its 60-minute window — failed the job
      # BEFORE the commit step, so a forecast this run genuinely produced was generated and
      # thrown away. A check that reports on work must never be the reason the work is lost.
      - name: Assert this run produced its artifacts
        run: |
          set -euo pipefail
          # The forecast set is asserted alongside the odds: a run that captured prices and produced
          # no forecast is the exact failure this chain had before the builder existed, and it must
          # not pass silently just because the capture half worked.
          # SPLIT INTO TWO ASSERTIONS, because these artifacts have different obligations and a
          # single call could only express the weakest of them.
          #
          # The forecasts MUST be written by every run. They were previously covered by
          # --allow-missing, which meant a run that produced NO forecast at all would have passed
          # this check — the precise failure the check exists to catch. No tolerance now.
          # The public copy is asserted beside the private one: it is what /epl, the nine per-fixture
          # reports and the Simulate hub actually read.
          node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" \
            data/internal/research/epl/forecasts/latest.json \
            app/public/data/soccer/epl/forecasts/latest.json

          # The odds capture DEDUPLICATES inside a 60-minute window, so "not rewritten by this run"
          # is its correct behaviour. On 2026-08-20 that legitimate skip failed the job — and because
          # the assert then sat BEFORE the commit, nine forecasts the run had genuinely produced were
          # discarded. The ordering is fixed; this fixes the classification. 90 minutes gives the
          # 60-minute window slack for a long run without tolerating a capture that has stopped.
          #
          # A DRY RUN IS EXEMPT, and only a dry run. dry_run exists so the chain can be rehearsed
          # against the last committed capture for zero credits — it does not call the provider, so
          # it cannot possibly refresh this file, and asserting otherwise made dry_run unable to pass
          # by construction. A rehearsal that always ends red teaches its readers to ignore red,
          # which costs more than the check was ever worth. The exemption is announced rather than
          # silent: a skipped assertion that says nothing is indistinguishable from one that passed.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run — odds freshness NOT asserted; this run called no provider and refreshed no prices."
          else
            node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" --max-age-min 90 \
              app/public/data/soccer/epl/odds/latest.json
          fi

      # Raised AFTER the commit, so a refusal reports loudly without costing the run its artifacts.
      - name: Raise a grading refusal
        run: |
          set -euo pipefail
          FAILED=0
          if [ "${GRADE_STATUS:-ok}" != "ok" ]; then
            echo "::error::EPL forecast grading REFUSED — completed fixtures could not be joined to any"
            echo "::error::pre-kickoff forecast. This is a broken join, not a quiet matchday. Do not trust"
            echo "::error::any calibration built on this ledger until the eventId agreement is checked."
            FAILED=1
          fi
          if [ "${PLAYER_GRADE_STATUS:-ok}" != "ok" ]; then
            echo "::error::EPL PLAYER grading REFUSED — finished fixtures produced neither a grade nor a"
            echo "::error::void, which means nothing joined at all. Check playerId agreement between the"
            echo "::error::projection snapshots and the ESPN result rosters."
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "grading: ok"

      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PHASE: epl-matchweek
        run: |
          # One alert per failed run, built and redacted by scripts/ops_alert.sh so every workflow
          # reports the same contract (docs/OPS_ALERTING_CONTRACT.md). Never exits non-zero: the
          # failing step above is what fails the run.
          EXIT_STATUS="${EXIT_STATUS:-1}" bash scripts/ops_alert.sh
