# NBA results refresh — the ONE writer of NBA finals (Session 14 · NBA department).
#
# ⚠ WHY THIS EXISTS. NBA finals were captured only inside sport-schedules (cron 09:07Z, delivered 14–17Z), so
# a game that ended at 02:00Z showed "Final not recorded yet" on /nba/ for ~13–18 h (2026-10-04's finals first
# recorded 2026-10-05T15:47Z). Opening night is 2026-10-20, launch day. This workflow runs the SAME two scripts
# on denser, delivered clocks; sport-schedules no longer carries the NBA results steps, so there is one writer.
#
#   capture-nba-results.mjs     → app/public/data/nba/results/latest.json   (rolling 9-day window)
#   build-nba-finals-record.mjs → app/public/data/nba/results/finals-<season>.json  (write-once season record)
#
# Nothing here changes what counts as a final: the scripts, the current-results adapter's acceptance rules and
# the write-once finals record are unchanged. A game absent from the record is pending, never a loss.
#
# CLOCKS. Hourly cron, a denser cron across the post-game hours (00–07Z: US evening games end ~01:30–05:30Z),
# and `workflow_run` on publication-watchdog (dense 12–22Z) — the clocks nba-forecast-window relies on. Every
# cron here is best-effort; a missed tick only delays a final to the next one.
#
# ⚠ OWN CONCURRENCY GROUP, DELIBERATELY NOT gtp-generated-artifacts (same reason as nba-forecast-window: a dense
# tick in the shared writer group would cancel a pending daily-products / settle run). It writes only
# app/public/data/nba/results/**; a lost push race re-captures on the new main, up to 3 times.
#
# COMMITS ONLY ON PUBLISHABLE CONTENT. Rows carry capturedAt stamps and in-progress status; a change to latest.json in
# only those is dropped (results-publishable.mjs, COST-001 2026-10-09), and a new final in finals-<season>.json is
# never discarded with it (the rule sport-schedules used).
#
# FREE: no secrets, no paid provider, no npm install (the scripts are dependency-free .mjs). A commit under
# app/public/data triggers the Vercel build (scripts/vercel-ignore-build.sh), so a new final deploys on its own.
name: nba-results-refresh

on:
  schedule:
    - cron: "41 * * * *"
    - cron: "11,26 0-7 * * *"
  workflow_run:
    workflows: ["publication-watchdog"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Capture and report, but never commit"
        required: false
        default: "false"

concurrency:
  group: nba-results-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    # THE TRUST BOUNDARY ON A workflow_run TRIGGER: only a default-branch run may tick this; nothing from the
    # triggering run is read or executed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      finals_committed: ${{ steps.capture.outputs.finals_committed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Capture NBA results, fold finals, commit if content changed
        id: capture
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULTS=app/public/data/nba/results
          git fetch -q origin main
          for ATTEMPT in 1 2 3; do
            git reset -q --hard origin/main
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # A 4xx from the provider is a contract change: the capture exits 1 and the run goes red. Network /
            # 5xx / malformed payloads exit 0 having written nothing (last-known-good stands).
            (cd app && node scripts/nba/capture-nba-results.mjs --now "$NOW") || { echo "::error::NBA results capture refused"; exit 1; }
            (cd app && node scripts/nba/build-nba-finals-record.mjs --now "$NOW") || { echo "::error::NBA finals record refused"; exit 1; }
            # Level A: grade the ALL-NBA cards these finals settle, in this same commit — so a card is graded when its
            # last final lands, not at the next nightly-settle (about 5 hours later), and with no build of its own.
            # Idempotent and append-only; re-run from fresh main on every attempt below. Mixed cards stay with
            # nightly-settle. Non-fatal: a grader problem never holds back the finals. Runs only when this capture
            # changed a finals file (most refreshes do not), so a quiet run costs nothing extra.
            FINALS_CHANGED=0
            if [ -n "$(git status --porcelain -- "$RESULTS"/finals-*.json)" ]; then
              FINALS_CHANGED=1
              (cd app && npx --yes tsx scripts/products/grade-level-a-suggestions.mjs --now "$NOW" --only-sport nba --write) \
                || echo "::warning::Level A NBA grading did not complete (exit $?) — nightly-settle grades these cards"
            fi
            git add "$RESULTS/"
            git add data/internal/products/level-a/graded.jsonl
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            # COST-001 Stage A (2026-10-09): commit latest.json only when it changes something a reader can see — a
            # final, a corrected final, a postponement, a schedule change or the window state
            # (app/src/lib/sports/nba/results-publishable.mjs). Capture stamps AND in-progress status/live scores no
            # longer commit: no reader uses them, and each commit was a full Vercel build (25 in the week to 10-09).
            if node app/scripts/nba/results-publishable.mjs "$RESULTS/latest.json"; then
              # Nothing publishable moved in latest.json: put THAT file back, but keep anything else staged — a new
              # final in finals-<season>.json must never be discarded with a window refresh.
              echo "only stamps / in-progress state moved in latest.json — keeping the committed window"
              git reset -q -- "$RESULTS/latest.json"
              git checkout -q -- "$RESULTS/latest.json"
            fi
            if git diff --cached --quiet; then echo "nothing but stamps — no commit"; exit 0; fi
            git diff --cached --stat
            if [ "$DRY_RUN" = "true" ]; then echo "dry run — not committing"; exit 0; fi
            git commit -q -m "auto: nba results capture $NOW [skip ci]"
            if git push -q origin HEAD:main; then echo "committed on attempt $ATTEMPT"; echo "finals_committed=$FINALS_CHANGED" >> "$GITHUB_OUTPUT"; exit 0; fi
            # Lost a race with another writer: re-capture on the new main (the finals record is write-once).
            echo "::warning::push lost a race (attempt $ATTEMPT) — re-capturing on the new main"
            sleep $((ATTEMPT * 15))
            git fetch -q origin main
          done
          echo "::error::could not push after 3 attempts"
          exit 1

  # NEXT-SLATE CLOCK (founder 2026-10-30). A new final is exactly the moment nba-forecast-window may freeze and publish
  # the next ET slate (lib/sports/nba/next-slate-publication.mjs), and it lands overnight, where no dependable clock
  # ticks the window. So a run that COMMITTED a new final dispatches the window — a GITHUB_TOKEN workflow_dispatch
  # starts a fresh chain (a workflow_run source here would put nba-finals-waiter past GitHub's 4-workflow limit; see
  # workflow-trigger-depth.test.mjs). The window is a free decider: it HOLDs unless the slate's last final is in.
  # No checkout, no secret beyond the token, `actions: write` only; a failed dispatch only warns.
  tick-window:
    needs: refresh
    if: needs.refresh.outputs.finals_committed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Tick nba-forecast-window (next-slate publication)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run nba-forecast-window.yml --ref main \
            || echo "::warning::could not tick nba-forecast-window — its crons and publication-watchdog still do"
