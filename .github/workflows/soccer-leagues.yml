# Soccer leagues beyond the Premier League (P257) — model-only forecasts for every ACCEPTED league. $0.
#
# A league is here only because its preregistered walk-forward backtest accepted it
# (docs/SOCCER_LEAGUE_EXPANSION.md; lib/sports/soccer/leagues.mjs stage ACCEPTED_V1). The Premier League
# keeps its own pipeline (epl-matchweek.yml) and is skipped. Sources are free: openfootball results (public domain)
# refresh the history the model is fit on; ESPN's public scoreboard supplies the fixtures.
#
# Fail loud: a builder refusal (a club that does not map to its history, ESPN unreachable) fails the run
# rather than publishing a partial page. Commits only the corpora and the forecast files.
name: soccer-leagues

on:
  schedule:
    - cron: "15 9 * * *"   # 05:15 ET daily — in place before the 8 AM ET morning site (GitHub runs late)
    - cron: "0 15 * * 5"   # Friday midday — fixtures for a Friday-evening kickoff
    - cron: "0 9 * * 6,0"  # Saturday/Sunday morning — a second look before the weekend rounds
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but never commit"
        required: false
        default: "false"

# OWN group (P257): GitHub keeps ONE pending run per concurrency group and cancels the older pending one
# when another queues — in the shared gtp-generated-artifacts group this run was silently cancelled on its
# first dispatch, and could in turn cancel a pending daily-products run. The push step retries with rebase,
# which is what actually protects against a racing push.
concurrency:
  group: soccer-leagues
  cancel-in-progress: false

permissions:
  contents: write
  # P0 10-28 (U7): the failure step below opens or updates ONE tracking issue. Nothing else uses it.
  issues: write

jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Which leagues publish (accepted, not the Premier League)
        id: leagues
        working-directory: app
        run: |
          set -euo pipefail
          L=$(node --input-type=module -e 'import { SOCCER_LEAGUES } from "./src/lib/sports/soccer/leagues.mjs"; console.log(SOCCER_LEAGUES.filter((l) => l.stage === "ACCEPTED_V1" || (l.stage === "LIVE" && l.key !== "epl")).map((l) => l.key).join(","))')
          echo "keys=$L" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing leagues: ${L:-none}"

      - name: Refresh the league history (openfootball, public domain)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/soccer/capture-openfootball.mjs --leagues "${{ steps.leagues.outputs.keys }}"

      - name: Grade finished matches against their last pre-kickoff forecast (append-only)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IFS=',' read -ra KEYS <<< "${{ steps.leagues.outputs.keys }}"
          for k in "${KEYS[@]}"; do
            node scripts/soccer/grade-league-forecasts.mjs --league "$k" --now "$NOW"
          done

      - name: Build the forecasts (fail loud on any refusal of a whole run)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IFS=',' read -ra KEYS <<< "${{ steps.leagues.outputs.keys }}"
          for k in "${KEYS[@]}"; do
            node scripts/soccer/build-league-forecasts.mjs --league "$k" --now "$NOW"
          done

      - name: Commit and push
        if: steps.leagues.outputs.keys != '' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internal/research/soccer/*/corpus-openfootball-v1.json data/internal/research/soccer/*/history-openfootball-v1.json app/public/data/soccer/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: soccer league forecasts [skip ci]"
          for a in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $a) — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
            sleep $((a * 5))
          done
          echo "::error::push never landed after 4 attempts"; exit 1

      # P0 10-28 (U7): the 10-26 run failed and nobody heard — Ligue 1 then showed played matches as upcoming for two
      # days. A failed SCHEDULED run now opens or updates ONE tracking issue (the data-contract-check.yml pattern). It
      # runs only after a failure, commits nothing and changes nothing about what the job publishes or when.
      - name: Open or update the tracking issue (scheduled run failed)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          {
            echo "The scheduled soccer-leagues run failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) — $RUN_URL"
            echo
            echo "Leagues: ${{ steps.leagues.outputs.keys }}. Until a run succeeds, the league pages keep their last forecast set;"
            echo "they mark kicked-off matches and show a stale banner once the data is more than 30 hours old."
            echo
            echo "main HEAD $(git rev-parse --short HEAD)"
          } > /tmp/body.md
          n="$(gh issue list --state open --search 'soccer-leagues scheduled run failing in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body-file /tmp/body.md
          else gh issue create --title "soccer-leagues scheduled run failing" --body-file /tmp/body.md; fi
