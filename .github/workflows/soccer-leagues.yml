# Soccer leagues beyond the Premier League (P257) — model-only forecasts for every ACCEPTED league. $0.
#
# A league is here only because its preregistered walk-forward backtest accepted it
# (docs/SOCCER_LEAGUE_EXPANSION.md; lib/sports/soccer/leagues.mjs stage ACCEPTED_V1). The Premier League
# keeps its own pipeline (epl-matchweek.yml) and is skipped. Sources are free: football-data.co.uk results
# refresh the history the model is fit on; ESPN's public scoreboard supplies the fixtures.
#
# Fail loud: a builder refusal (a club that does not map to its history, ESPN unreachable) fails the run
# rather than publishing a partial page. Commits only the corpora and the forecast files.
name: soccer-leagues

on:
  schedule:
    - cron: "15 9 * * *"   # 05:15 ET daily — in place before the 8 AM ET morning site (GitHub runs late)
    - cron: "0 15 * * 5"   # Friday midday — fixtures for a Friday-evening kickoff
    - cron: "0 9 * * 6,0"  # Saturday/Sunday morning — a second look before the weekend rounds
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build but never commit"
        required: false
        default: "false"

# OWN group (P257): GitHub keeps ONE pending run per concurrency group and cancels the older pending one
# when another queues — in the shared gtp-generated-artifacts group this run was silently cancelled on its
# first dispatch, and could in turn cancel a pending daily-products run. The push step retries with rebase,
# which is what actually protects against a racing push.
concurrency:
  group: soccer-leagues
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Which leagues publish (accepted, not the Premier League)
        id: leagues
        working-directory: app
        run: |
          set -euo pipefail
          L=$(node --input-type=module -e 'import { SOCCER_LEAGUES } from "./src/lib/sports/soccer/leagues.mjs"; console.log(SOCCER_LEAGUES.filter((l) => l.stage === "ACCEPTED_V1" || (l.stage === "LIVE" && l.key !== "epl")).map((l) => l.key).join(","))')
          echo "keys=$L" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing leagues: ${L:-none}"

      - name: Refresh the league history (football-data.co.uk, current season)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/soccer/capture-football-data.mjs --leagues "${{ steps.leagues.outputs.keys }}" --seasons 2627

      - name: Grade finished matches against their last pre-kickoff forecast (append-only)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IFS=',' read -ra KEYS <<< "${{ steps.leagues.outputs.keys }}"
          for k in "${KEYS[@]}"; do
            node scripts/soccer/grade-league-forecasts.mjs --league "$k" --now "$NOW"
          done

      - name: Build the forecasts (fail loud on any refusal of a whole run)
        if: steps.leagues.outputs.keys != ''
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IFS=',' read -ra KEYS <<< "${{ steps.leagues.outputs.keys }}"
          for k in "${KEYS[@]}"; do
            node scripts/soccer/build-league-forecasts.mjs --league "$k" --now "$NOW"
          done

      - name: Commit and push
        if: steps.leagues.outputs.keys != '' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/internal/research/soccer/*/corpus-football-data-v1.json app/public/data/soccer/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auto: soccer league forecasts [skip ci]"
          for a in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $a) — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
            sleep $((a * 5))
          done
          echo "::error::push never landed after 4 attempts"; exit 1
