# MLB Pregame Research Capture — forward-only INTERNAL shadow pipeline (ENABLED, non-blocking).
#
# Internal research data collection ONLY. It NEVER touches money, the official record, settlement, Bank Builder,
# Moonshot, product eligibility, public UI, or the public static build. The job is `continue-on-error`, so it can
# fail without affecting anything, and it never runs on pull_request.
#
# Persistence: every run uploads its snapshots/freezes/status as a workflow ARTIFACT (safe, no push). Durable
# in-repo accumulation is an explicit operator OPT-IN — set the repo variable PREGAME_ARCHIVE_COMMIT=true to
# enable the path-scoped commit step (it only ever touches data/internal/mlb/pregame-archive/).
#
# StatsAPI is free / no key. The `markets` family (paid Odds API) is not fetched here.
name: mlb-pregame-capture

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, ET). Defaults to today (UTC)."
        required: false
      reason:
        description: "Snapshot reason (SCHEDULED_REFRESH | LINEUP_CONFIRMED | FINAL_PREGAME_FREEZE | MANUAL_RESEARCH_REFRESH)"
        required: false
        default: MANUAL_RESEARCH_REFRESH
  # Conservative fixed UTC captures across the pregame progression. GitHub cron is APPROXIMATE (can be delayed or
  # skipped under load) — correctness does NOT depend on exact firing: the per-game eligibility gate
  # (capturedAt < eventStartTime) makes any post-start capture ineligible, and multiple daily runs capture the
  # information progression (probables/weather early → confirmed lineups near first pitch).
  schedule:
    - cron: "0 11 * * *"              # ~07:00 ET — T-24h schedule/probables/weather shell
    - cron: "0 15,17,19,21,23 * * *"  # ~11:00,13:00,15:00,17:00,19:00 ET — probables→lineups→confirmed
    - cron: "30 22 * * *"             # ~18:30 ET — T-30m final for ~19:00 ET first pitches
    - cron: "0 1 * * *"               # ~21:00 ET — late/West-coast games

concurrency:
  group: mlb-pregame-capture
  cancel-in-progress: false

# Read is enough for capture + artifact upload. Write is used ONLY by the gated, opt-in commit step below.
permissions:
  contents: write

jobs:
  capture:
    # Never on pull_request (there is no PR trigger; this is belt-and-suspenders).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # NON-BLOCKING: research capture is allowed to fail without affecting any official product behavior.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Capture pregame snapshots (StatsAPI, free)
        run: node app/scripts/capture-mlb-pregame-research.mjs --date "${{ github.event.inputs.date }}" --reason "${{ github.event.inputs.reason || 'SCHEDULED_REFRESH' }}"
      - name: Capture pregame MARKET snapshots (paid Odds API — OPT-IN, credit-guarded, non-blocking)
        if: vars.PREGAME_ARCHIVE_MARKETS == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MIN_CREDITS_REMAINING: ${{ vars.ODDS_API_MIN_CREDITS_REMAINING }}
        # Team markets only by default (~3 credits/run). Writes only when the var is set AND the secret exists;
        # the script's own credit floor + skip-started guards protect the budget. StatsAPI capture above is
        # unaffected if this step is skipped or fails.
        run: node app/scripts/capture-mlb-pregame-markets.mjs --date "${{ github.event.inputs.date }}" --markets h2h,spreads,totals --write
      - name: Capture pregame PLAYER-PROP snapshots (paid Odds API per-event — SEPARATE OPT-IN, credit-guarded, non-blocking)
        if: vars.PREGAME_ARCHIVE_PLAYER_PROPS == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MIN_CREDITS_REMAINING: ${{ vars.ODDS_API_MIN_CREDITS_REMAINING }}
          PREGAME_ARCHIVE_PLAYER_PROP_MARKETS: ${{ vars.PREGAME_ARCHIVE_PLAYER_PROP_MARKETS }}
          PREGAME_ARCHIVE_PLAYER_PROP_MAX_EVENTS: ${{ vars.PREGAME_ARCHIVE_PLAYER_PROP_MAX_EVENTS }}
        # Per-event props cost ~1 credit/market (≈ events × markets). CAPPED for daily validation: --max-events
        # defaults to 3 (≈ 27 credits/run) even if the var is unset, so the conservative cap is always enforced.
        # Separate opt-in from team markets; the script's own credit floor + max-events guards protect the budget.
        # Team/StatsAPI capture above is unaffected if this step is skipped or fails.
        run: node app/scripts/capture-mlb-pregame-player-props.mjs --date "${{ github.event.inputs.date }}" --write --max-events "${{ vars.PREGAME_ARCHIVE_PLAYER_PROP_MAX_EVENTS || '3' }}"
      - name: Final pregame freeze
        run: node app/scripts/freeze-mlb-pregame-research.mjs --date "${{ github.event.inputs.date }}"
      - name: Settlement join (official StatsAPI box scores → research-join rows — free, non-blocking, idempotent)
        continue-on-error: true
        # Joins immutable freezes + carried-forward market-lean KEYS to OFFICIAL box scores. Free StatsAPI (no
        # Odds credits). A --lookback window re-grades recently-pending dates once their games are final; final
        # games are terminal (not re-fetched). Writes ONLY internal settlement-joins/; pending stays pending;
        # never touches money/public/settlement. Non-blocking — capture/audit are unaffected if this fails.
        run: node app/scripts/join-mlb-pregame-settlements.mjs --today "${{ github.event.inputs.date }}" --lookback 3 --write
      - name: Coverage / gate audit
        run: node app/scripts/audit-mlb-pregame-archive.mjs
      - name: Monitor (daily status + 7-day progress + gate) — regenerate status/monitor.json
        continue-on-error: true
        run: node app/scripts/monitor-mlb-pregame-archive.mjs
      - name: Upload archive artifact (safe persistence — no push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-pregame-archive-${{ github.run_id }}
          path: data/internal/mlb/pregame-archive/
          retention-days: 90
          if-no-files-found: ignore
      - name: Durable in-repo persistence (OPT-IN — path-scoped + size-guarded + rebase-safe, never blocks)
        if: vars.PREGAME_ARCHIVE_COMMIT == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          ARCHIVE_DIR: data/internal/mlb/pregame-archive
          # 128 KiB cap. Small metadata/summaries only (manifests, status, snapshots, freezes ≈ 4–6 KB each);
          # the large raw/normalized market payloads (≥148 KB) stay workflow artifacts and are gitignored.
          MAX_FILE_BYTES: "131072"
        run: |
          set -u
          git config user.name "gtp-pregame-bot"
          git config user.email "noreply@anthropic.com"

          # ── PATH-SCOPE: stage ONLY the internal pregame-archive tree. raw.json/normalized.json are gitignored,
          #    so the large market payloads are never staged. This add stages new/updated small metadata only. ──
          git add "${ARCHIVE_DIR}/" || true

          # ── SIZE GUARD: unstage any file at/over the cap (backstop if a large payload ever slipped past .gitignore). ──
          for f in $(git diff --cached --name-only); do
            sz=$(git cat-file -s ":$f" 2>/dev/null || echo 0)
            if [ "$sz" -ge "${MAX_FILE_BYTES}" ]; then
              echo "SIZE GUARD: skipping oversized $f ($sz bytes >= ${MAX_FILE_BYTES})"
              git restore --staged "$f" 2>/dev/null || git reset -q HEAD -- "$f" || true
            fi
          done

          # ── SAFETY ASSERT: everything staged must live under the archive dir, and NEVER money/public/official-
          #    settlement/product paths. If anything else slipped in, commit nothing (non-blocking, artifact still
          #    uploaded). NOTE: the token is `settled_leans` (the official settlement file), NOT a bare `settlement`
          #    — a bare token would false-match the legitimate internal data/.../pregame-archive/settlement-joins/. ──
          OFF="$(git diff --cached --name-only | grep -vE "^${ARCHIVE_DIR}/" || true)"
          BAD="$(git diff --cached --name-only | grep -iE 'portfolio|public/data|mr-dub|(^|/)out/|settled_leans|bank-builder|moonshot' || true)"
          if [ -n "${OFF}${BAD}" ]; then
            echo "ABORT: out-of-scope paths staged — committing nothing:"; printf '%s\n' "${OFF}" "${BAD}"
            git reset -q; exit 0
          fi

          if git diff --cached --quiet; then echo "no archive metadata changes to persist"; exit 0; fi
          N="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "── persisting ${N} archive metadata file(s): ──"
          git diff --cached --name-only | sed 's/^/  + /'
          git commit -m "auto: mlb pregame archive metadata (${N} files) [skip ci]"

          # ── REBASE-SAFE PUSH: replay the archive-only commit onto latest origin so a concurrent money/settle push
          #    is NEVER reverted (the commit's diff is archive-only, so it rebases cleanly on top of any money change). ──
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; echo "rebase skipped — artifact still uploaded"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped (non-fast-forward or perms) — artifact still uploaded"
      # This workflow NEVER pushes to public data, deploys, settles, or touches money/portfolio files.
