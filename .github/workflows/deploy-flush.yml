# DEPLOY FLUSH — the freshness backstop for the coalescing Vercel ignore step (build-cost reduction, 2026-10-26).
#
# WHY. app/scripts/vercel-ignore-build.sh now batches NON-critical data: a push whose undeployed span holds only such
# data skips the Production build until its oldest change is GTP_COALESCE_SECONDS (90 min) old. Vercel evaluates the
# ignore step only on a push, so in a quiet hour nothing would ever come back to build that data. Every 30 minutes this
# workflow asks the SAME script "would main build now?" (app/scripts/ops/deploy-flush-decide.sh runs it against the
# deployed SHA and reads its GTP_GATE line) and, if the answer is yes for a change that is overdue, pushes ONE empty
# commit whose message carries [deploy]. Vercel builds it; GitHub Actions ignores it ([skip ci]).
#
# Overdue = non-critical data past the coalescing window, or a code / critical-forecast change still undeployed 10 min
# after it landed (its own build was skipped, canceled or failed).
#
# NEVER FLOODS. Every uncertain answer is "do not flush": the live build-info.json cannot be fetched or is not JSON (a
# bot challenge), its SHA is not on main, the GitHub status API errors, or a Vercel deployment for a newer commit is
# still pending. A flush is not repeated while an earlier flush commit is still undeployed and younger than 2 h. The
# next run retries in 30 minutes; GitHub's cron delivery is best-effort, so slots can arrive late or not at all.
#
# WAKE-UP ON VERCEL'S STATUS (2026-10-27). The 30-minute cron alone did not work: GitHub delivered 3 of ~48 slots in
# its first day (01:19, 06:42, 13:04Z; hourly crons elsewhere in this repo got 4 of 24), and non-critical data from
# 10:39Z waited 2 h 19 min until an unrelated critical push carried it. Every push to main ends in a final Vercel commit
# status (built, "Canceled by Ignored Build Step", or failed), and that `status` event is delivered when it happens. So
# the `wait` job runs on each one: it reads the deployed SHA once, asks the UNCHANGED decision script the same
# question at later clock readings a minute apart, and sleeps until the first minute the answer is flush=true. Only the
# clock can change that answer inside one run: a new push or a finished build sends a new status, which cancels the
# sleeping run (cancel-in-progress) and starts one on the new state. Then the flush job runs exactly as the cron does:
# a fresh live read, the decision, the busy check and at most one empty [deploy] commit. The cron stays as a second
# path; the flush job keeps one run at a time.
#
# ROLLBACK. Disable this workflow (`gh workflow disable deploy-flush`) or revert it. With GTP_COALESCE_SECONDS=0 set in
# Vercel the ignore step never coalesces and this workflow finds nothing to flush.
name: deploy-flush

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Vercel's commit status on every push (see WAKE-UP). Runs from main's copy of this file whatever the commit.
  status:

permissions:
  contents: write
  statuses: read

jobs:
  wait:
    if: github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state != 'pending'
    runs-on: ubuntu-latest
    # The longest wait is an undeployed earlier flush (2 h repeat guard); the coalescing window is 90 min.
    timeout-minutes: 140
    concurrency:
      group: deploy-flush-wait
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      due: ${{ steps.wait.outputs.due }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 400
          persist-credentials: false

      - name: Sleep until the oldest pending change falls due
        id: wait
        env:
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_DESC: ${{ github.event.description }}
          MAX_WAIT_MINUTES: "125"
          LIVE_RETRY_SECONDS: "30"
        run: |
          set -u
          URL="https://gametimepicks.yashwantbalaji.com/data/build-info.json"
          none() { echo "$1 — not waiting (the next status or cron run asks again)"; echo "due=false" >> "$GITHUB_OUTPUT"; exit 0; }
          printf '%s' "$STATUS_SHA" | grep -Eq '^[0-9a-f]{40}$' || none "the status carried no commit SHA"
          { git cat-file -e "${STATUS_SHA}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$STATUS_SHA" HEAD 2>/dev/null; } \
            || none "the status is for $STATUS_SHA, which is not on main (a preview branch)"
          # A completed build's status can land seconds before the live site serves it. Read until the live SHA contains
          # the commit Vercel just deployed, so a lagging read never looks like undeployed work (an empty flush build).
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsS -m 30 --retry 2 -A 'gtp-deploy-flush/1.0' -H 'Accept: application/json' "$URL" 2>/dev/null)" \
              || none "could not fetch $URL"
            DEPLOYED="$(printf '%s' "$BODY" | jq -r '.commit.sha // empty' 2>/dev/null)" || DEPLOYED=""
            printf '%s' "$DEPLOYED" | grep -Eq '^[0-9a-f]{40}$' || none "build-info.json carried no commit SHA (bot challenge or unexpected body)"
            git cat-file -e "${DEPLOYED}^{commit}" 2>/dev/null || git fetch -q --deepen=2000 origin main || true
            [ "$STATUS_DESC" = "Deployment has completed" ] || break
            git merge-base --is-ancestor "$STATUS_SHA" "$DEPLOYED" 2>/dev/null && break
            [ "$attempt" -lt 6 ] || none "the live site still serves $DEPLOYED, not the build Vercel completed for $STATUS_SHA"
            sleep "$LIVE_RETRY_SECONDS"
          done
          NOW="${GTP_NOW_EPOCH:-$(date +%s)}"
          for m in $(seq 0 "$MAX_WAIT_MINUTES"); do
            ANS="$(env -u GITHUB_OUTPUT DEPLOYED_SHA="$DEPLOYED" GTP_NOW_EPOCH=$(( NOW + m * 60 )) bash app/scripts/ops/deploy-flush-decide.sh)"
            LAST="$(printf '%s\n' "$ANS" | tail -1)"
            case "$LAST" in
              "flush=true "*)
                echo "deployed $DEPLOYED; a flush falls due in ${m} min ($LAST)"
                if [ "$m" -gt 0 ]; then sleep $(( m * 60 + 15 )); fi
                echo "due=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "flush=false reason=nothing-due")
                # Pending only when the gate is holding non-critical data inside its window; otherwise nothing is undeployed.
                printf '%s\n' "$ANS" | grep -q 'GTP_GATE verdict=skip tier=coalesce-wait' || none "nothing undeployed is a build input" ;;
              "flush=false reason="*-recent|"flush=false reason=flush-outstanding") ;;
              *) none "$LAST" ;;
            esac
          done
          none "nothing falls due within ${MAX_WAIT_MINUTES} min"

  flush:
    needs: wait
    # Cron and manual runs skip `wait` and flush as before. A status run flushes only after `wait` slept to a due
    # minute; a superseded (cancelled) or empty wait ends here.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name != 'status' && needs.wait.result == 'skipped') ||
      (needs.wait.result == 'success' && needs.wait.outputs.due == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-flush
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 400
          persist-credentials: true

      - name: Read the deployed SHA from the live site
        id: live
        run: |
          set -u
          URL="https://gametimepicks.yashwantbalaji.com/data/build-info.json"
          BODY="$(curl -fsS -m 30 --retry 2 -A 'gtp-deploy-flush/1.0' -H 'Accept: application/json' "$URL" 2>/dev/null)" || {
            echo "::warning::could not fetch $URL — not flushing (no commit); the next run retries"; echo "sha=" >> "$GITHUB_OUTPUT"; exit 0; }
          SHA="$(printf '%s' "$BODY" | jq -r '.commit.sha // empty' 2>/dev/null)" || SHA=""
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::build-info.json carried no commit SHA (bot challenge or unexpected body) — not flushing (no commit)"
            echo "sha=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "deployed: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Reach the deployed SHA in the clone
        if: steps.live.outputs.sha != ''
        env:
          DEPLOYED_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -u
          if ! git cat-file -e "${DEPLOYED_SHA}^{commit}" 2>/dev/null; then
            git fetch -q --deepen=2000 origin main || echo "::warning::deepen failed — the decision step will not flush"
          fi

      - name: Decide (runs the real Vercel ignore step against the deployed SHA)
        id: decide
        if: steps.live.outputs.sha != ''
        env:
          DEPLOYED_SHA: ${{ steps.live.outputs.sha }}
        run: bash app/scripts/ops/deploy-flush-decide.sh

      - name: Skip while Vercel is already deploying a newer commit
        id: busy
        if: steps.decide.outputs.flush == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ steps.live.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          NOW="$(date +%s)"
          if ! NEWER="$(git rev-list --max-count=10 "${DEPLOYED_SHA}..HEAD")"; then
            echo "::warning::could not list the commits after $DEPLOYED_SHA — not flushing (no commit)"
            echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for SHA in $NEWER; do
            # Newest Vercel status first. A pending status older than 60 min is a stuck record, not a running build.
            if ! LATEST="$(gh api "repos/${REPO}/commits/${SHA}/statuses" --jq '[.[] | select(.context == "Vercel")][0] | if . == null then "none 0" else "\(.state) \(.created_at | fromdateiso8601)" end')"; then
              echo "::warning::GitHub status query failed for $SHA — not flushing (no commit)"
              echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            STATE="${LATEST%% *}"
            AT="${LATEST##* }"
            case "$AT" in ''|*[!0-9]*)
              echo "::warning::unexpected status record for $SHA ($LATEST) — not flushing (no commit)"
              echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            if [ "$STATE" = "pending" ] && [ $(( NOW - AT )) -lt 3600 ]; then
              echo "Vercel is deploying $SHA (pending for $(( NOW - AT ))s) — not flushing"
              echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "busy=false" >> "$GITHUB_OUTPUT"

      - name: Push the empty [deploy] commit
        if: steps.decide.outputs.flush == 'true' && steps.busy.outputs.busy == 'false'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="auto: deploy flush [deploy] [skip ci]"
          for attempt in 1 2 3 4 5; do
            git commit -q --allow-empty -m "$MSG" -m "Reason: ${REASON}. Written by .github/workflows/deploy-flush.yml."
            if git push -q origin HEAD:main; then echo "pushed the flush commit (attempt $attempt, reason $REASON)"; exit 0; fi
            echo "push rejected (attempt $attempt) — re-creating the empty commit on the new main tip"
            # The commit is empty, so there is nothing to rebase: drop it, move to origin/main, commit again. A newer
            # push that already builds just makes this flush span no new input, and Vercel skips it.
            git fetch -q origin main
            git reset -q --hard origin/main
            sleep $(( attempt * 3 ))
          done
          echo "::error::deploy flush never landed after 5 attempts"; exit 1
