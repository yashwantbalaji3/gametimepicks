# NFL event-window pipeline (Program 171 · Release G).
#
# ONE idempotent workflow for the whole NFL day, triggered by the EVENT WINDOW rather than an
# MLB-style fixed calendar: it runs, checks whether pre-start events actually exist inside the
# lookahead, and exits NO_EVENTS cleanly when they do not (an off-day is an answer, not an
# outage). Chain: schedule/rosters/injuries freshness → authorized odds capture (receipt-gated,
# ledger-accounted) → event assembly + shadow simulations → current artifacts → commit.
#
# DESIGN CONSTRAINTS, inherited not re-invented:
#   - shares the gtp-generated-artifacts writer group: never interleaves with the board
#     generator, the settler, daily-products, or sport-schedules;
#   - set -euo pipefail everywhere (the P066 lesson: a crashing step that prints success is worse
#     than a failing one);
#   - the odds step is the ONLY credit-bearing step and refuses before the 3,000-credit ceiling;
#     skip_odds runs the whole chain against the last committed capture for zero credits;
#   - artifacts are append-only — a rerun writes a NEW stamped file and refuses to overwrite;
#   - a workflow file is not cadence proof: promotion of the `products`/`monitoring` gate stages
#     waits for terminal scheduled receipts, which is why those stages stay UNPROVEN today.
name: nfl-event-window

on:
  schedule:
    # Preseason/regular NFL windows are evening ET. Two passes: T-8h (openers + first artifacts)
    # and T-2h (evidence-driven refresh before the earliest kickoffs).
    - cron: "0 15 * * *" # 11:00 ET
    - cron: "0 21 * * *" # 17:00 ET
    # Morning settle pass, AFTER sport-schedules (13:00Z) lands the previous night's finals.
    - cron: "30 14 * * *" # 10:30 ET
    #
    # ── PLAYER-PROP SWEEPS (P0-F · 2026-09-24) ────────────────────────────────────────────────
    #
    # The founder's amendment allows "up to 4 refreshes/day … provided the volume stays inside the
    # ceiling", and ⚠ THE ARITHMETIC IS THE CONDITION, NOT THE SENTENCE. Four full sweeps a day is
    # 4 x 78 = 312/day, and Thursday→Monday at that rate is ~1,500 — over an allowance of 1,000
    # remaining. So the cadence is sized against the ceiling and gets DENSER NEARER KICKOFF, which
    # is also where a price actually changes.
    #
    # ⚠ AND A COMPLETED GAME IS NEVER QUERIED, which makes the later passes cheap rather than
    # merely permitted: the capture's window is pre-start events only, so by Sunday evening the
    # slate has emptied itself down to the two night games.
    #
    #   Fri 09:00 ET   full sweep   15 events   78 credits
    #   Sat 09:00 ET   full sweep   15 events   78
    #   Sun 09:00 ET   full sweep   15 events   78
    #   Sun 12:30 ET   T-30m        15 events   78     the last look before the 1pm ET kickoffs
    #   Sun 19:00 ET   SNF + MNF     2 events   13     thirteen games have started; they are gone
    #   Mon 18:00 ET   MNF only      1 event     8
    #                                          ────
    #                                           333 for the week, plus tonight's 78 backfill = 411
    #
    # That is 411 of the 1,000 the founder authorized, leaving real headroom for the ad-hoc
    # refreshes a live week asks for. These crons recur, so a later week draws on the same
    # allowance — the receipt's machine ceiling is what stops it, fail-closed, and a refusal there
    # is a DECISION OWED rather than a broken job.
    - cron: "0 13 * * 5"  # Fri 09:00 ET · full sweep
    - cron: "0 13 * * 6"  # Sat 09:00 ET · full sweep
    - cron: "0 13 * * 0"  # Sun 09:00 ET · full sweep
    - cron: "30 16 * * 0" # Sun 12:30 ET · the last pre-kickoff look
    - cron: "0 23 * * 0"  # Sun 19:00 ET · the night games only
    - cron: "0 22 * * 1"  # Mon 18:00 ET · Monday night only
  workflow_dispatch:
    inputs:
      skip_odds:
        description: "Run the chain against the last committed capture (zero credits)"
        required: false
        default: "false"
      lookahead_hours:
        description: "Pre-start window for artifact generation"
        required: false
        default: "18"
      # P3 · 2026-09-24. The capture has always supported `--probe-props`: ONE pre-start event's
      # per-event odds for the five NFL prop keys, worst case 5 credits, a 422 or absent market
      # recorded as NO_MARKET evidence and never retried. Nothing ever passed the flag, so
      # propMarkets.state has read NOT_PROBED on every capture — literally true: we never asked.
      #
      # DISPATCH-ONLY AND OFF BY DEFAULT. The three scheduled runs are unchanged and still spend
      # exactly the bulk call's 3 credits; this can only be turned on by a human dispatching the
      # workflow, under the 2026-09-24 amendment to docs/receipts/ODDS_AUTHORIZATION_NFL_2026.md.
      probe_props:
        description: "Player props: false | one (1 event, +5 credits) | all (every event in the window)"
        required: false
        default: "false"
      # P0 · 2026-09-24. A 40-hour horizon CANNOT COVER AN NFL WEEK: on a Thursday evening 16 of 17
      # pre-start events were week 3 and exactly ONE sat inside 40 hours, so every Sunday and Monday
      # row read "Not checked" for reasons that had nothing to do with the books. `week_window`
      # follows the canonical schedule owner's own (seasonType, week) instead of a clock.
      #
      # ⚠ IT CHANGES THE PROP COST AND NOTHING ELSE. The bulk team call is markets x regions — three
      # credits whatever the window holds — so a wider window is free for team markets and linear for
      # props: 15 events x 5 families = 75. The capture PRINTS that arithmetic before its first call
      # and the receipt gate refuses at the ceiling either way.
      week_window:
        description: "Capture the whole active NFL (seasonType, week) instead of the hour horizon"
        required: false
        default: "false"
      max_prop_events:
        description: "Hard cap on events probed when probe_props=all"
        required: false
        default: "20"

concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stamp the run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # P244 · Release A: the gate is the CURRENT WEEK, not an hour window. The old 18h gate meant
      # a full official week could sit schedule-only for days while its opener approached; the
      # forecast builder now populates the whole current (seasonType, week) period, so this gate
      # only asks whether ANY pre-start event of that period exists. The lookahead input survives
      # as the backstop for schedules carrying no week metadata.
      - name: Check the event window
        id: window
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          COUNT=$(node -e "
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync('public/data/nfl/schedule/latest.json','utf8'));
            const now=Date.parse('$NOW'), h=Number('${{ github.event.inputs.lookahead_hours || 18 }}');
            const pre=s.rows.filter(r=>r.statusRaw==='STATUS_SCHEDULED'&&Date.parse(r.dateUtc)>now);
            const withWeek=pre.filter(r=>r.seasonType!=null&&r.week!=null);
            let n;
            if(withWeek.length){
              const best=withWeek.reduce((b,r)=>!b||r.seasonType<b.seasonType||(r.seasonType===b.seasonType&&r.week<b.week)?r:b,null);
              n=pre.filter(r=>(r.seasonType===best.seasonType&&r.week===best.week)||Date.parse(r.dateUtc)<=now+h*3.6e6).length;
            } else {
              n=pre.filter(r=>Date.parse(r.dateUtc)<=now+h*3.6e6).length;
            }
            console.log(n);
          ")
          echo "events=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then echo "NO_EVENTS: no pre-start event in the current week or backstop window — clean skip, not an outage"; fi

      # ---- Roster capture ----
      #
      # capture-nfl-rosters.mjs existed and NO job ran it. The roster artifact therefore froze at
      # 2026-08-13T02:55 — whenever it was last run by hand — and on 2026-08-20 it crossed the 168h
      # freshness threshold, so role evidence began reporting rosters STALE. The refusal to publish
      # player families was still correct, but for the wrong reason: our own feed was old rather
      # than the evidence genuinely absent, and "silence from a stale feed proves nothing" is the
      # rule that distinction exists to protect.
      #
      # It runs BEFORE the role-evidence build, which reads the freshness stamp it writes.
      - name: Capture NFL rosters (freshness input for role evidence)
        if: steps.window.outputs.events != '0'
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/capture-nfl-rosters.mjs --now "${{ steps.window.outputs.now }}"

      # ---- Role shares ----
      #
      # P250-GD4: build-nfl-role-shares.mjs existed and NO job ran it — the same defect, one
      # artifact over, as the roster capture documented above. Its rosterAsOf froze at
      # 2026-08-13, so the opportunity pool still listed players by the club they were on a month
      # earlier: on game day it projected Quinn Ewers as Miami's passing leader while he was
      # rostered in Jacksonville, and Brady Cook as the Jets' QB while he was in Miami — 27 such
      # rows across the slate. A stale pool does not merely omit movers, it MISATTRIBUTES them.
      #
      # Deterministic from the committed corpus plus the roster captured above; the walk-forward
      # hyperparameters come from the frozen receipt and are not re-selected here, so a refresh
      # changes WHO is in the pool, never the estimator. It must run AFTER the roster capture and
      # BEFORE event assembly, which composes each team's role rates from it.
      - name: Rebuild NFL role shares against the fresh roster
        if: steps.window.outputs.events != '0'
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-role-shares.mjs --now "${{ steps.window.outputs.now }}"

      # ---- Injury designations ----
      #
      # P250-GD3, found on game day: the injuries feed is captured ONLY by sport-schedules, on its
      # own daily cadence, so this chain read whatever that job last stored. On 2026-09-09 the
      # capture was 22.6h old — inside the 24h freshness bound, so every surface reported FRESH —
      # while ESPN had upgraded TreVeyon Henderson to Out at 2026-09-08T21:05Z, four hours AFTER
      # our snapshot. The site therefore published volume projections for a player who was out, on
      # the day of his game. The rule this encodes: a pre-kickoff pass must refresh the designations
      # it is about to condition on, rather than inheriting another job's snapshot.
      #
      # It runs BEFORE event assembly (which builds the participation pool) and before the
      # role-evidence build, so both read the same fresh capture. Keyless public JSON, no cost;
      # continue-on-error so a provider blip degrades to the previous capture with its real
      # timestamp — which the freshness bound then reports honestly — rather than failing the window.
      - name: Capture NFL injury designations (freshness input for the whole chain)
        if: steps.window.outputs.events != '0'
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/sports/capture-injuries.mjs --now "${{ steps.window.outputs.now }}"

      # `!cancelled()` (P0 · 2026-09-24) — THE SAME LESSON AS THE BLOCK BELOW, ONE STEP EARLIER.
      #
      # ⚠ A FREE FRESHNESS INPUT MUST NOT BE ABLE TO SKIP THE PAID CAPTURE. On 2026-09-24 ESPN
      # answered 404 for ONE team for a few minutes; the roster capture wrote 31 teams, the role-share
      # build correctly refused a league whose abbreviations disagree with the corpus and exited 3 —
      # and GitHub skipped every step after it, including this one. The job went red for a roster blip
      # and the week's prices were never bought, which is the opposite of what that guard is for.
      #
      # This step keeps its OWN preconditions: the window must hold events, skip_odds must be unset,
      # and the receipt gate still refuses fail-closed. What it no longer inherits is somebody else's
      # failure. (The carry-forward in capture-nfl-rosters.mjs stops that particular blip at source;
      # this stops the NEXT one, whatever it turns out to be.)
      - name: Authorized odds capture (receipt-gated, the only credit-bearing step)
        if: ${{ !cancelled() && steps.window.outputs.events != '0' && github.event.inputs.skip_odds != 'true' }}
        working-directory: app
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NOW: ${{ steps.window.outputs.now }}
          PROBE_PROPS: ${{ github.event.inputs.probe_props || '' }}
          WEEK_WINDOW: ${{ github.event.inputs.week_window || '' }}
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          MAX_PROP_EVENTS: ${{ github.event.inputs.max_prop_events || '20' }}
          LOOKAHEAD_HOURS: ${{ github.event.inputs.lookahead_hours || 40 }}
        run: |
          set -euo pipefail
          # P256 · Task 7: the founder's 2026-09-10 authorization, as amended 2026-09-24 — team
          # markets, the five player-prop families, and an effective 1,160-credit cumulative ceiling
          # that BOTH parsers read. The P171 receipt lapsed at its program's close and refused every
          # capture since; this one is the receipt the capture reads.
          # The capture's window follows the SAME input as the gate above, defaulting to 40h. Two
          # separate numbers could disagree — a dispatch widening the gate to include Monday night
          # still bought a 40h window and left that game unpriced — and the bulk call costs the same
          # 3 credits whatever the window holds, so a wider one is free coverage, never extra spend.
          #
          # ⚠ THE FLAGS ARE ASSEMBLED IN SHELL, NOT IN AN EXPRESSION TERNARY. A conditional expression
          # that expands to an empty string is invisible in the rendered command, so an input that
          # silently did nothing looked exactly like an input that worked. An unrecognised value now
          # REFUSES rather than quietly capturing the default.
          #
          # ⚠ And this comment may not SHOW you the ternary it is warning about: a dollar-brace-brace
          # anywhere in a run block is an expression to GitHub, shell comment or not. Writing one
          # here made the whole workflow file unloadable — no job started, and the scheduled captures
          # went down with it — for a sequence that was never meant to execute.
          # ⚠ THE CADENCE LIVES IN THE CRON LIST, NOT IN A SECOND NUMBER SOMEWHERE ELSE. A sweep
          # window is identified by the cron expression that fired it (`github.event.schedule`),
          # so adding or removing a sweep is one edit in one place and the schedule cannot drift
          # from the arithmetic written beside it. A dispatch input still wins outright.
          SWEEP_CRONS="0 13 * * 5|0 13 * * 6|0 13 * * 0|30 16 * * 0|0 23 * * 0|0 22 * * 1"
          if [ -z "$PROBE_PROPS" ] || [ -z "$WEEK_WINDOW" ]; then
            SWEEP=false
            OLDIFS="$IFS"; IFS='|'
            for c in $SWEEP_CRONS; do [ "$c" = "$FIRED_SCHEDULE" ] && SWEEP=true; done
            IFS="$OLDIFS"
            [ -z "$PROBE_PROPS" ] && { [ "$SWEEP" = true ] && PROBE_PROPS=all || PROBE_PROPS=false; }
            [ -z "$WEEK_WINDOW" ] && { [ "$SWEEP" = true ] && WEEK_WINDOW=true || WEEK_WINDOW=false; }
            echo "schedule '${FIRED_SCHEDULE:-<dispatch>}' → prop sweep: $SWEEP"
          fi
          FLAGS=()
          case "$PROBE_PROPS" in
            all)       FLAGS+=(--probe-props all --max-prop-events "$MAX_PROP_EVENTS") ;;
            one|true)  FLAGS+=(--probe-props auto) ;;
            false|"")  : ;;
            *) echo "REFUSED: probe_props must be false|one|all (got '$PROBE_PROPS')"; exit 2 ;;
          esac
          case "$WEEK_WINDOW" in
            true)      FLAGS+=(--week-window) ;;
            false|"")  : ;;
            *) echo "REFUSED: week_window must be true|false (got '$WEEK_WINDOW')"; exit 2 ;;
          esac
          echo "odds capture flags: ${FLAGS[*]:-<none>}"
          node scripts/nfl/capture-nfl-odds.mjs \
            --now "$NOW" \
            --authorized \
            --receipt docs/receipts/ODDS_AUTHORIZATION_NFL_2026.md \
            --lookahead-hours "$LOOKAHEAD_HOURS" \
            ${FLAGS[@]+"${FLAGS[@]}"}

      # `!cancelled()` (P265): these three need ROSTERS and INJURIES, which are captured above and did
      # not fail — but GitHub skips every later step once one fails, so a refused PAID odds capture took
      # the free work down with it. On 2026-09-12 that left the published boards carrying last night's
      # role evidence against injuries captured this morning, the day before Sunday. The odds step still
      # fails the job and still alerts — that part was right — while the boards refresh regardless.
      - name: Event assembly + shadow simulations + current artifacts
        if: ${{ !cancelled() && steps.window.outputs.events != '0' }}
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/run-nfl-event-window.mjs \
            --now "${{ steps.window.outputs.now }}" \
            --lookahead-hours "${{ github.event.inputs.lookahead_hours || 18 }}"

      # P173-A: public-beta forecasts. Runs AFTER the market capture and event assembly so each
      # forecast is frozen against the inputs that existed pre-kickoff, and never after a start.
      # P175-A: event-bound role evidence. Runs BEFORE the forecasts so player families have a
      # per-player availability verdict to consume rather than an assumption.
      - name: Build NFL role evidence
        if: ${{ !cancelled() && steps.window.outputs.events != '0' }}
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-role-evidence.mjs --now "${{ steps.window.outputs.now }}" --lookahead-hours 48
          # P182-A: participation DISTRIBUTIONS per event. Runs beside role evidence and before the
          # forecasts, so any player output downstream consumes one versioned playing-time answer
          # rather than each surface assuming its own.
          node scripts/nfl/build-nfl-participation.mjs --now "${{ steps.window.outputs.now }}" --lookahead-hours 48

      # P295: the v3 totals head learns game by game from this season's nflverse finals and play-by-play
      # (free, CC BY 4.0, no key, no credits). This step never fails the window: a failed download keeps
      # the last good capture and records the attempt, and the forecast builder falls back to the
      # incumbent totals head — naming why — whenever an official final is missing from what it folded.
      - name: Capture this season's nflverse finals and play-by-play (free)
        if: ${{ !cancelled() && steps.window.outputs.events != '0' }}
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/capture-nflverse-season.mjs --now "${{ steps.window.outputs.now }}"

      - name: Generate public-beta NFL forecasts
        id: generate
        if: ${{ !cancelled() && steps.window.outputs.events != '0' }}
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-public-forecasts.mjs --now "${{ steps.window.outputs.now }}" --lookahead-hours 48
          # P251-F6: the event-based score shape is solved onto the forecast published one line
          # above, so it must run AFTER it and re-run whenever it changes.
          node scripts/nfl/build-nfl-score-shape.mjs --now "${{ steps.window.outputs.now }}"
          node scripts/nfl/build-nfl-public-status.mjs --now "${{ steps.window.outputs.now }}"
          # P174-A: the canonical index every NFL surface consumes. Built LAST so it summarises
          # the artifacts this run just produced, and it refuses on any contradiction between them.
          # P174-E: End Zone Vault evaluates every window — ACTIVE, WATCHLIST_ONLY, NO_VAULT,
          # STALE or INCIDENT. It runs before the index so the index can summarise its state.
          node scripts/nfl/build-end-zone-vault.mjs --now "${{ steps.window.outputs.now }}"
          node scripts/nfl/build-nfl-index.mjs --now "${{ steps.window.outputs.now }}"
          # P177-C: the daily paper-product evaluation. Runs AFTER the index because it consumes the
          # canonical classification rather than re-deriving it, and it refuses outright if the index
          # is missing — reporting "nothing qualified" from absent data would be a finding about the
          # model drawn from no data about the model.
          node scripts/nfl/build-nfl-product-eligibility.mjs --now "${{ steps.window.outputs.now }}"
          # P178-C: differentiation audit. Runs every window and EXITS NON-ZERO on a P0 (two distinct
          # events sharing an input fingerprint, or two distinct events sharing a distribution), so a
          # model that stops reading the event fails the run instead of publishing quietly.
          node scripts/nfl/audit-nfl-signal-significance.mjs --now "${{ steps.window.outputs.now }}"
          node scripts/nfl/audit-nfl-differentiation.mjs --now "${{ steps.window.outputs.now }}"
          # P183-E: product RUN receipts. Consumes the eligibility verdict and publishes the working
          # behind it — counted rejection doors per lane — so a product that ran is distinguishable
          # from one that never did. Refuses rather than writing a receipt from absent inputs.
          # P183-F: per-game simulations — team opportunity plus every player's distribution, from
          # ONE joint process. Runs after participation and the frozen forecast, so a player row can
          # never disagree with the score shown above it.
          node scripts/nfl/build-nfl-game-simulations.mjs --now "${{ steps.window.outputs.now }}"
          # P245: the public player board — promotion-gated extraction of the eligible families
          # (rush yards + calibrated anytime TD) from the current-event research artifacts.
          node scripts/nfl/build-nfl-player-board.mjs --now "${{ steps.window.outputs.now }}"
          # P246 §5: the weekly top boards — ONE canonical ranking owner over the per-game
          # boards; top-N are maximums, confirmed-out players never rank.
          node scripts/nfl/build-nfl-weekly-boards.mjs --now "${{ steps.window.outputs.now }}"
          node scripts/nfl/build-nfl-product-receipts.mjs --now "${{ steps.window.outputs.now }}"

      # ── THE INDEX IS RE-DERIVED EVERY RUN, WINDOW OR NOT ────────────────────────────────────────
      #
      # It used to be built only inside the events!=0 branch, so on a quiet day the LAST index just
      # stayed on disk and its counts kept describing a world that had moved on. Observed
      # 2026-08-27: the index still read `nextKickoffUtc: 2026-08-24T00:00Z`, `forecastsUpcoming: 1`
      # and `forecastsStarted: 0` for SEA @ TEN — a game played four days earlier — across four
      # green runs of this workflow, because every one of them skipped straight past the builder.
      #
      # The builder was never the problem: it applies the kickoff lock against its own --now and
      # would have zeroed those counts on any of those four runs. It simply was not called. It is
      # free, local, deterministic and needs no network, so there is no reason to gate it at all.
      - name: Re-derive the canonical NFL index (runs on EVERY window, including empty ones)
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-index.mjs --now "${{ steps.window.outputs.now }}"

      # ── THE MARKET MATRIX ──────────────────────────────────────────────────────────────────────
      #
      # One row per (event, player, family) a public surface renders, with the book, the line, the
      # prices, the capture instant, the join and the display status — read from the canonical
      # artifacts rather than from a page.
      #
      # ⚠ A COUNT IS NOT COVERAGE. "39 rows priced" is compatible with every one of them being the
      # wrong player and with a whole game being invisible, and the acceptance gate for this lane
      # ("no eligible current-week event remains NOT_PROBED") is a claim about a POPULATION. So the
      # population is enumerated every window, including the windows where the answer is bad — a
      # coverage report that only runs when coverage is good measures nothing.
      #
      # `always()`, free, local, deterministic: it reads committed artifacts and makes no call.
      - name: Audit the canonical market matrix (free, read-only)
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/audit-nfl-market-matrix.mjs --now "${{ steps.window.outputs.now }}" --write

      # ── AND THE ARTIFACTS THAT SUMMARISE IT ────────────────────────────────────────────────────
      #
      # P224: the fix above was applied to the index and not to its class. Product eligibility and
      # the run receipts both CONSUME the index and both stayed inside the `events != '0'` branch,
      # so on a quiet day the index refreshed and they did not. Observed 2026-09-01: the index had
      # moved CHI @ TEN to SETTLED (0 pre-kickoff events) while product-eligibility still reported
      # `consideredEvents: 1` and `indexGeneratedAt: 2026-08-29T18:16:23Z` — three days stale,
      # contradicting the artifact it claims to summarise.
      #
      # Both builders are local, deterministic, network-free and refuse rather than invent: on an
      # empty window they write "no pre-kickoff NFL event was available to evaluate", which is the
      # honest receipt that the lane RAN and found nothing to look at. That is the whole point of a
      # receipt, and it is exactly what a quiet day should produce.
      #
      # Deliberately NOT extended to build-nfl-game-simulations or the vault: those produce content
      # rather than summarise it, and they belong behind the audits in the generate step.
      - name: Re-derive the artifacts that summarise the index (quiet windows included)
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-product-eligibility.mjs --now "${{ steps.window.outputs.now }}"
          node scripts/nfl/build-nfl-product-receipts.mjs --now "${{ steps.window.outputs.now }}"
          # P243 · C-NFL: model-status is the same class — local, deterministic, summarising — and
          # it sat Aug-29-stale through nine quiet days, telling the hub "prices LIVE" over a
          # finished preseason (the A-4 defect's delivery half). It re-derives on every window.
          node scripts/nfl/build-nfl-public-status.mjs --now "${{ steps.window.outputs.now }}"

      # Consumes what the step above produced, so it inherits the same gate: rebuilding the lane
      # from a condemned generation is how the lane came to say 13 events beside a market artifact
      # saying 11 on 2026-08-28.
      - name: Rebuild the NFL admin lane status
        if: steps.window.outputs.events != '0' && steps.generate.outcome == 'success'
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-lane-status.mjs --now "${{ steps.window.outputs.now }}"

      # ── ALWAYS, BUT NOT WHEN AN AUDIT CONDEMNED WHAT WE WOULD COMMIT ────────────────────────────
      #
      # P215 R-D1 ungated this to `always()` so an EMPTY window would still commit the re-derived
      # index — a correction computed and not committed is not a correction. That was right about
      # empty windows and wrong about everything else, and it cost exactly what you would expect.
      #
      # The generate step ends with two audits that exit non-zero on a P0. On 2026-08-28 at 05:07
      # audit-nfl-differentiation reported P0_DEFECT — twelve distinct games sharing one distribution,
      # every score 19-18 — and killed the step, which is precisely what it is for. `always()` then
      # committed and deployed the artifacts anyway, and /nfl published twelve identical "projected"
      # scorelines. A guard that fails the run and cannot stop the publish is decoration.
      #
      # So: commit when the window was empty (nothing was generated to condemn), and otherwise only
      # when generation and its audits actually passed.
      # P230 · F1 — THE EMPTY WINDOW STILL OWES A RECEIPT.
      #
      # The Vault's own contract is that it "evaluates every window", and the builder honours it:
      # with no upcoming event it returns NO_VAULT and appends a NO_PLAY entry naming the reason.
      # But it lived only inside the `events != '0'` step above, so in exactly the windows where
      # "nothing to evaluate" IS the answer, it never ran. The ledger went silent instead of
      # recording a refusal, and the run still reported success.
      #
      # nfl-event-window succeeded 9 times between 08-30 and 09-01 and the Vault ledger gained no
      # entry on any of those days. A missing receipt that produces no failed run object is the
      # hardest kind to notice, which is why the product must speak on its quiet days too.
      #
      # This runs ONLY on the empty window; when there are events the gated step above still runs it
      # in order, after the evidence it consumes.
      - name: End Zone Vault — record the empty window
        if: steps.window.outputs.events == '0'
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nfl/build-end-zone-vault.mjs --now "${{ steps.window.outputs.now }}"

      # P230 · F2 — DID THE VAULT ACTUALLY PRODUCE?
      #
      # This workflow succeeded nine times between 08-30 and 09-01 while the End Zone Vault ledger
      # gained no entry on any of them. A step's exit code answers "did the command return zero",
      # which is a different question from "did the product do its work" — and the answer to the
      # second one was no, invisibly, for three days. `--allow-missing` is NOT used: the Vault
      # evaluates every window by contract, so a run that leaves no artifact is a failure, not an
      # optional outcome.
      - name: Assert the Vault produced its artifacts
        if: always() && (steps.window.outputs.events == '0' || steps.generate.outcome == 'success')
        run: |
          set -euo pipefail
          node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" \
            app/public/data/nfl/end-zone-vault/latest.json

      - name: Commit the window's artifacts
        if: >-
          always() &&
          (steps.window.outputs.events == '0' || steps.generate.outcome == 'success')
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # P256: the injury capture this run used is committed WITH the evidence built from it. It was
          # missing from this list, so the window read a fresh feed, built role evidence from it, and
          # threw the capture away — leaving the committed injury file hours older than the evidence
          # (Travis Bell and Ben Sims: IR in the file, Questionable in the feed the evidence used), and
          # leaving the carry-forward's "previous file" frozen in CI, so it could not accumulate memory.
          # P295: the nflverse season capture the v3 totals head folded is committed with the forecasts built from it.
          git add data/internal/research/odds/nfl/ data/internal/research/nfl/reports/ data/internal/nfl/ app/public/data/nfl/ app/public/data/admin/nfl-lane.json data/internal/research/injuries/ data/internal/research/nfl/replay/
          if git diff --cached --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          git commit -m "auto: nfl event window ${{ steps.window.outputs.now }} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Settlement is INDEPENDENT of the window gate: last night's finals settle even when
      # tonight has no events. It is idempotent (exactly-once by canonicalEventId) and free.
      - name: Settle yesterday's and today's current artifacts
        id: settle
        working-directory: app
        run: |
          set -euo pipefail
          NOW="${{ steps.window.outputs.now }}"
          for D in "$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)" "$(date -u +%Y-%m-%d)"; do
            if [ -d "../data/internal/nfl/current/$D" ]; then
              node scripts/nfl/settle-nfl-current.mjs --now "$NOW" --date "$D"
            fi
            # P174-G: the experimental FORECAST ledger — graded as a distribution, kept in its own
            # lane, exactly once. Runs whether or not the market ledger had anything to do.
            if [ -d "../data/internal/nfl/forecast-receipts/$D" ]; then
              node scripts/nfl/settle-nfl-experimental.mjs --now "$NOW" --date "$D"
            fi
          done

      # ── THE MODEL'S OWN CALIBRATION RECORD ────────────────────────────────────────────────────
      #
      # Runs immediately after settlement, because that is the moment the evidence changes. The
      # settlement ledger has computed interval coverage since P174-G and nothing ever read it: a
      # whole preseason went by with the margin interval printed as 80% and realised at 65%, a
      # z of -2.3 sitting in a private JSON file. Measuring without publishing is how that happens.
      #
      # It never edits the model. It classifies against preregistered bars and proposes a widening
      # factor; adopting one needs a preregistration and a held-out evaluation, like every other
      # promotion here. Non-blocking: a monitor must not be why settlement fails.
      - name: Publish interval calibration (measure, never auto-tune)
        working-directory: app
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/nfl/build-interval-calibration.mjs --now "${{ steps.window.outputs.now }}" --write | tee /tmp/cal.txt
          WORST="$(node -e "try{console.log(require('./public/data/nfl/interval-calibration.json').worst)}catch{console.log('UNKNOWN')}")"
          if [ "$WORST" = "OVERCONFIDENT" ]; then
            echo "::warning::NFL interval calibration $WORST — a published confidence label is narrower than its realised coverage; see public/data/nfl/interval-calibration.json"
          fi
          { echo "### NFL interval calibration"; echo ""; echo '```'; cat /tmp/cal.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The preregistered margin-interval challenger (one candidate, frozen 2026-09-10) is scored beside
      # the incumbent on every settled regular-season game. The frozen regular-season contract alone
      # decides a promotion — under its minimum (64 games, 4 weeks) nothing is decided either way — and
      # the forecast generator publishes the challenger's band only when this report says PROMOTE.
      # Non-blocking, like the monitor above: grading must never be why settlement fails.
      - name: Grade the margin-interval challenger in shadow (preregistered, contract-gated)
        working-directory: app
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/nfl/evaluate-margin-interval-shadow.mjs --now "${{ steps.window.outputs.now }}" --write | tee /tmp/shadow.txt
          { echo "### NFL margin-interval shadow"; echo ""; echo '```'; cat /tmp/shadow.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # P296: the public week report — every published team and player prediction graded against the
      # official box score. Idempotent and quiet: an unchanged week is not rewritten, so a run with no new
      # finals commits nothing and triggers no deploy. Non-blocking: a report must never fail settlement.
      - name: Reconcile the NFL week against official box scores
        working-directory: app
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/nfl/build-nfl-week-reconciliation.mjs --now "${{ steps.window.outputs.now }}"

      - name: Commit settlement receipts
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/internal/nfl/settlement/ data/internal/nfl/experimental-settlement/ \
                  app/public/data/nfl/interval-calibration.json \
                  data/internal/research/nfl/reports/margin-interval-shadow-latest.json
          # P296: the week report and the official lines it graded (created on the first reconciled week).
          if [ -d app/public/data/nfl/reconciliation ]; then git add app/public/data/nfl/reconciliation/; fi
          if [ -d data/internal/nfl/official-stats ]; then git add data/internal/nfl/official-stats/; fi
          if git diff --cached --quiet; then echo "no settlement change"; exit 0; fi
          git commit -m "auto: nfl settlement receipts [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Was a hand-rolled curl posting its own payload straight to the webhook. It worked, but it
      # sat OUTSIDE docs/OPS_ALERTING_CONTRACT.md: no redaction pass, a different message shape, and
      # a second place to fix whenever the contract changes. Moved onto the shared script so every
      # sport's failure reads the same and is redacted the same.
      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PHASE: nfl-event-window
        run: |
          # fail-loud like every other run block here (P066). Safe on this step specifically:
          # ops_alert.sh never exits non-zero by design, and this step only runs after the job has
          # already failed, so it cannot convert a passing run into a failing one.
          set -euo pipefail
          EXIT_STATUS="${EXIT_STATUS:-1}" bash scripts/ops_alert.sh
