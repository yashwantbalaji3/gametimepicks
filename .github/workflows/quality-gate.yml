# Quality gate — typecheck, unit suite, build, and accessibility on every CODE change.
#
# Why this exists. The product-quality launch gate was PARTIAL with the blocker "no accessibility
# audit; e2e specs exist but are not run in CI". The second half was the real problem: the repo had
# Playwright and five specs that no workflow and no runner ever executed, so they could not catch a
# regression. Program 137 found a skipped heading level, a focus ring that was invisible across the
# entire desktop navigation, and four colour tokens below WCAG AA — all introduced by ordinary
# changes, none caught by anything. A gate that runs once is a snapshot.
#
# PATH-FILTERED ON PURPOSE. The nightly automation pushes generated artifacts to main many times a
# day under app/public/data/**. Those commits change no code, so they must not trigger a build; only
# source, specs, scripts and config do.
name: quality-gate

on:
  push:
    branches: [main]
    paths:
      - "app/src/**"
      - "app/e2e/**"
      - "app/scripts/**"
      # v1.6: the serverless functions. THIS WAS MISSING, and it mattered.
      #
      # `app/api/*.mjs` is deployed by Vercel independently of the Next build — the Live gateway, the
      # analytics collector, the slip reader and two crons all live there. None of them was covered by
      # this push filter, so every change to production runtime code since they shipped landed on main
      # without the gate running. The pull_request trigger below uses `app/**` and did cover them,
      # which is exactly why the gap was invisible: PRs were green and pushes ran nothing.
      #
      # Ask GameTime adds `api/ask.mjs` and `api/_ask-core.mjs`. Shipping a new runtime endpoint into
      # that blind spot is not a risk worth taking for the sake of a shorter list.
      - "app/api/**"
      # Routing, headers and cron schedules are deployment behaviour; a change here can break a
      # function without touching a line of its source.
      - "app/vercel.json"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/playwright.config.ts"
      - "app/next.config.*"
      - "app/tsconfig.json"
      - "pipeline/**"
      - "scripts/ci/**"
      - ".github/workflows/quality-gate.yml"
  pull_request:
    paths:
      - "app/**"
      - "pipeline/**"
      - "scripts/ci/**"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

# Independent of gtp-generated-artifacts: this job writes no artifact and spends no API credit, so
# it must never queue behind (or cancel) a data writer.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20.4.0"     # pinned: the repo builds against Node 20.4 / Next 15.5.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # P264: `next lint` covers app/src only, so app/scripts — 385 files that run in CI and spend real
      # money — had no check for an identifier that does not exist. capture-ufc-odds.mjs used an
      # undefined `matchedEvent` and threw AFTER buying the prices, twice, inside a step whose failure
      # was swallowed. no-undef over the scripts is the cheap check that would have caught it.
      - name: Lint scripts for identifiers that do not exist
        run: npm run lint:scripts

      # v1.4.1 · NO SEPARATE TYPECHECK STEP. `next build` below runs the SAME check over the SAME tsconfig
      # ("Linting and checking validity of types"), and it runs it AFTER generating .next/types, so it covers the
      # route-type validation a standalone `tsc --noEmit` on a fresh checkout cannot see. Running both cost 31 s of a
      # 25-minute budget for zero extra signal. Proven with two probes (an unimported src/lib/*.ts and an e2e/*.ts:
      # both fail the build). `npm run typecheck` still exists and still runs first in the local `npm run gate`.
      # The reliance is pinned by src/lib/ci/quality-gate-contract.test.mjs — if the build ever stops type-checking
      # (ignoreBuildErrors) or this step returns, that guard fails.

      # ── PHASE 1: everything that needs no built export ─────────────────────────────────────────
      #
      # P225: this used to be the WHOLE suite, run before the build. Forty-three files read `out/`
      # and every one opens with `if (!fs.existsSync(PAGE)) return;` — an early return inside the
      # test body, not a skip. In CI they neither failed nor reported as skipped: they reported as
      # PASSING, having asserted nothing. Measured 2026-09-01: the same 250 tests "pass" with `out/`
      # present and with it absent. Two guards repaired the night before were never once exercised
      # by the gate meant to protect them.
      - name: Unit + contract suite (phase 1 — no built export)
        # The runner reports failures in TAP; `# fail N` is the authority, not the exit code.
        run: |
          set -o pipefail
          node scripts/ci/run-suite.mjs --phase unit 2>&1 | tee /tmp/suite.log
          fails=$(grep -cE '^not ok' /tmp/suite.log || true)
          echo "failing tests: ${fails:-0}"
          [ "${fails:-0}" -eq 0 ]

      # v1.6 · ASK GAMETIME. Two cheap checks, both offline, both before the build.
      #
      # `ask:check` proves the committed projection still matches a rebuild of its sources, the way the
      # research, compare and lab projections are already checked. Without it a stale projection would
      # publish quietly and Ask would answer from yesterday's forecasts.
      #
      # `ask:eval` runs after the BUILD (see below) because it needs the published assets.
      - name: Ask projection is current
        run: npm run ask:check

      - name: Build the public export
        run: npm run build

      # ── PHASE 2: the guards that read the bytes the build just produced ────────────────────────
      #
      # The runner REFUSES this phase when `out/` is missing or when the partition selects no files,
      # so it cannot reproduce one level up the vacuous pass it exists to remove.
      - name: Rendered guards (phase 2 — reads the built export)
        run: |
          set -o pipefail
          node scripts/ci/run-suite.mjs --phase post-build 2>&1 | tee /tmp/rendered.log
          fails=$(grep -cE '^not ok' /tmp/rendered.log || true)
          echo "failing rendered tests: ${fails:-0}"
          [ "${fails:-0}" -eq 0 ]

      # ⚠ AFTER THE BUILD, ON PURPOSE. The eval drives the real tool layer against the PUBLISHED assets
      # under app/public/data/ask/v1, which the build emits and which are gitignored. Run before the
      # build, every tool answers ASSET_UNAVAILABLE and the eval measures nothing but its own plumbing —
      # the exact vacuous-pass shape the two-phase suite exists to remove.
      #
      # It runs against the DETERMINISTIC FAKE provider and refuses a real provider inside CI outright,
      # so this step can never make a billed call.
      - name: Ask golden eval (fake provider — never billed)
        env:
          ASK_MODEL_PROVIDER: fake
        run: npm run ask:eval

      - name: Accessibility — structural (9 launch-critical routes)
        run: node scripts/audit-accessibility.mjs

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Accessibility — browser (contrast · keyboard · reflow)
        # Chromium + Firefox + WebKit. Keyboard traversal is skipped on WebKit by design: Safari
        # ships with Full Keyboard Access off, so links are not in its Tab order.
        # v1.4.1: worker count comes from the runner's own vCPUs (playwright.config `workers: "100%"` in CI);
        # printed so a slower run can be read against the machine it ran on.
        run: |
          echo "[ci-perf] vCPUs: $(nproc)"
          npx playwright test e2e/accessibility.spec.ts e2e/route-assurance.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # P258: the pipeline's 89 Python test files ran nowhere (pytest cannot collect them — they are
  # script-style modules). Run each as `python -m`, in its own job so a Python failure never hides
  # behind (or waits for) the Node build.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # pytest: two script-style tests (nba_sgp, recent10_cache_fallback) import it for fixtures/raises.
      - run: pip install -r pipeline/requirements.txt pytest

      - name: Pipeline Python tests (every *_test.py / test_*.py, as modules)
        run: bash scripts/ci/run-python-tests.sh
