name: game-outlook
on:
  workflow_dispatch:
    inputs:
      date: { description: "Slate date YYYY-MM-DD", type: string, required: false, default: "2026-06-10" }
permissions:
  contents: write
concurrency:
  group: game-outlook
  cancel-in-progress: false
jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Fetch + build NBA game outlook
        run: |
          D="${{ github.event.inputs.date || '2026-06-10' }}"
          python -m pipeline.fetch_game_markets --date "$D" --sport nba || echo "::warning::NBA game markets fetch skipped"
          python -m pipeline.build_game_outlook --date "$D" --sport nba
      - name: Fetch + build MLB game outlook
        run: |
          D="${{ github.event.inputs.date || '2026-06-10' }}"
          python -m pipeline.fetch_game_markets --date "$D" --sport mlb || echo "::warning::MLB game markets fetch skipped"
          python -m pipeline.build_game_outlook --date "$D" --sport mlb
      - name: Show
        run: |
          echo "::group::nba"; cat app/public/data/game-outlook/nba/latest.json | head -40; echo "::endgroup::"
          echo "::group::mlb"; cat app/public/data/game-outlook/mlb/latest.json | head -40; echo "::endgroup::"
      - name: Commit game outlook artifacts
        run: |
          git add app/public/data/game-outlook/ app/public/data/nba/game-markets/ app/public/data/mlb/game-markets/ 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "GametimePicks Bot"; git config user.email "noreply@github.com"
          git commit -m "auto: NBA+MLB game outlook (market-implied) [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
