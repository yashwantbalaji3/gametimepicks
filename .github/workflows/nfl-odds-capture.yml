# NFL odds capture (Program 171 · Release D).
#
# The ONLY credit-bearing NFL lane. Design constraints:
#   - runs exclusively under the committed founder receipt (docs/receipts/ODDS_AUTHORIZATION_P171.md):
#     NFL-only, cumulative 3,000-credit Program 171 ceiling, no remaining-balance floor. The capture
#     script parses that receipt FAIL-CLOSED and refuses before any call whose worst case would
#     cross the ceiling; every response's usage headers land in the private cumulative ledger.
#   - dispatch-only until the event-window cadence proves itself (Release G adds the cron; a
#     workflow file is not cadence proof).
#   - one bulk team-markets call (h2h,spreads,totals × us = 3 worst-case credits for the whole
#     slate) plus an optional single-event player-prop probe (5 worst-case). No retries: a failed
#     charged call is recorded and the run stops.
#   - shares the gtp-generated-artifacts writer group — never interleaves with the other bots.
#   - the local key 401s by design; this workflow is where the real ODDS_API_KEY lives.
name: nfl-odds-capture

on:
  workflow_dispatch:
    inputs:
      probe_props:
        description: "Prop probe: auto (earliest joined event), a specific odds event id, or empty to skip"
        required: false
        default: "auto"
      lookahead_hours:
        description: "Pre-start window to capture"
        required: false
        default: "40"

concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authorized NFL odds capture (receipt-gated, ledger-accounted)
        working-directory: app
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PROBE="${{ github.event.inputs.probe_props }}"
          ARGS=(--now "$NOW" --authorized --receipt docs/receipts/ODDS_AUTHORIZATION_P171.md --lookahead-hours "${{ github.event.inputs.lookahead_hours }}")
          if [ -n "$PROBE" ]; then ARGS+=(--probe-props "$PROBE"); fi
          node scripts/nfl/capture-nfl-odds.mjs "${ARGS[@]}"

      - name: Commit capture artifacts (ledger + private snapshot + public market display)
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/internal/research/odds/nfl/ app/public/data/nfl/markets/
          if git diff --cached --quiet; then
            echo "nothing captured — no commit"
            exit 0
          fi
          git commit -m "auto: nfl odds capture (P171 receipt-gated) [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
