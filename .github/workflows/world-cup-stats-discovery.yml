name: world-cup-stats-discovery
on:
  workflow_dispatch:
    inputs:
      date: { description: "YYYY-MM-DD", type: string, required: false, default: "2026-06-11" }
      provider: { description: "provider key (sample until a real adapter is added)", type: string, required: false, default: "sample" }
      dry_run: { description: "dry run", type: boolean, required: false, default: true }
permissions:
  contents: write
concurrency:
  group: world-cup-stats-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      WC_STATS_PROVIDER: ${{ github.event.inputs.provider || 'sample' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Bounded discovery / readiness (fails closed without data)
        run: |
          D="${{ github.event.inputs.date || '2026-06-11' }}"
          if [ "$WC_STATS_PROVIDER" = "api_football" ]; then
            python -m pipeline.world_cup.build_stats --date "$D"
            # Market availability FIRST — bounded probe of player-prop/corner odds + lineups;
            # captures real corner-total odds the projection build consumes below.
            python -m pipeline.world_cup.discover_markets --date "$D" || echo "[wc-markets] non-fatal"
            # Sportsbook player-prop universe (the books' listed players) for pre-lineup props.
            python -m pipeline.world_cup.build_player_market_universe --date "$D" || echo "[wc-player-universe] non-fatal"
            # Team-level projections (bounded ensemble): moneyline + total goals + total corners.
            python -m pipeline.world_cup.build_team_projections --date "$D" || echo "[wc-proj] non-fatal"
            # Suggested parlays — only built from real ACTIVE projections (no-op if none).
            python -m pipeline.world_cup.build_suggested_parlays --date "$D" || echo "[wc-parlay] non-fatal"
            # Settlement — grades public/active picks from FT regulation score (no-op if none).
            python -m pipeline.world_cup.settle --date "$D" || echo "[wc-settle] non-fatal"
          else
            python -m pipeline.world_cup.readiness --date "$D" --provider "$WC_STATS_PROVIDER"
          fi
      - name: Show
        run: |
          echo "::group::readiness"; cat app/public/data/world-cup/stats/readiness-latest.json; echo "::endgroup::"
          test -f app/public/data/world-cup/stats/normalized-latest.json && { echo "::group::normalized"; cat app/public/data/world-cup/stats/normalized-latest.json | head -60; echo "::endgroup::"; } || true
      - name: Commit readiness
        run: |
          # Add each subdir independently so a not-yet-existing path never aborts the whole add.
          for sub in stats provider-discovery projections parlays settlement markets player-markets player-projections player-features; do
            git add "app/public/data/world-cup/$sub/" 2>/dev/null || true
          done
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "GametimePicks Bot"; git config user.email "noreply@github.com"
          git commit -m "auto: World Cup stats readiness [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
