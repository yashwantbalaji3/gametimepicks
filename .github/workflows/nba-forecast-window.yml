# NBA forecast window — every game gets a pre-tip forecast opportunity (Session 10 · G2).
#
# ⚠ WHY THIS EXISTS. The NBA experimental forecasts (v0 = the preregistered shadow, v0.1 = roster-gated
# research) were built only inside sport-schedules, once a day. That cron is 09:07Z and GitHub delivered it
# 14:09Z–17:35Z over the 12 days before 2026-10-03 — so any game that tips before the run arrives (opening
# day's 19:00Z BOS @ DET, the 17:00–21:00Z weekend / holiday tips, the 10:00Z and 12:00Z international
# preseason games) was never forecast before tip, and the preregistration only counts pre-tip artifacts.
#
# This workflow asks one free question often: does a game tip within 8 hours that some family (v0, the v0.1
# champion, the v0.2 2026-27 challenger, the v1 coherent-engine candidate) has not forecast? If so
# it captures the injuries feed FIRST (free ESPN, G4), then builds only that game (write-once: a stored game
# is never rewritten, a tipped game is refused — lib/sports/nba/forecast-receipt.mjs), verifies no committed
# forecast changed, and commits. Overlapping or repeated runs are no-ops by construction.
#
# CLOCKS. Its own hourly cron (best-effort, like every cron here) plus `workflow_run` on publication-watchdog
# (dense 12–22Z) and a `workflow_dispatch` from daily-products' `tick` job — the same two clocks
# nfl-kickoff-refresh relies on, measured to deliver when single crons are dropped. (daily-products was a
# workflow_run source until Session 12; it sits 4 deep in the morning chain, where GitHub never fires one.)
#
# ⚠ OWN CONCURRENCY GROUP, DELIBERATELY NOT gtp-generated-artifacts: a pending run in a group cancels the
# previous pending one, and a dense tick in the shared writer group would cancel daily-products / settle runs.
# It writes only data/internal/research/nba/** and injuries/nba/latest.json; a push race with another writer
# is handled by re-planning on the new main (the write-once builder makes that correct), up to 3 times.
#
# NEXT-SLATE PUBLICATION (founder 2026-10-30; lib/sports/nba/next-slate-publication.mjs). The decider also freezes the
# NEXT ET slate whole — v0 + v0.1 (+ v0.3 aligned) with no horizon, exactly what sport-schedules' daily build does for
# today, only earlier — once every game of the previous ET date is final / postponed / suspended, or at 06:00
# America/New_York on the slate date, whichever comes first. The lane publish (unchanged rules: once per slate, never
# rewritten) then tries that slate as well as today ET, so the official lane lands overnight / early morning instead
# of after the 14–17Z daily run. Overnight clocks: nba-results-refresh DISPATCHES this workflow after it commits a new
# final (a fresh chain — a workflow_run source would push nba-finals-waiter past the 4-workflow limit), plus the
# extra crons below around the fallback (10Z EDT / 11Z EST), plus publication-watchdog from 12Z.
#
# FREE: no secrets, no paid provider, no npm install (the scripts are dependency-free .mjs).
name: nba-forecast-window

on:
  schedule:
    - cron: "17 * * * *"
    # Best-effort extras across the 06:00 ET fallback (10:00Z under EDT, 11:00Z under EST).
    - cron: "4,34 10,11 * * *"
  workflow_run:
    workflows: ["publication-watchdog"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and report, but never build or commit"
        required: false
        default: "false"

concurrency:
  group: nba-forecast-window
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  window:
    # THE TRUST BOUNDARY ON A workflow_run TRIGGER: only a default-branch run may tick this; nothing from the
    # triggering run is read or executed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Is a pre-tip NBA forecast owed?
        id: decide
        working-directory: app
        run: |
          set -euo pipefail
          node scripts/nba/decide-nba-forecast-window.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # PREGAME ROSTER RECAPTURE (founder 11-11, NBA operations; nba-roster-pregame-recapture@1). eligibility@1 trusts a
      # roster for BUILD_MAX_AGE_HOURS (6 h) at build time, and sport-schedules' daily capture (~17Z) was older than that for
      # every build after ~23Z, so every NBA player read "not verified". On slate days, every tick: roster-recapture-due.mjs
      # (eligibility@1's own constant, imported) says whether the committed capture is already that old, or would be by the
      # slate's last tip while a capture now still covers it; when due, re-capture (free ESPN, no key) at this instant.
      # The normalised files are kept in $RUNNER_TEMP: the build step below restores them after each attempt's
      # `git reset --hard origin/main` and commits them IN ITS OWN COMMIT; only a run with no forecast commit commits them
      # alone (one commit, rosters only). Rosters are not a Vercel build input, so neither adds a Production build.
      # continue-on-error: a failed capture writes nothing (latest.json stays) and the alert step below raises it.
      - name: Pregame NBA roster re-capture (slate days)
        id: roster
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DUE="$(node scripts/nba/roster-recapture-due.mjs --now "$NOW")"
          echo "roster: $DUE"
          if [ "${DUE%% *}" != "due" ]; then exit 0; fi
          node scripts/nba/capture-nba-rosters.mjs --now "$NOW"
          mkdir -p "$RUNNER_TEMP/nba-roster"
          cp ../data/internal/research/nba/rosters/latest.json "../data/internal/research/nba/rosters/${NOW:0:10}.json" "$RUNNER_TEMP/nba-roster/"
          echo "captured=1" >> "$GITHUB_OUTPUT"
          echo "dated=${NOW:0:10}.json" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"

      - name: Capture injuries, build the owed forecasts, verify, commit
        id: build
        if: steps.decide.outputs.decision == 'BUILD' && github.event.inputs.dry_run != 'true'
        working-directory: app
        env:
          DATES: ${{ steps.decide.outputs.dates }}
          NEXTDAY: ${{ steps.decide.outputs.nextday }}
          ROSTER_CAPTURED_NOW: ${{ steps.roster.outputs.captured }}
          ROSTER_DATED: ${{ steps.roster.outputs.dated }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          for ATTEMPT in 1 2 3; do
            git reset -q --hard origin/main
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The pregame roster re-captured by the step above (if it was due): restored after this attempt's reset, before
            # any family reads it, and committed in this step's commit below. Never re-captured here.
            ROSTER_CAPTURED=0
            if [ "${ROSTER_CAPTURED_NOW:-}" = "1" ]; then
              cp "$RUNNER_TEMP/nba-roster/latest.json" "$RUNNER_TEMP/nba-roster/$ROSTER_DATED" ../data/internal/research/nba/rosters/
              ROSTER_CAPTURED=1
            fi
            # G4 — injuries first, at the forecast's own instant. A failed capture writes nothing (last-known-good
            # stands) and the receipt records that snapshot's real age; it never blocks the forecast.
            node scripts/sports/capture-injuries.mjs --now "$NOW" \
              || echo "::warning::injuries capture refused — receipts record the committed snapshot and its age"
            V0_FAILED=0
            # NEXT SLATE, WHOLE (no horizon): the previous ET slate is final, or the 06:00 ET fallback passed. Same
            # families, same order, same instant and same write-once / pre-tip rules as sport-schedules' daily build of
            # today; v0.2 / v1 stay on the 8 h window below (NEXTDAY is also in DATES, which freezes its Top Boards).
            if [ -n "$NEXTDAY" ]; then
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$NEXTDAY" --now "$NOW" --write --family v0 || V0_FAILED=1
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$NEXTDAY" --now "$NOW" --write --family v0.1 \
                || echo "::warning::v0.1 refused for next slate $NEXTDAY (roster gate) — the lane holds until it freezes"
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$NEXTDAY" --now "$NOW" --write --family v0.3 \
                || echo "::warning::v0.3 refused for next slate $NEXTDAY — v0 and v0.1 unaffected"
            fi
            for D in $DATES; do
              # v0 is the preregistered record: its refusal fails the run. v0.1 is research: its roster gate
              # refusing is the gate working, so it warns and never costs v0 the game.
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$D" --now "$NOW" --write --family v0 --horizon-hours 8 || V0_FAILED=1
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$D" --now "$NOW" --write --family v0.1 --horizon-hours 8 \
                || echo "::warning::v0.1 refused for $D (roster gate) — v0 unaffected"
              # v0.2 is the 2026-27 challenger (founder N3): shadow research, same instant. Its refusal warns, never fails.
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$D" --now "$NOW" --write --family v0.2 --horizon-hours 8 \
                || echo "::warning::v0.2 refused for $D — v0 and v0.1 unaffected"
              # v1 is the coherent-engine CANDIDATE (nba-sim-v1-coherent): shadow research, same instant. Its refusal warns, never fails.
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$D" --now "$NOW" --write --family v1 --horizon-hours 8 \
                || echo "::warning::v1 refused for $D — v0, v0.1 and v0.2 unaffected"
              # v0.3 is the role-minutes forward-shadow CHALLENGER (founder 2026-10-22; prereg look 8 / §14). It freezes a game
              # only where v0.1 froze it at this same --now from the same inputs (alignedCutoffRefusal); refusal warns only.
              node scripts/nba/build-nba-experimental-forecasts.mjs --date "$D" --now "$NOW" --write --family v0.3 --horizon-hours 8 \
                || echo "::warning::v0.3 refused for $D — v0, v0.1, v0.2 and v1 unaffected"
              # PRIVATE Top Boards (points / rebounds / assists / 3PM), frozen write-once at this same pre-tip instant from
              # the forecasts just built or already committed (v0.1 = player champion, founder N1; v1 = coherent-engine
              # candidate). This workflow is the ONLY writer of top-boards/<family>/<date>.json (grading writes ledger.json
              # in sport-schedules). A refusal warns and never costs a forecast.
              node scripts/nba/freeze-nba-top-boards.mjs --family v0.1 --date "$D" --now "$NOW" --write \
                || echo "::warning::v0.1 top-board freeze refused for $D — forecasts unaffected"
              node scripts/nba/freeze-nba-top-boards.mjs --family v1 --date "$D" --now "$NOW" --write \
                || echo "::warning::v1 top-board freeze refused for $D — forecasts unaffected"
            done
            if [ "$V0_FAILED" = "1" ]; then echo "::error::v0 forecast build refused"; exit 1; fi
            # One `git add` per family directory that exists: a single missing pathspec (experimental-v1/ before v1's first
            # successful build) makes `git add` stage NOTHING, which would silently drop every other family's forecast.
            for FD in experimental experimental-v0.1 experimental-v0.2 experimental-v1 experimental-v0.3; do
              if [ -d "../data/internal/research/nba/$FD" ]; then git add "../data/internal/research/nba/$FD/"; fi
            done
            # Frozen board day files (never ledger.json, which belongs to sport-schedules), per family directory that exists.
            for BD in top-boards/v0.1 top-boards/v1; do
              if [ -d "../data/internal/research/nba/$BD" ]; then find "../data/internal/research/nba/$BD" -maxdepth 1 -name '20*.json' -exec git add {} +; fi
            done
            if git diff --cached --quiet; then echo "no forecast or board added — nothing to commit"; exit 0; fi
            # Never commit a run that changed or removed an already-committed forecast.
            node scripts/nba/verify-nba-forecast-receipts.mjs --against HEAD || exit 1
            # The exact injury snapshot the receipts hash, so the hash can be checked against history.
            git add ../data/internal/research/injuries/nba/latest.json
            if [ -f ../data/internal/research/transactions/nba/latest.json ]; then git add ../data/internal/research/transactions/nba/latest.json; fi
            # The roster the receipts hash, when this run re-captured it (normalised files only; raw/ is never committed).
            if [ "$ROSTER_CAPTURED" = "1" ]; then
              git add ../data/internal/research/nba/rosters/latest.json "../data/internal/research/nba/rosters/$ROSTER_DATED"
            fi
            git commit -q -m "auto: nba pre-tip forecast window $NOW [skip ci]"
            if git push -q origin HEAD:main; then echo "committed on attempt $ATTEMPT"; echo "committed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            # Lost a race with another writer: re-plan on the new main (the write-once builder makes that correct).
            echo "::warning::push lost a race (attempt $ATTEMPT) — re-planning on the new main"
            sleep $((ATTEMPT * 15))
            git fetch -q origin main
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # ONCE-PER-SLATE LANE PUBLISH (#1150). Runs on every non-dry tick — BUILD or hold — so a slate whose last game was
      # refused still publishes once that game tips. decidePublish HOLDs until every game of the ET slate is frozen or has
      # tipped, NOOPs on an identical committed day file, and REFUSEs (exit 1) rather than rewrite a published slate.
      # Commits only the day file + latest.json: one Production build per slate (the /nba page is a static export).
      # Tries today ET AND the decider's next slate (founder 2026-10-30): when the previous slate went final before
      # midnight ET, the next slate is tomorrow ET and would otherwise wait for midnight. Oldest first, so latest.json
      # (which only moves forward) ends on the newest slate.
      # The pregame roster when no forecast commit carried it (no forecast owed this tick, or none added): ONE commit,
      # roster files only, from this job. Rosters are not a Vercel build input, so the push adds no Production build.
      - name: Commit the pregame NBA roster (runs with no forecast commit)
        if: ${{ !cancelled() && steps.roster.outputs.captured == '1' && steps.build.outputs.committed != '1' && github.event.inputs.dry_run != 'true' }}
        working-directory: app
        env:
          ROSTER_DATED: ${{ steps.roster.outputs.dated }}
          ROSTER_NOW: ${{ steps.roster.outputs.now }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/nba-roster/latest.json" "$RUNNER_TEMP/nba-roster/$ROSTER_DATED" ../data/internal/research/nba/rosters/
            git add ../data/internal/research/nba/rosters/latest.json "../data/internal/research/nba/rosters/$ROSTER_DATED"
            if git diff --cached --quiet; then echo "roster unchanged on main — nothing to commit"; exit 0; fi
            git commit -q -m "auto: nba pregame roster re-capture $ROSTER_NOW [skip ci]"
            if git push -q origin HEAD:main; then echo "committed on attempt $ATTEMPT"; exit 0; fi
            echo "::warning::roster push lost a race (attempt $ATTEMPT)"
            sleep $((ATTEMPT * 15))
          done
          echo "::error::could not push the pregame roster after 3 attempts"
          exit 1

      # RED SIGNAL (PD 2026-11-11, #1307's pattern): the pregame roster re-capture is an eligibility input and never fails
      # the window. A failure is never silent: a ::warning on the run and the ops alert (scripts/ops_alert.sh,
      # OPS_ALERT_KIND warning). No commit here. Guarded by nba-roster-pregame.test.mjs.
      - name: Alert when the pregame roster re-capture failed
        if: ${{ !cancelled() && steps.roster.outcome == 'failure' }}
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          OPS_ALERT_KIND: warning
          PHASE: nba-forecast-window
          EXIT_STATUS: "1"
          ERROR_LINE: "NBA pregame roster re-capture failed; the committed capture stays and eligibility@1 reports what it cannot verify"
        run: |
          set -euo pipefail
          echo "::warning::nba-forecast-window: pregame roster re-capture failed"
          bash scripts/ops_alert.sh

      - name: Publish the NBA experimental lane (once per slate)
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' && steps.build.outcome != 'failure' }}
        working-directory: app
        env:
          SLATE: ${{ steps.decide.outputs.slate }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Theater (#1167, founder 2026-10-21): --deepen lets the generator re-read the roster/injury blobs the official
          # receipts hashed. --theater builds the slate's possession runs into data/internal/research/nba/
          # theater-possession/$D/ on PUBLISH only (no-rewrite); it prints theater=OK|FAILED|SKIPPED and the exit code
          # reflects ONLY the lane, so a Theater failure never blocks the lane. The artifact rides THIS once-per-slate
          # commit (a BUILD_INPUT that is never committed per freeze, so it costs no extra Production build).
          publish_one() {
            D="$1"
            for ATTEMPT in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main
              git fetch -q --deepen=400 origin main || echo "::warning::deepen failed; the Theater may refuse, the lane is unaffected"
              OUT="$(node scripts/nba/publish-nba-experimental-lane.mjs --date "$D" --write --theater)"; RC=$?
              echo "$OUT"
              if [ "$RC" != "0" ]; then echo "::error::lane publish refused for $D"; return 1; fi
              case "$OUT" in *"action=PUBLISH"*) ;; *) return 0 ;; esac
              git add "public/data/nba/experimental-public/$D.json" public/data/nba/experimental-public/latest.json 2>/dev/null || git add public/data/nba/experimental-public/latest.json
              if [ -d "../data/internal/research/nba/theater-possession/$D" ]; then git add "../data/internal/research/nba/theater-possession/$D/"; fi
              if git diff --cached --quiet; then echo "nothing staged"; return 0; fi
              git commit -q -m "auto: nba experimental lane $D (once per slate; Theater runs if built) [skip ci]"
              if git push -q origin HEAD:main; then return 0; fi
              echo "::warning::push lost a race (attempt $ATTEMPT)"; sleep $((ATTEMPT * 15))
            done
            echo "::error::could not push the lane for $D after 3 attempts"; return 1
          }
          TODAY="$(TZ=America/New_York date +%Y-%m-%d)"
          FAILED=0
          for D in $(printf '%s\n' "$TODAY" ${SLATE:-} | sort -u); do publish_one "$D" || FAILED=1; done
          exit "$FAILED"

      - name: Report a hold
        if: steps.decide.outputs.decision != 'BUILD'
        run: echo "::notice::nba-forecast-window held — no NBA game tips within 8 h without a forecast from every family"
