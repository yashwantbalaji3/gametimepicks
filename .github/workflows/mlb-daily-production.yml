# mlb-daily-production.yml — the SINGLE controlled MLB daily-slate COMPLETION pipeline.
#
# The board (schedule + projections) is generated by morning-projections.yml. This workflow CHAINS after it and
# performs the completion steps that were previously manual/dormant, so a full public MLB slate is produced daily:
#
#   (board ← morning-projections)  →  team markets  →  player props  →  game simulations  →  verify  →  commit
#
# GUARANTEES:
#   • Fail-closed: if the board is missing, the completion steps are skipped and nothing is published.
#   • Never fabricate: the paid ingests write only what a real provider returns; a missing market yields an honest
#     "Awaiting market data" state, never a fake ready slate.
#   • Money-safe: the commit is PATH-SCOPED to the 4 public MLB slate dirs only; it can never touch portfolio /
#     mr-dub / settled_leans / bank-builder / moonshot. NO force push. [skip ci].
#   • Non-blocking paid steps (continue-on-error) with the ingest scripts' own credit guards; the free sim + verify
#     always run. Odds API key comes ONLY from the CI secret; it is never logged or written into an artifact.
name: mlb-daily-production

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD, ET). Blank = today (ET)."
        required: false
      dry_run:
        description: "true = plan only (no paid calls, no commit)."
        required: false
        default: "false"
  # Chain right after the projection board is refreshed.
  workflow_run:
    workflows: ["morning-projections"]
    types: [completed]
  # Backstop cron ~14:15 UTC (after morning-projections' 13:30 UTC) in case the chain is skipped.
  schedule:
    - cron: "15 14 * * *"

concurrency:
  group: mlb-daily-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Single source of truth for the Odds API credit floor, exposed under BOTH names the ingests read:
  # ingest-mlb-slate reads ODDS_API_MIN_CREDITS_REMAINING; ingest-mlb-team-markets reads ODDS_CREDIT_FLOOR.
  ODDS_API_MIN_CREDITS_REMAINING: ${{ vars.ODDS_API_MIN_CREDITS_REMAINING || '2000' }}
  ODDS_CREDIT_FLOOR: ${{ vars.ODDS_API_MIN_CREDITS_REMAINING || '2000' }}

jobs:
  complete-slate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve slate date (ET) + dry-run flag
        id: cfg
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE="$(TZ=America/New_York date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "dry=${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "MLB daily production · slate $DATE · dry=${{ github.event.inputs.dry_run || 'false' }}"
      - name: Board precheck (FAIL-CLOSED — never complete a missing board)
        id: board
        run: |
          BOARD="app/public/data/mlb/boards/${{ steps.cfg.outputs.date }}.json"
          if [ -f "$BOARD" ]; then echo "have_board=true" >> "$GITHUB_OUTPUT"; echo "board present: $BOARD";
          else echo "have_board=false" >> "$GITHUB_OUTPUT"; echo "NO board for ${{ steps.cfg.outputs.date }} — morning-projections must run first; skipping completion (nothing published)."; fi
      - name: 3) Team markets ingest (paid Odds API — de-vigged h2h/spreads/totals, credit-guarded, non-blocking)
        if: steps.board.outputs.have_board == 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "ODDS_API_KEY secret not set — skipping team markets (honest no-op, nothing fabricated)."; exit 0; fi
          # npx tsx (NOT bare node): this ingest imports app/src/lib/projection-framework.ts — bare node throws ERR_UNKNOWN_FILE_EXTENSION.
          # --write is REQUIRED (the script refuses to run without --write | --dry-run); --date scopes the slate.
          npx tsx app/scripts/ingest-mlb-team-markets.mjs --write --date "${{ steps.cfg.outputs.date }}" || echo "team-markets ingest failed/blocked — slate stays AWAITING_MARKET_DATA, nothing fabricated"
      - name: 4) Player props ingest (paid Odds API — prop lines, credit-guarded, non-blocking)
        if: steps.board.outputs.have_board == 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then echo "ODDS_API_KEY secret not set — skipping player props (honest no-op)."; exit 0; fi
          npx tsx app/scripts/ingest-mlb-slate.mjs --date "${{ steps.cfg.outputs.date }}" || echo "player-props ingest failed/blocked — nothing fabricated"
      - name: 5) Game simulations (FREE, deterministic, board-based — no network, no money)
        if: steps.board.outputs.have_board == 'true'
        continue-on-error: true
        run: npx tsx app/scripts/generate-mlb-game-simulations.mjs --write --date "${{ steps.cfg.outputs.date }}" --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
      - name: 5b) Full-game simulations (FREE, deterministic, board-based — 10k complete games/matchup, no network, no money)
        if: steps.board.outputs.have_board == 'true'
        continue-on-error: true
        run: npx tsx app/scripts/generate-mlb-full-game-simulations.mjs --write --date "${{ steps.cfg.outputs.date }}" --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
      - name: 5c) Predictions (FREE, deterministic decision layer over the full-game artifact — no network, no money)
        if: steps.board.outputs.have_board == 'true'
        continue-on-error: true
        run: npx tsx app/scripts/generate-mlb-predictions.mjs --write --date "${{ steps.cfg.outputs.date }}" --now "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
      - name: 6) Verify (completeness gate — honest slate status + production health)
        if: steps.board.outputs.have_board == 'true'
        run: node app/scripts/mlb-slate-completeness-gate.mjs --date "${{ steps.cfg.outputs.date }}"
      - name: 7-pre) Install app dependencies (required for the build — the ingests use npx tsx and need no install)
        id: deps
        if: steps.board.outputs.have_board == 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        run: cd app && npm ci
      - name: 7) Public build (verification — confirms the completed slate renders)
        id: build
        if: steps.board.outputs.have_board == 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        run: cd app && npm run build
      - name: 7b) Finalize health (record buildStatus from the build outcome)
        if: steps.board.outputs.have_board == 'true'
        continue-on-error: true
        env:
          MLB_BUILD_STATUS: ${{ steps.build.outcome }}
        run: node app/scripts/mlb-slate-completeness-gate.mjs --date "${{ steps.cfg.outputs.date }}"
      - name: 7c) Ops heartbeat + admin status (dead-man's switch — records FAILURES, never a blanket "pass")
        if: always()
        continue-on-error: true
        run: |
          set -u
          # The heartbeat's value is that it stops when the pipeline stops, and tells the truth when the
          # pipeline runs badly. Derive the status from what actually happened — never hardcode "pass".
          # build-admin-status.mjs then regenerates admin/status.json, which fails closed on a stale
          # heartbeat (>36h). Before this step, NOTHING in CI wrote either file: the heartbeat had gone
          # 409h without an update while /ops kept reporting ok:true from its last recorded verdict.
          if [ "${{ steps.board.outputs.have_board }}" != "true" ]; then
            ST=partial; MSG="no board for the date — nothing to produce"
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            ST=pass; MSG="slate generated and built"
          else
            ST=fail; MSG="public build ${{ steps.build.outcome }}"
          fi
          echo "heartbeat status=$ST ($MSG)"
          node app/scripts/ops-notify.mjs --status "$ST" --phase "mlb-daily-production" --date "${{ steps.cfg.outputs.date }}" --message "$MSG"
          npx tsx app/scripts/build-admin-status.mjs || echo "admin status build skipped"

      - name: 8) Persist completed slate (PATH-SCOPED to public MLB slate dirs; money-safe; rebase-safe; [skip ci])
        if: steps.board.outputs.have_board == 'true' && steps.cfg.outputs.dry != 'true'
        continue-on-error: true
        run: |
          set -u
          git config user.name "gtp-mlb-production-bot"
          git config user.email "noreply@anthropic.com"
          # PATH-SCOPE: ONLY the 4 public MLB slate artifact dirs + the internal health status.
          # Every artifact a step above GENERATES must be staged here, or the run silently discards it.
          # full-game-simulations/ (step 5b) and predictions/ (step 5c) were missing from this list: they
          # were produced on every automated run and thrown away, so the autopilot never published the
          # full-game simulation or prediction layers at all — both paths' only commits were manual.
          # Guarded by app/src/lib/daily-production-commit-scope.test.mjs.
          git add app/public/data/mlb/team-markets/ app/public/data/mlb/player-props/ app/public/data/mlb/home-run-props/ app/public/data/mlb/game-simulations/ app/public/data/mlb/full-game-simulations/ app/public/data/mlb/predictions/ app/public/data/mlb/schedule/ app/public/data/ops/ app/public/data/admin/ data/internal/mlb/pregame-archive/status/mlb-production-health.json data/internal/mlb/production-history/ 2>/dev/null || true
          # SAFETY ASSERT: never portfolio / money / official settlement / product cards.
          BAD="$(git diff --cached --name-only | grep -iE 'portfolio|mr-dub|settled_leans|bank-builder|moonshot|/out/' || true)"
          if [ -n "$BAD" ]; then echo "ABORT: forbidden paths staged:"; echo "$BAD"; git reset -q; exit 0; fi
          if git diff --cached --quiet; then echo "no slate changes to persist"; exit 0; fi
          git commit -m "auto: mlb daily production slate ${{ steps.cfg.outputs.date }} [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; echo "rebase skipped"; exit 0; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped (non-fast-forward or perms)"
      - name: 9) Upload diagnostics (health report — always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-production-health-${{ github.run_id }}
          path: data/internal/mlb/pregame-archive/status/mlb-production-health*.json
          retention-days: 30
          if-no-files-found: ignore
      # This workflow NEVER touches money/portfolio/official-settlement; it only completes the public MLB slate.
