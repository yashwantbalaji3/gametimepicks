# Daily product generation — Bank Builder / Moonshot / portfolio (Program 140).
#
# WHY THIS EXISTS. `scripts/refresh_daily_products.sh` is the only thing that regenerates these
# products, and it was scheduled by nothing. Bank Builder and Moonshot sat frozen at 2026-07-21 for
# fifteen days while the site reported "Live today", because the MLB board — which IS scheduled —
# kept the slate date current. Nothing was broken; nothing was running.
#
# THE COST BOUNDARY, WHICH IS THE WHOLE REASON THIS IS A SEPARATE WORKFLOW.
# refresh_daily_products.sh does two different jobs:
#   1. DATA ACQUISITION — generate_mlb_board (Odds API) and ingest-mlb-team-markets
#      ("~3 credits", credit-guarded). This SPENDS MONEY and is already covered by
#      mlb-daily-production.yml. It is deliberately NOT run here.
#   2. PRODUCT GENERATION — activate-daily-portfolio → build-master-ledger → build-admin-status.
#      Verified network-free: no fetch, no http(s) URL, no provider SDK in any of the three, nor in
#      their imports. They read committed artifacts and write committed artifacts.
#
# This workflow runs ONLY step 2. It therefore cannot consume a single API credit, which is what
# makes scheduling it safe without founder approval. Scheduling step 1 is a separate decision with a
# real cost and is NOT taken here.
#
# It also cannot invent a card: activate-daily-portfolio applies unchanged qualification policy. On
# 2026-08-05 the honest answer was 0/2 and 0/3 qualified legs, and publishing that no-play is the
# correct outcome — the page then says "No qualified card today" instead of a fifteen-day-old lie.
name: daily-products

on:
  schedule:
    # 15:30 UTC ≈ 11:30 ET — AFTER the inputs this job consumes actually exist.
    #
    # This was 12:10 UTC, with the comment "after the morning board generation". That premise was
    # false: mlb-daily-production generates the board at 14:15 UTC and its player props land around
    # 14:55. Every run fired nearly three hours BEFORE either, so the risk-ladder builder correctly
    # refused — "no candidate pool exists yet, refusing to overwrite the published ladder with an
    # empty day" — and the job could never produce the artifact it exists to produce.
    #
    # It looked healthy until 2026-08-18 only because nothing checked. The post-run assertion added
    # that day made the emptiness visible, and the job has failed every morning since; the MLB risk
    # ladder has been rebuilt and thrown away each time, because the failing assert sits before the
    # commit step. The ladder on disk is still dated 2026-08-19.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Product date (YYYY-MM-DD, ET). Blank = today."
        required: false
      dry_run:
        description: "Preview only — write nothing."
        type: boolean
        default: false

# Shares the artifact writer group: this commits to app/public/data, so it must never interleave
# with the board generator or the settler.
concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record the run start
        run: echo "RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.4.0"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Resolve product date (ET)
        id: d
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=America/New_York date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "product date: $DATE"

      - name: Record protected money BEFORE
        id: before
        run: |
          set -euo pipefail
          H=$(cat app/public/data/mr-dub/portfolio.json app/public/data/mr-dub/bank-builder-locks.json | md5sum | cut -d' ' -f1)
          echo "hash=$H" >> "$GITHUB_OUTPUT"

      - name: Generate daily products (NETWORK-FREE — no provider, no credits)
        run: |
          set -euo pipefail
          DATE="${{ steps.d.outputs.date }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx tsx app/scripts/activate-daily-portfolio.mjs --date "$DATE"
            echo "DRY RUN — nothing written"; exit 0
          fi
          npx tsx app/scripts/activate-daily-portfolio.mjs --date "$DATE" --apply
          npx tsx app/scripts/build-master-ledger.mjs
          npx tsx app/scripts/build-admin-status.mjs
          # Evidence ledger (Program 144): joins admin status + alpha + gates with freshness and
          # contradiction detection. Network-free like everything else in this workflow. Exit 1 on
          # a NEW contradiction stops the commit — a contradictory dashboard must not publish.
          node app/scripts/build-evidence-ledger.mjs
          # Today's card per risk tier + the tier record. Network-free like everything else in this
          # job: it reads only committed parlay artifacts. Non-fatal — a day with no snapshot simply
          # publishes no cards and says so.
          (cd app && node scripts/parlays/build-risk-ladder.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --date "$DATE") || true

      - name: Protected money must be byte-identical
        # A DISPLAY refresh that moved the bankroll would be a serious defect. The orchestrator has
        # this guard; a scheduled job that writes the same artifacts needs it just as much.
        run: |
          set -euo pipefail
          AFTER=$(cat app/public/data/mr-dub/portfolio.json app/public/data/mr-dub/bank-builder-locks.json | md5sum | cut -d' ' -f1)
          if [ "$AFTER" != "${{ steps.before.outputs.hash }}" ]; then
            echo "::error::CANONICAL MONEY CHANGED during a product refresh — investigate before merging"
            exit 1
          fi
          echo "protected money unchanged"

      - name: Validate the artifact before publishing
        run: |
          set -euo pipefail
          node -e "
            const d = require('./app/public/data/mr-dub/daily-portfolio.json');
            if (d.date !== '${{ steps.d.outputs.date }}') { console.error('date mismatch: ' + d.date); process.exit(1); }
            if (typeof d.activeBankroll !== 'number') { console.error('missing bankroll'); process.exit(1); }
            console.log('artifact ok: ' + d.date + ' · lanes ' + (d.lanes || []).length);
          "

      # P172-E/F/G: one dated operating receipt per day covering Bank Builder, Moonshot, and the
      # Vault. It reads the SAME authority activate-daily-portfolio just ran and records what that
      # authority decided — including the distinction a page cannot show on its own: a missing
      # slate is INPUTS_MISSING, never a no-play. It writes only its own receipt path.
      - name: Write the daily product receipt
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx tsx app/scripts/products/build-daily-product-receipts.mjs --now "$NOW" --date "${{ steps.d.outputs.date }}"

      # The Parlay Lab silently showed nothing for a full day because this job rebuilt the ladder

      # against a candidate pool that did not exist yet, and no step checked the result. A green

      # run is not evidence the pipeline ran.

      - name: Assert this run produced its artifacts

        run: |

          set -euo pipefail

          node app/scripts/ops/assert-run-produced.mjs --since "$RUN_STARTED" --allow-missing \
            app/public/data/parlays/risk-ladder/latest.json


      - name: Commit if anything changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/mr-dub/ app/public/data/admin/ data/internal/products/receipts/ || true
          git add app/public/data/parlays/risk-ladder/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change — products already current for ${{ steps.d.outputs.date }}"
            exit 0
          fi
          # ── DROP THE STAMP-ONLY FILES, NOT THE WHOLE COMMIT ─────────────────────────────────
          #
          # The generator is CONTENT-idempotent but stamps a fresh `generatedAt` every run, so a byte
          # comparison would commit every day even when nothing changed. The previous filter answered
          # that by comparing ONE file — mr-dub/daily-portfolio.json — and, if that file was unchanged,
          # running `git reset` over everything else.
          #
          # The portfolio legitimately does not move on a day when nothing settles. The MLB risk
          # ladder changes every day. So on 2026-08-22 this workflow built a fresh ladder, reported
          # "3/4 tiers carded", and then discarded it because a different artifact had not moved —
          # leaving the live ladder dated 2026-08-19, three days stale on a product surface.
          #
          # A one-file proxy cannot speak for a staged set. Each file is now compared on its own and
          # only the stamp-only ones are unstaged; whatever genuinely changed still commits.
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const staged = execSync('git diff --cached --name-only', { encoding: 'utf8' }).split('\n').filter(Boolean);
            const stampOnly = [];
            for (const f of staged) {
              if (!f.endsWith('.json')) continue;
              let head;
              try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { continue; }
              const strip = (j) => { try { const o = JSON.parse(j); delete o.generatedAt; return JSON.stringify(o); } catch { return null; } };
              const a = strip(head), b = strip(fs.readFileSync(f, 'utf8'));
              if (a !== null && a === b) stampOnly.push(f);
            }
            for (const f of stampOnly) {
              execSync('git restore --staged ' + JSON.stringify(f));
              console.log('  stamp-only, not published: ' + f);
            }
          "
          if git diff --cached --quiet; then
            echo "every staged artifact differed only by its generatedAt stamp — nothing to publish"
            git reset
            exit 0
          fi
          git commit -m "auto: daily products ${{ steps.d.outputs.date }} [skip ci]"
          # Fast-forward over the nightly bot rather than racing it.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
