# ----------------------------------------------------------------------------
# nightly-settle.yml
#
# Settles yesterday's NBA + MLB slates close to when the night's games
# finish. Runs TWICE daily (both interpreted in UTC):
#   - 05:30 UTC — early "first results" pass (1:30 AM EDT / 12:30 AM EST)
#   - 07:30 UTC — completeness / repair pass (3:30 AM EDT / 2:30 AM EST)
# Cron is interpreted in UTC, so the wall-clock ET time walks by an hour
# at the DST boundary. Settlement is idempotent and refuses in-progress
# games at the source layer, so the early pass can settle the bulk of the
# slate while any late West-Coast / extra-inning game stays honestly
# pending until the repair pass (or a manual re-run) finalizes it.
# Pending NEVER counts as a loss. See docs/SETTLEMENT_CRON_TIMING.md.
#
# What this workflow DOES:
#   - Resolve yesterday's date in America/New_York
#   - Run NBA settlement (settle_results uses ESPN summary + nba_api;
#     in-progress games refused at source layer)
#   - Run MLB settlement (settle_mlb_results uses MLB Stats API;
#     partial settlement when games are still pending)
#   - Export sanitized results to app/public/data/{results,mlb/results}
#   - Rebuild model_audit.json from the freshly-settled JSONLs
#   - Grade legacy parlay snapshots (grade_parlays)
#   - Grade single-leg curated picks (grade_curated)
#   - Grade optimizer parlay snapshots — the slips the homepage +
#     /parlay-lab + /results actually display (grade_optimizer --all,
#     added PR #98)
#   - Run daily postmortem audit (audit_daily, added PR #117) over the
#     freshly-graded slate — pure aggregation, never adjusts weights
#   - Run confirmed-signal policy (audit_signal_policy, added PR #118)
#     over the rolling audit window — demotion-only, requires 3+
#     confirming days for any model-changing signal
#   - Commit + push the regenerated data so /results picks it up
#
# What this workflow does NOT do:
#   - Call any paid API (settlement uses free public endpoints only)
#   - Run projection generation
#   - Count pending games as losses (handled at the pipeline source)
#   - Touch code or anything outside the data allowlist
#
# Required secrets: NONE. Settlement is fully free.
#
# Manual trigger: Actions → nightly-settle → Run workflow.
# Inputs:
#   settle_date (string, YYYY-MM-DD) — override the target date
#   dry_run (boolean) — print the plan without running
# ----------------------------------------------------------------------------

name: nightly-settle

on:
  schedule:
    # Two-pass nightly settlement (both interpreted in UTC):
    #
    #   05:30 UTC — early "first results" pass = 1:30 AM EDT / 12:30 AM EST.
    #     NBA is always final by then (June = Finals: one prime-time game,
    #     done ~11:30 PM ET). Most MLB games are final; any West-Coast or
    #     extra-inning game still in progress is refused at the source layer
    #     and excluded from W/L (never a loss) — it stays honestly pending.
    #
    #   07:30 UTC — completeness / repair pass = 3:30 AM EDT / 2:30 AM EST.
    #     Re-targets the SAME "yesterday in ET" date and is fully idempotent,
    #     so it finalizes any game that was still in progress at 05:30. This
    #     is 30 min later than the previous single 07:00 run, giving extra
    #     margin for the longest games. It only commits/deploys when it finds
    #     newly-final games, so a clean night produces no second deploy.
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      settle_date:
        description: "Target date (YYYY-MM-DD). Default: yesterday in ET."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Print the plan only, no settle calls."
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly-settle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  settle:
    name: settle yesterday + export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: "America/New_York"
      SETTLE_DATE: ${{ github.event.inputs.settle_date || '' }}
      DRY_RUN_SETTLE: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Show settlement context
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  GametimePicks — nightly-settle"
          echo "════════════════════════════════════════════════════════"
          echo "  ET date now:   $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          echo "  UTC time now:  $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "  Trigger:       ${{ github.event_name }}"
          echo "  SETTLE_DATE:   ${SETTLE_DATE:-(yesterday in ET)}"
          echo "  DRY_RUN:       ${DRY_RUN_SETTLE}"
          echo "════════════════════════════════════════════════════════"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then
            pip install -r pipeline/requirements.txt
          else
            pip install requests
          fi

      - name: Run nightly settlement orchestrator
        id: settle
        run: bash scripts/automation_settle.sh

      # ---- World Cup / Mr. Dub settlement (PR `automate-soccer-settlement`) ----
      # Composes fetch → grade → seed-model → reconcile. Official-final gated, idempotent, partial-safe,
      # and a NO-OP when API_FOOTBALL_KEY is absent or no game is FT yet — so it is safe to schedule and
      # safe to rerun. Non-fatal: a fetch hiccup never fails the nightly run.
      - name: Set up Node (World Cup settlement)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Program 088-091: lockfile-keyed npm cache (parity with the second setup-node
          # in this workflow, which already had it).
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        run: cd app && (npm ci --silent || npm install --silent)
      - name: World Cup / Mr. Dub settlement
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          WC_API_FOOTBALL_LEAGUE: "1"
          WC_API_FOOTBALL_SEASON: "2026"
          # This step is continue-on-error, so anything inside it may silently not happen. The
          # portfolio roll-forward is money state and a later step DEPENDS on it, so it moved out to
          # its own fail-loud step below.
          GTP_SKIP_ROLL: "1"
        run: |
          DATE_ARG=""; [ -n "${SETTLE_DATE}" ] && DATE_ARG="--date ${SETTLE_DATE}"
          if [ "${DRY_RUN_SETTLE}" = "1" ]; then
            bash scripts/settle_soccer_day.sh $DATE_ARG
          else
            bash scripts/settle_soccer_day.sh $DATE_ARG --apply
          fi
        continue-on-error: true

      # ---- MLB player-prop settlement (Bank Builder + Moonshot lanes) ----
      # These lanes are built almost entirely from player props, which the soccer/team settler leaves
      # PENDING by design. Without this step the grades were only ever written by hand, and the daily
      # products job regenerates daily-portfolio.json every morning — so an ungraded night silently
      # lost its results. Runs HERE, after the slate is final and BEFORE the morning products job.
      #
      # It writes a dated receipt under app/public/data/mr-dub/settled/, which is the durable record
      # the ladder reads to decide whether a lane advances. Re-running a settled date is a no-op when
      # the grades match and a hard refusal when they differ, so a rerun can never rewrite history.
      # PARLAY LAB — grade yesterday's published ladder, then rebuild the ledger FROM the receipts.
      # Two steps on purpose: settlement writes a write-once dated receipt, and the ledger is
      # re-derived from those receipts, so a bad settle run can never silently rewrite the record.
      # That separation is exactly what the NFL experimental record lacked when it got wiped.
      - name: Parlay Lab settlement + ledger
        continue-on-error: true
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TARGET="${SETTLE_DATE:-$(TZ=America/New_York date -d 'yesterday' +%F)}"
          # working-directory is set by the `cd app` above / the step key: this script now reaches
          # loadCurrentEplResults, which imports through the "@/" alias declared in app/tsconfig.json.
          # From the repository root it is MODULE_NOT_FOUND — in the settlement workflow, on a money
          # path. Caught by workflow-script-cwd.test.mjs before it ever ran.
          (cd app && npx tsx scripts/parlays/settle-lab-cards.mjs --now "$NOW" --date "$TARGET" --apply)
          node app/scripts/parlays/build-lab-ledger.mjs --now "$NOW"

      - name: MLB player-prop settlement (paper lanes)
        run: |
          # ET-yesterday, matching every other settlement step in this workflow. The first live run
          # passed NO date, so the script fell back to the UTC calendar day — and at 01:59 ET the UTC
          # clock already reads TOMORROW. It refused the slate and settled nothing, silently, because
          # this step WAS continue-on-error at the time. It is not any more — a refusal here now
          # fails the run, which is why the frozen-portfolio bug above surfaced as a red run instead
          # of another silent night.
          TARGET="${SETTLE_DATE:-$(TZ=America/New_York date -d 'yesterday' +%F)}"
          DATE_ARG="--date ${TARGET}"
          cd app
          if [ "${DRY_RUN_SETTLE}" = "1" ]; then
            npx tsx scripts/settle-mlb-player-props.mjs $DATE_ARG
          else
            npx tsx scripts/settle-mlb-player-props.mjs $DATE_ARG --apply
          fi

      # ---- Roll the daily portfolio forward to TODAY (ET) ----
      #
      # Was step 5/6 inside settle_soccer_day.sh, which is invoked above under continue-on-error. The
      # World Cup is retired, that script now fails, the step still reported SUCCESS, and the roll
      # never ran — so daily-portfolio.json froze at 2026-08-18 and every scheduled run after that
      # refused with "daily-portfolio is dated 2026-08-18, not 2026-08-19". A dependency of a
      # fail-loud step must not live inside a fail-tolerant one.
      #
      # It also has to run HERE, after the prop settler: the roll dates the portfolio TODAY, while
      # the settler requires it to still be dated YESTERDAY to grade the slate that just finished.
      - name: Roll the daily portfolio forward (money state — fail loud)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          ROLL_DATE="$(TZ=America/New_York date +%F)"
          npx tsx app/scripts/activate-daily-portfolio.mjs --date "$ROLL_DATE" --apply
          echo "::notice::daily portfolio rolled forward to $ROLL_DATE"

      # The risk ladder re-derives its whole record from every graded day, so it runs AFTER
      # settlement and never carries a number forward from the previous file.
      # ── HOW THE PICKS TURNED OUT, REBUILT WHENEVER SOMETHING SETTLES ─────────────────────────
      #
      # Every sport hub and /results/picks/<sport> render this artifact. It is derived from each
      # sport's own graded ledger and re-grades nothing, so it is safe to rebuild on every run —
      # and it MUST be, because a record of what the model got right that only refreshes when
      # somebody remembers to run a script is exactly the half that goes stale while the forecasts
      # keep publishing. Network-free: it reads committed ledgers only.
      - name: Rebuild the picks-vs-outcomes record for every sport
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          (cd app && node scripts/sports/build-graded-picks.mjs --now "$NOW" --write)

      - name: Rebuild the risk-ladder record
        if: always()
        working-directory: app
        run: node scripts/parlays/build-risk-ladder.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
        continue-on-error: true

      # Homer Nukes — grade the day's five home-run picks from the official box score and rebuild
      # the cumulative record. Uses the SAME ET-yesterday target as the step above; a published
      # probability that is never checked is an opinion, not a model.
      - name: Settle Homer Nukes (official box score)
        run: |
          set -euo pipefail
          TARGET="${SETTLE_DATE:-$(TZ=America/New_York date -d 'yesterday' +%F)}"
          cd app
          if [ "${DRY_RUN_SETTLE}" = "1" ]; then
            node scripts/mlb/settle-homer-nukes.mjs --date "$TARGET" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            node scripts/mlb/settle-homer-nukes.mjs --date "$TARGET" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write
          fi
        continue-on-error: true

      # ---- Daily learning loop (PR `update-learning-after-settlement`) ----
      # Runs ONLY here, AFTER settlement+grading — never in generation. Reads
      # settled outcomes only (no same-day leakage) and rewrites the conservative
      # selection-policy artifact the optimizer reads. Non-fatal: if it fails, the
      # prior artifact stays and generation keeps its conservative fallback.
      - name: Set up Node (selection-learning)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Update selection-learning policy
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd app
          # Deps were already installed by "Install app dependencies" above; reinstalling here
          # doubled the npm work per run. Verify instead of reinstall; install only if missing.
          [ -d node_modules ] || npm ci --no-audit --no-fund || { echo "npm ci failed — skipping learning update (conservative fallback retained)"; exit 0; }
          # PER SPORT, not MLB alone. The loop that turns settled results into a better policy read
          # public/data/mlb literals, so no other sport could ever learn from its own hits and
          # misses. Each sport is now scoped; one that has settled nothing exits 0 saying so, which
          # is a fact to record rather than a failure to alarm on.
          for SPORT in mlb ufc nfl epl; do
            if npx --yes tsx scripts/update-selection-learning.mjs --sport "$SPORT" --write-report; then
              # "completed", not "updated": a sport with no settled ledger exits 0 having done
              # nothing, and the first per-sport run announced "policy updated (ufc)" for three
              # sports that have never settled a thing. The script'"'"'s own stdout carries which it was.
              echo "::notice::selection-learning completed ($SPORT)"
            else
              # Never fatal, and never silent: a sport failing must not cost the other sports their
              # update, but it must still be visible rather than swallowed by the loop.
              echo "::warning::selection-learning update failed for $SPORT — prior policy retained (conservative fallback)"
            fi
          done

      # ---- Bank Builder paper-bankroll ledger (settled-only, §4.2 durable history) ----
      # Runs AFTER grading; reuses the site's own selector + ladder math. Settled results
      # only — no fabrication, idempotent. Non-fatal: prior ledger retained on failure.
      - name: Update Bank Builder ledger
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd app
          if npx --yes tsx scripts/build-bank-builder-ledger.mjs; then
            echo "::notice::Bank Builder ledger updated"
          else
            echo "::warning::Bank Builder ledger update failed — prior ledger retained"
          fi

      # ---- Paper product-card settlement lifecycle (internal, money-independent) ----
      # Four deterministic stages that were built and tested but never scheduled, so the internal
      # ledgers stopped advancing after 2026-07-09 while the pipeline reported healthy:
      #
      #   1. fetch-mlb-linescores       free StatsAPI final scores -> data/internal/mlb/linescores/
      #   2. build-mlb-product-settlement  grades MLB product legs from that committed cache
      #   3. settle-paper-product-cards    grades FOUNDER-PROMOTED paper cards (no-op if none)
      #   4. build-paper-track-record      tallies paper units (never dollars, never the 19-14 record)
      #
      # Promotion into the paper store stays MANUAL and founder-gated — automation only settles cards
      # a human already approved, and never writes data/internal/product-cards/{paper,approvals}/.
      #
      # Every stage is deterministic (content-derived ids, no wall-clock), so an unchanged night
      # rewrites byte-identical files and produces no commit. A short backfill window re-runs recent
      # dates so a failed night self-heals and a leg that was "not settled yet" resolves on a later
      # pass instead of staying pending forever. Non-fatal: prior ledgers are retained on failure.
      - name: Settle paper product cards (internal ledgers)
        id: paper
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd app
          TARGET="${SETTLE_DATE:-$(TZ=America/New_York date -d 'yesterday' +%F)}"
          BACKFILL_DAYS=5
          echo "::notice::paper settlement target=$TARGET (backfill ${BACKFILL_DAYS}d)"

          DATES=""
          for i in $(seq 0 $((BACKFILL_DAYS - 1))); do
            DATES="$DATES,$(date -d "$TARGET - $i days" +%F)"
          done
          DATES="${DATES#,}"

          # 1) Official final scores (free StatsAPI, no Odds API credits). Re-fetching a final date
          #    reproduces a byte-identical file, so the window is safe to re-run every night.
          npx --yes tsx scripts/fetch-mlb-linescores.mjs --dates "$DATES" --write \
            || echo "::warning::linescore fetch failed — grading falls back to the committed cache"

          # 2) + 3) Grade per date from the committed cache. A game with no final linescore stays
          #    pending; missing data is 'unavailable'. Never a fabricated loss.
          for D in $(echo "$DATES" | tr ',' ' '); do
            npx --yes tsx scripts/build-mlb-product-settlement.mjs --date "$D" --write \
              || echo "::warning::MLB product settlement failed for $D — prior ledger retained"
            npx --yes tsx scripts/settle-paper-product-cards.mjs --date "$D" --write \
              || echo "::warning::paper card settlement failed for $D — prior settlement retained"
          done

          # 4) Roll the paper hit-rate ledger. Paper units only; officialRecordIncluded:false.
          npx --yes tsx scripts/build-paper-track-record.mjs --write \
            || echo "::warning::paper track record failed — prior ledger retained"

          # 5) Game-level prediction grading (P196 · Release B1) — moneyline/total/run line from the
          #    forecast of record (immutable per-run snapshots; per-game pre-first-pitch rule) to the
          #    linescores fetched in step 1. Append-only ledger; a date with no qualifying revision
          #    prints MISSING_PRE_EVENT_ARTIFACT rather than grading from a post-hoc file. Model
          #    record only — never money.
          for D in $(echo "$DATES" | tr ',' ' '); do
            npx --yes tsx scripts/mlb/grade-game-predictions.mjs --date "$D" \
              --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write \
              || echo "::warning::game-prediction grading failed for $D — prior ledger retained"
          done

      # ---- SPRINT 048: the learning loop ----
      # The prediction-history exporter existed since Sprint 036 and was referenced by NO workflow and
      # no npm script. It silently froze on 2026-07-08 — 18,227 rows while the ledger held 22,660 — so
      # every calibration conclusion drawn after that date was computed on a corpus three weeks stale.
      # Nothing failed; the analysis just quietly stopped seeing new evidence.
      #
      # It runs here, immediately after settlement, because that is the only moment the ledger has
      # newly-graded rows and the corpus does not. The exporter is deterministic over committed inputs,
      # so a re-run on an unchanged repository is a no-op rather than a churn commit.
      - name: Refresh prediction history + learning artifacts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          set -u
          cd app
          # 1) Prediction history corpus (deterministic; date-partitioned so diffs stay small).
          npx --yes tsx scripts/export-mlb-calibration-rows.mjs --write \
            || echo "::warning::calibration export failed — prior corpus retained"
          # 2) Learning audit: calibration backtest + market registry. Read-only over the corpus.
          mkdir -p ../data/internal/mlb/model-learning
          # PER SPORT. The audit read public/data/mlb literals, so only MLB was ever scored against
          # its own settled results. Output paths are scoped per sport too — a shared filename would
          # have each sport overwrite the last, leaving the loop holding whichever ran final.
          for SPORT in mlb ufc nfl epl; do
            mkdir -p "../data/internal/$SPORT/model-learning"
            npx --yes tsx scripts/model-learning-audit.mjs --sport "$SPORT" \
              --json "../data/internal/$SPORT/model-learning/model-learning-audit.json" \
              --markdown "../data/internal/$SPORT/model-learning/model-learning-audit.md" \
              || echo "::warning::model-learning audit failed for $SPORT — prior artifacts retained"
          done
          # 3) Freshness + drift monitor. Non-fatal by design: a stale corpus must be VISIBLE on /ops,
          #    not a reason to abort a settlement that already succeeded.
          # Row-lineage envelopes. build-research-row-lineage.mjs was in NO workflow, so the artifact
          # set froze at 2026-07-28 and three weeks of settled dates had no lineage receipt at all.
          # Non-fatal: a missing envelope must be VISIBLE, not a reason to abort a settlement that
          # already succeeded.
          npx --yes tsx scripts/build-research-row-lineage.mjs --write --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || echo "::warning::row-lineage build failed — prior envelopes retained"
          npx --yes tsx scripts/check-learning-freshness.mjs --write \
            || echo "::warning::learning freshness check reported a problem — see admin status"
          # 4) SPRINT 050 — the public research contract every user-facing surface reads. Built here so
          #    a number that appears on two pages comes from one place; deriving it per-surface is how
          #    /board and /about ended up with a hardcoded 51.7% that drifted from the ledger for weeks.
          npx --yes tsx scripts/build-public-research-contract.mjs --write \
            || echo "::warning::public research contract build failed — prior artifacts retained"

      - name: Health gate (abort publish on missing/stale/non-reconciling data)
        id: health
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd app
          # Hard gate: money invariants + $100→bankroll reconciliation + data hygiene + freshness.
          # A non-zero exit FAILS the job, so the commit/push step below never runs on corrupted data.
          npx --yes tsx scripts/health-check.mjs --today "$(TZ=America/New_York date +%F)"

      # ---- Ops heartbeat for the POSTGAME half of the lifecycle ----
      # mlb-daily-production writes a heartbeat for the pregame half; nothing wrote one here, so after a
      # nightly settle /ops still reported `phase: mlb-daily-production` from the previous afternoon and
      # said nothing about settlement at all. It was not lying — the 36h staleness guard had not tripped —
      # but a whole half of the daily lifecycle was invisible on the one surface meant to show it.
      #
      # Status is DERIVED from what actually happened. Never hardcode "pass".
      - name: Ops heartbeat + admin status (settlement half)
        if: always()
        continue-on-error: true
        run: |
          set -u
          TARGET="${SETTLE_DATE:-$(TZ=America/New_York date -d 'yesterday' +%F)}"
          if [ "${{ steps.settle.outcome }}" != "success" ]; then
            ST=fail; MSG="settlement orchestrator ${{ steps.settle.outcome }}"
          elif [ "${{ steps.health.outcome }}" = "failure" ]; then
            ST=fail; MSG="health gate failed — publish aborted"
          elif [ "${{ steps.paper.outcome }}" != "success" ]; then
            ST=partial; MSG="paper settlement lifecycle ${{ steps.paper.outcome }}"
          else
            ST=pass; MSG="settled $TARGET + paper lifecycle"
          fi
          echo "heartbeat status=$ST ($MSG)"
          node app/scripts/ops-notify.mjs --status "$ST" --phase "nightly-settle" --date "$TARGET" --message "$MSG"
          npx --yes tsx app/scripts/build-admin-status.mjs || echo "admin status build skipped"

      - name: Show diff stat (informational)
        run: |
          echo "::group::git status"
          git status
          echo "::endgroup::"
          echo "::group::git diff --stat"
          git diff --stat
          echo "::endgroup::"

      # ── PUBLICATION SLO ─────────────────────────────────────────────────────────────────────────
      # Detection deliberately rides here rather than on its own cron. See
      # .github/actions/publication-slo/action.yml for the Aug-27 reason: the one watchdog that
      # would have caught this was itself a scheduled job inside the band of dropped events.
      - name: Publication SLO (is today's slate late?)
        continue-on-error: true
        uses: ./.github/actions/publication-slo
        with:
          # true, despite this being the settler. On 2026-08-27 nightly-settle's 16:36 UTC run was
          # one of only two scheduled runs to fire anywhere near the dead band — the coverage a
          # detector gives you is exactly the coverage of the jobs it rides on, and this one fired.
          dispatch-recovery: "true"
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          ops-webhook-url: ${{ secrets.OPS_WEBHOOK_URL }}

      - name: Commit and push if results changed
        run: |
          # Allowlist what automation can commit. NEVER commit code,
          # secrets, build artifacts, or session docs.
          git add app/public/data/results/ 2>/dev/null || true
          git add app/public/data/mlb/results/ 2>/dev/null || true
          # Homer Nukes receipts + cumulative record. Without this line the settler would grade the
          # board and have its output dropped at the commit — the same shape as the 62-hour outage.
          git add app/public/data/mlb/homer-nukes/ 2>/dev/null || true
          git add app/public/data/parlays/risk-ladder/ 2>/dev/null || true
          # GENERATED ABOVE, SO IT MUST BE COMMITTED HERE. An artifact that a job builds and never
          # commits is the exact shape that produced a 62-hour freshness outage on this repo: the
          # run goes green, the file changes on the runner, and the published site never moves.
          for s in mlb nfl ufc epl; do git add "app/public/data/$s/graded-picks.json" 2>/dev/null || true; done
          git add pipeline/validation/settled_leans.jsonl 2>/dev/null || true
          git add pipeline/validation/mlb_settled_leans.jsonl 2>/dev/null || true
          git add pipeline/validation/comparison_report_*.json 2>/dev/null || true
          git add pipeline/validation/mlb_comparison_report_*.json 2>/dev/null || true
          # Parlay graders run by automation_settle.sh. The graded
          # JSONs + summaries are what the homepage + /parlay-lab +
          # /results read. PR #98 introduced optimizer-graded.
          git add app/public/data/parlays/graded/ 2>/dev/null || true
          git add app/public/data/parlays/summary.json 2>/dev/null || true
          git add app/public/data/curated/graded/ 2>/dev/null || true
          git add app/public/data/curated/summary.json 2>/dev/null || true
          git add app/public/data/parlays/optimizer-graded/ 2>/dev/null || true
          # Bank Builder paper-bankroll ledger (settled-only durable history).
          git add app/public/data/bank-builder/ 2>/dev/null || true
          git add app/public/data/parlays/optimizer-summary.json 2>/dev/null || true
          # Daily learning artifact (settled-outcomes only) + its report. The
          # optimizer reads selection-policy-latest.json with a conservative
          # static fallback if missing/corrupt/noLiveWire.
          git add app/public/data/learning/ 2>/dev/null || true
          git add docs/audits/daily-selection-learning-latest.md 2>/dev/null || true
          # model_audit.json is rebuilt every run.
          git add app/public/data/audit/model_audit.json 2>/dev/null || true
          # PR #117: daily postmortem JSONs (one per settled date)
          # written by pipeline.audit_daily — foundation of the model
          # learning loop. Pure aggregation, never adjusts weights.
          git add app/public/data/audit/daily/ 2>/dev/null || true
          # Paper-lane settlement. WITHOUT these two lines the settler runs, writes, and its output is
          # dropped on the floor — a contract that is generated but never added to the commit allowlist
          # is the same failure that cost this repo a 62-hour freshness outage.
          # NOTE the deliberate omission: portfolio.json / banked-ladders.json are the protected money
          # authority and are NEVER auto-committed. Only the dated receipt and today's working copy.
          git add app/public/data/mr-dub/settled/ 2>/dev/null || true
          # Without these two the Lab would grade every night and have its output dropped — the same
          # shape as the 62-hour freshness outage, where a step ran green and its result never landed.
          git add app/public/data/parlays/lab-settled/ 2>/dev/null || true
          git add app/public/data/parlays/lab-ledger.json 2>/dev/null || true
          git add app/public/data/mr-dub/daily-portfolio.json 2>/dev/null || true
          # PR #118: confirmed-signal policy aggregated over the
          # rolling window. Single JSON file rewritten every run.
          # Pure aggregation, demotion-only, never raises a weight.
          git add app/public/data/audit/policy.json 2>/dev/null || true
          # Internal paper-settlement lifecycle (NOT web-served, public:false, never money).
          # Deliberately excludes product-cards/{paper,approvals}/ — those are founder-gated
          # INPUTS that automation must never author or commit.
          # The model-learning audit was in NO allowlist entry, so it ran nightly and had its output
          # dropped at the commit every time — the tracked copies were frozen at whatever a human
          # last committed by hand. Globbed per sport now that the audit runs per sport.
          git add data/internal/*/model-learning/ 2>/dev/null || true
          # The lineage builder writes BOTH a public envelope set and an internal one. Only the
          # public path was allowlisted, so the internal receipts would have been regenerated and
          # dropped every night — the same shape that hid the model-learning audit for weeks.
          git add data/internal/mlb/research-row-lineage/ 2>/dev/null || true
          git add data/internal/mlb/linescores/ 2>/dev/null || true
          git add data/internal/mlb/product-settlement/ 2>/dev/null || true
          git add data/internal/product-cards/settlements/ 2>/dev/null || true
          git add data/internal/product-cards/track-record/ 2>/dev/null || true
          # Ops surfaces — the heartbeat is only a dead-man's switch if the run PERSISTS it.
          git add app/public/data/ops/ 2>/dev/null || true
          git add app/public/data/admin/ 2>/dev/null || true
          # Program 100-103 INCIDENT FIX: the public research contract (Sprint 050) is rebuilt
          # from the settled ledger a few steps above and written to disk — but this allowlist
          # predates it, so it was NEVER committed. The contract could therefore only ever be
          # corrected by a hand-made commit, and it silently drifted behind the ledger after
          # every settle. That latent drift is what the research-contract:stale gate then caught
          # on 2026-08-01, aborting board generation and freezing the site for three days.
          # Committing it here is what makes the contract genuinely self-updating.
          git add app/public/data/research/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No settled-data changes — nothing to commit."
            exit 0
          fi

          git config user.name "GametimePicks Bot"
          git config user.email "noreply@github.com"

          # [skip ci] is defensive — schedule-triggered runs ignore commit
          # messages, but this prevents recursion if push triggers are added.
          ET=$(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')
          MSG="auto: nightly settle ${ET} [skip ci]"
          git commit -m "$MSG"
          # Rebase-then-push, with retries. A bare push loses the whole run when anything else has
          # landed on main first, and settlement is the one job whose output must not be discarded.
          for a in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "push rejected (attempt $a) — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
            if [ "$a" = "5" ]; then echo "still rejected after 5 attempts"; exit 1; fi
          done
          echo "Pushed: $MSG"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-settle-logs
          path: |
            /tmp/gtp_settle_*.log
            /tmp/gtp_export_*.log
            /tmp/gtp_model_audit.log
            /tmp/gtp_grade_parlays.log
            /tmp/gtp_grade_curated.log
            /tmp/gtp_grade_optimizer.log
            /tmp/gtp_audit_daily.log
            /tmp/gtp_audit_policy.log
          retention-days: 7
          if-no-files-found: ignore
      # SPRINT 035 — failure alerting. OPS_WEBHOOK_URL existed in ops-notify.mjs but was wired into no
      # workflow, so a failed run was invisible until someone opened the Actions tab. Posts on failure
      # only. When the secret is unset the step logs an honest skip and does NOT fail the run — the
      # alerting is additive and must never become a new source of red.
      - name: Notify on failure
        if: failure()
        env:
          OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
          PHASE: nightly-settle
        run: |
          # One alert per failed run, built and redacted by scripts/ops_alert.sh so every workflow
          # reports the same contract (docs/OPS_ALERTING_CONTRACT.md). Never exits non-zero: the
          # failing step above is what fails the run.
          EXIT_STATUS="${EXIT_STATUS:-1}" bash scripts/ops_alert.sh
