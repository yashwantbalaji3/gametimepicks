# ----------------------------------------------------------------------------
# ufc-odds-refresh.yml — fetch real UFC/MMA moneyline odds (The Odds API) and
# update the UFC odds + readiness artifacts. ODDS ONLY — never generates picks,
# projections, or parlays. Manual dispatch (credit-guarded). UFC-only writes.
# ----------------------------------------------------------------------------
name: ufc-odds-refresh

on:
  workflow_dispatch:
    inputs:
      max_events:
        description: "Max upcoming MMA events to price (1 credit each, h2h/us)."
        type: string
        required: false
        default: "3"
      dry_run:
        description: "Free events list + cost estimate only (no paid calls)."
        type: boolean
        required: false
        default: false

concurrency:
  group: ufc-odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: refresh UFC odds (odds-only, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: "America/New_York"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - name: Install deps
        run: python -m pip install --upgrade pip && pip install requests
      - name: Fetch UFC odds + rebuild readiness
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m pipeline.ufc.build_odds --max-events "${{ github.event.inputs.max_events || '3' }}" --dry-run
          else
            python -m pipeline.ufc.build_odds --max-events "${{ github.event.inputs.max_events || '3' }}"
          fi
          python -m pipeline.ufc.build_readiness
      - name: Show artifacts
        run: |
          echo "::group::odds"; cat app/public/data/ufc/odds-latest.json | head -40; echo "::endgroup::"
          echo "::group::readiness"; cat app/public/data/ufc/readiness-latest.json; echo "::endgroup::"
      - name: Commit UFC artifacts only
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # STRICT allowlist: UFC artifacts only. Never touches MLB/NBA/picks.
          git add app/public/data/ufc/odds-latest.json app/public/data/ufc/readiness-latest.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no UFC odds changes"; exit 0; fi
          git config user.name "GametimePicks Bot"
          git config user.email "noreply@github.com"
          git commit -m "auto: refresh UFC odds + readiness (odds-only) [skip ci]"
          for a in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "pushed (attempt $a)"; exit 0; fi
            git fetch origin main && git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          echo "push failed"; exit 1
