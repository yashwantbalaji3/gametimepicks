# Sport schedule capture cadence (Program 149 · Release 2).
#
# Turns the manual NFL capture into a proven cadence: one scheduled run plus one subsequent
# independent run is the minimum receipt the sport gate accepts for "captured on a cadence".
#
# DESIGN CONSTRAINTS, inherited not re-invented:
#   - shares the gtp-generated-artifacts writer group — this commits under app/public/data and
#     must never interleave with the board generator, the settler, or daily-products;
#   - zero paid cost: the ESPN public scoreboard needs no key and no credits. The workflow proves
#     that by exporting no secrets to the capture step at all;
#   - a zero-event window (off-season) is NO_EVENTS, not an outage: the capture script's refusal
#     is translated to a clean skip with its reason in the log;
#   - content-idempotent commit: rows carry capturedAt stamps, so a byte comparison would commit
#     every day even when the schedule itself is unchanged. The stamp fields are stripped before
#     comparing, matching the daily-products pattern.
name: sport-schedules

on:
  schedule:
    - cron: "0 13 * * *" # 09:00 ET daily (08:00 during DST changeover weeks is acceptable drift)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the capture but never commit"
        required: false
        default: "false"

concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ── ONE FILE, EVERY REFUSAL ────────────────────────────────────────────────────────────────
    #
    # Each capture in this job reads a DIFFERENT public source for a DIFFERENT sport, and they used
    # to be chained by `exit`: the first one to refuse killed every capture below it. On 2026-08-23
    # openfootball appended a score to a played fixture row, EPL identity correctly refused to guess
    # the club, and the NFL injury feed went past its 24-hour freshness bound as a result — a
    # formatting change in English football data blinding an American football product.
    #
    # Every capture now records its own refusal here and continues. The commit step for each capture
    # is separately gated on that capture reporting CAPTURED, so nothing partial publishes, and the
    # final step turns a non-empty file into a red run — the refusal is still surfaced, it just no
    # longer takes four other sports down with it.
    env:
      REFUSALS: /tmp/gtp-capture-refusals
    steps:
      - uses: actions/checkout@v4

      - name: Start with no refusals recorded
        run: ': > "$REFUSALS"'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tsx is needed ONLY by the EPL capture (it imports the lane's TypeScript identity/validation
      # modules directly — the design that keeps captures from drifting from enforcement).
      - name: Install dev toolchain for the EPL capture
        working-directory: app
        run: npm ci

      - name: Capture NFL schedule window (ESPN public scoreboard, no key, no credits)
        id: nfl
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT=$(node scripts/nfl/capture-nfl-schedule.mjs --now "$NOW" --days 9 2>&1) && CODE=0 || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -q "zero usable events"; then
              echo "state=NO_EVENTS" >> "$GITHUB_OUTPUT"
              echo "no events in the window — an off-season day, not an outage"
              exit 0
            fi
            # Recorded, not fatal — and it must STOP here. Falling through to the CAPTURED line
            # below would overwrite the failure with a success, and the commit step is gated on
            # exactly that value, so a refused capture would have published.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "NFL schedule" >> "$REFUSALS"
            exit 0
          fi
          echo "state=CAPTURED" >> "$GITHUB_OUTPUT"

      - name: Capture NBA confirmed events (same source class, no key, no credits)
        id: nba
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT=$(node scripts/nba/capture-nba-schedule.mjs --now "$NOW" --days 70 2>&1) && CODE=0 || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -q "zero usable events"; then
              echo "state=NO_EVENTS" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Stops here: falling through would overwrite FAILED with CAPTURED, and the commit
            # step is gated on that value.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"; echo "NBA schedule" >> "$REFUSALS"; exit 0
          fi
          echo "state=CAPTURED" >> "$GITHUB_OUTPUT"

      - name: Capture UFC forward cards and bouts (same source class, no key, no credits)
        id: ufc
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT=$(node scripts/ufc/capture-ufc-events.mjs --now "$NOW" --days 60 2>&1) && CODE=0 || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -q "zero usable events"; then
              echo "state=NO_EVENTS" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Stops here: falling through would overwrite FAILED with CAPTURED, and the commit
            # step is gated on that value.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"; echo "UFC forward cards" >> "$REFUSALS"; exit 0
          fi
          echo "state=CAPTURED" >> "$GITHUB_OUTPUT"

      - name: Capture EPL fixtures (openfootball public domain; snapshot-per-capture semantics)
        id: epl
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TXT="$(mktemp)"
          if ! curl -sf --max-time 60 "https://raw.githubusercontent.com/openfootball/england/master/2026-27/1-premierleague.txt" -o "$TXT"; then
            echo "state=SOURCE_UNAVAILABLE" >> "$GITHUB_OUTPUT"
            echo "openfootball fetch failed — SOURCE_STALE, not an empty slate; the committed capture stands"
            exit 0
          fi
          OUT=$(npx tsx scripts/epl/capture-epl-fixtures.mjs --now "$NOW" --from "$TXT" 2>&1) && CODE=0 || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            # A refusal (partial parse, unresolved club, wrong count) means the SOURCE moved under
            # us — surface it as a failure so the run is red and the reason is in the log.
            #
            # RECORDED, NOT FATAL. This used to `exit "$CODE"` here, and every capture BELOW it in
            # this job — EPL/NFL/NBA/UFC results and the NFL+NBA injuries feed — simply never ran.
            # On 2026-08-23 openfootball appended a score to a played row, identity correctly
            # refused the club, and an English football formatting change took the NFL injury feed
            # past its 24-hour bound. Independent sources for independent sports must fail
            # independently; the final step still turns any refusal into a red run.
            echo "state=REFUSED" >> "$GITHUB_OUTPUT"
            echo "EPL fixtures" >> "$REFUSALS"
            exit 0
          fi
          # Snapshot-per-capture: the script wrote a new dated file. Keep it ONLY if the fixture
          # content differs from the newest committed capture (stamps stripped); otherwise delete
          # it — an identical snapshot adds no information and the dir rule is one file per REAL
          # capture, not one per cron firing.
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'public/data/soccer/epl/fixtures';
            const caps = fs.readdirSync(dir).filter(f => f.startsWith('capture-')).sort();
            if (caps.length < 2) process.exit(0);
            const strip = (f) => { const o = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              delete o.generatedAt; delete o.sourceAsOf;
              if (o.membershipVerification) delete o.membershipVerification.verifiedAt;
              o.rows = o.rows.map(r => { const { capturedAt, ...rest } = r; return rest; });
              return JSON.stringify(o); };
            const [prev, curr] = caps.slice(-2);
            if (strip(prev) === strip(curr)) { fs.unlinkSync(path.join(dir, curr)); console.log('unchanged — new snapshot discarded'); }
            else console.log('fixture content changed — new snapshot kept: ' + curr);
          "
          echo "state=CAPTURED" >> "$GITHUB_OUTPUT"

      - name: Commit whichever schedules actually changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          # Per-sport content-idempotency: strip run stamps; keep a sport's files staged only when
          # its schedule content moved. Dated capture files ride along with their latest.json.
          KEEP=""
          for SPORT in nfl nba ufc; do
            DIR="app/public/data/$SPORT/schedule"
            [ -f "$DIR/latest.json" ] || continue
            if node -e "
              const { execSync } = require('child_process');
              const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.windowDays;
                for (const k of ['rows','events','bouts']) if (o[k]) o[k] = o[k].map(r => { const { capturedAt, ...rest } = r; return rest; });
                if (o.source) delete o.source.url; return JSON.stringify(o); };
              const f = '$DIR/latest.json';
              let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
              process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
            "; then
              echo "$SPORT: only capture stamps moved — unchanged"
              git checkout -q -- "$DIR" 2>/dev/null || true
              git clean -q -f "$DIR" 2>/dev/null || true
            else
              git add "$DIR"
              KEEP="$KEEP $SPORT"
            fi
          done
          # EPL uses snapshot-per-capture semantics: its step already deleted an unchanged
          # snapshot, so anything still untracked here is a REAL new capture.
          git add app/public/data/soccer/epl/fixtures/ 2>/dev/null || true
          if ! git diff --cached --quiet -- app/public/data/soccer/epl/fixtures/ 2>/dev/null; then
            KEEP="$KEEP epl"
          fi
          if git diff --cached --quiet; then
            echo "no schedule content changed — nothing to publish"
            exit 0
          fi
          git commit -m "auto: schedule capture:$KEEP [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Capture EPL current-season results (ESPN eng.1, no key; honest empty states)
        id: eplresults
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if node scripts/epl/capture-epl-results.mjs --now "$NOW"; then
            echo "state=CAPTURED" >> "$GITHUB_OUTPUT"
          else
            # Recorded, not fatal. The commit step for THIS capture is gated on CAPTURED, so
            # nothing partial publishes; the final step turns any refusal into a red run.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "EPL results" >> "$REFUSALS"
          fi

      - name: Commit results capture if its content changed
        if: github.event.inputs.dry_run != 'true' && steps.eplresults.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/soccer/epl/results/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.sourceAsOf;
              o.rows = (o.rows||[]).map(r => { const { capturedAt, ...rest } = r; return rest; }); return JSON.stringify(o); };
            const f = 'app/public/data/soccer/epl/results/latest.json';
            let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
            process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
          "; then
            echo "only capture stamps moved — results unchanged"
            git reset; git checkout -q -- app/public/data/soccer/epl/results/ || true
            exit 0
          fi
          git commit -m "auto: epl results capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Capture NFL current results (ESPN scoreboard, no key; honest empty states)
        id: nflresults
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if node scripts/nfl/capture-nfl-results.mjs --now "$NOW"; then
            echo "state=CAPTURED" >> "$GITHUB_OUTPUT"
          else
            # Recorded, not fatal. The commit step for THIS capture is gated on CAPTURED, so
            # nothing partial publishes; the final step turns any refusal into a red run.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "NFL results" >> "$REFUSALS"
          fi

      - name: Commit NFL results capture if its content changed
        if: github.event.inputs.dry_run != 'true' && steps.nflresults.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/nfl/results/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.sourceAsOf;
              o.rows = (o.rows||[]).map(r => { const { capturedAt, ...rest } = r; return rest; }); return JSON.stringify(o); };
            const f = 'app/public/data/nfl/results/latest.json';
            let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
            process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
          "; then
            echo "only capture stamps moved — results unchanged"
            git reset; git checkout -q -- app/public/data/nfl/results/ || true
            exit 0
          fi
          git commit -m "auto: nfl results capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Capture NBA current results (ESPN scoreboard, no key; honest empty states)
        id: nbaresults
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if node scripts/nba/capture-nba-results.mjs --now "$NOW"; then
            echo "state=CAPTURED" >> "$GITHUB_OUTPUT"
          else
            # Recorded, not fatal. The commit step for THIS capture is gated on CAPTURED, so
            # nothing partial publishes; the final step turns any refusal into a red run.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "NBA results" >> "$REFUSALS"
          fi

      - name: Commit NBA results capture if its content changed
        if: github.event.inputs.dry_run != 'true' && steps.nbaresults.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/nba/results/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.sourceAsOf;
              o.rows = (o.rows||[]).map(r => { const { capturedAt, ...rest } = r; return rest; }); return JSON.stringify(o); };
            const f = 'app/public/data/nba/results/latest.json';
            let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
            process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
          "; then
            echo "only capture stamps moved — results unchanged"
            git reset; git checkout -q -- app/public/data/nba/results/ || true
            exit 0
          fi
          git commit -m "auto: nba results capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Capture NFL+NBA injuries facts (ESPN public feed, no key; prose never stored)
        id: injuries
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if node scripts/sports/capture-injuries.mjs --now "$NOW"; then
            echo "state=CAPTURED" >> "$GITHUB_OUTPUT"
          else
            # Recorded, not fatal. The commit step for THIS capture is gated on CAPTURED, so
            # nothing partial publishes; the final step turns any refusal into a red run.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "NFL+NBA injuries" >> "$REFUSALS"
          fi

      - name: Commit injuries captures if content changed
        if: github.event.inputs.dry_run != 'true' && steps.injuries.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/internal/research/injuries/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.sourceAsOf; return JSON.stringify(o); };
            let same = true;
            for (const s of ['nfl','nba']) {
              const f = 'data/internal/research/injuries/' + s + '/latest.json';
              let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { same = false; break; }
              if (strip(head) !== strip(require('fs').readFileSync(f, 'utf8'))) { same = false; break; }
            }
            process.exit(same ? 0 : 1);
          "; then
            echo "only capture stamps moved — injuries facts unchanged"
            git reset; git checkout -q -- data/internal/research/injuries/ || true
            exit 0
          fi
          git commit -m "auto: injuries facts capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Capture UFC current results (ESPN MMA scoreboard, no key; honest empty states)
        id: ufcresults
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if node scripts/ufc/capture-ufc-results.mjs --now "$NOW"; then
            echo "state=CAPTURED" >> "$GITHUB_OUTPUT"
          else
            # Recorded, not fatal. The commit step for THIS capture is gated on CAPTURED, so
            # nothing partial publishes; the final step turns any refusal into a red run.
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            echo "UFC results" >> "$REFUSALS"
          fi

      - name: Commit UFC results capture if its content changed
        if: github.event.inputs.dry_run != 'true' && steps.ufcresults.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/ufc/results/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; delete o.sourceAsOf;
              o.rows = (o.rows||[]).map(r => { const { capturedAt, ...rest } = r; return rest; }); return JSON.stringify(o); };
            const f = 'app/public/data/ufc/results/latest.json';
            let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
            process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
          "; then
            echo "only capture stamps moved — results unchanged"
            git reset; git checkout -q -- app/public/data/ufc/results/ || true
            exit 0
          fi
          git commit -m "auto: ufc results capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ── SURFACE EVERY REFUSAL, AFTER EVERY CAPTURE HAS HAD ITS TURN ────────────────────────────
      #
      # `always()` because this must run even when an earlier step failed for a reason nothing
      # anticipated; otherwise the one path that skips this check is the one where it matters most.
      - name: Fail the run if any capture refused
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s "$REFUSALS" ]; then
            echo "every capture completed — no refusals recorded"
            exit 0
          fi
          echo "::error::captures refused this run: $(tr '\n' ' ' < "$REFUSALS")"
          echo "Each refusal is logged in its own step above. Other sports' captures still ran."
          exit 1
