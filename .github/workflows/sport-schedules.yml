# Sport schedule capture cadence (Program 149 · Release 2).
#
# Turns the manual NFL capture into a proven cadence: one scheduled run plus one subsequent
# independent run is the minimum receipt the sport gate accepts for "captured on a cadence".
#
# DESIGN CONSTRAINTS, inherited not re-invented:
#   - shares the gtp-generated-artifacts writer group — this commits under app/public/data and
#     must never interleave with the board generator, the settler, or daily-products;
#   - zero paid cost: the ESPN public scoreboard needs no key and no credits. The workflow proves
#     that by exporting no secrets to the capture step at all;
#   - a zero-event window (off-season) is NO_EVENTS, not an outage: the capture script's refusal
#     is translated to a clean skip with its reason in the log;
#   - content-idempotent commit: rows carry capturedAt stamps, so a byte comparison would commit
#     every day even when the schedule itself is unchanged. The stamp fields are stripped before
#     comparing, matching the daily-products pattern.
name: sport-schedules

on:
  schedule:
    - cron: "0 13 * * *" # 09:00 ET daily (08:00 during DST changeover weeks is acceptable drift)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the capture but never commit"
        required: false
        default: "false"

concurrency:
  group: gtp-generated-artifacts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture NFL schedule window (ESPN public scoreboard, no key, no credits)
        id: nfl
        working-directory: app
        run: |
          set -uo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OUT=$(node scripts/nfl/capture-nfl-schedule.mjs --now "$NOW" --days 9 2>&1) && CODE=0 || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -q "zero usable events"; then
              echo "state=NO_EVENTS" >> "$GITHUB_OUTPUT"
              echo "no events in the window — an off-season day, not an outage"
              exit 0
            fi
            echo "state=FAILED" >> "$GITHUB_OUTPUT"
            exit "$CODE"
          fi
          echo "state=CAPTURED" >> "$GITHUB_OUTPUT"

      - name: Commit if the schedule itself changed
        if: github.event.inputs.dry_run != 'true' && steps.nfl.outputs.state == 'CAPTURED'
        run: |
          set -euo pipefail
          git config user.name "gtp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add app/public/data/nfl/schedule/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          # Content-idempotent: strip the run stamps; commit only when events/statuses moved.
          if node -e "
            const { execSync } = require('child_process');
            const strip = (j) => { const o = JSON.parse(j); delete o.generatedAt; o.rows = (o.rows||[]).map(r => { const { capturedAt, ...rest } = r; return rest; }); return JSON.stringify(o); };
            const f = 'app/public/data/nfl/schedule/latest.json';
            let head; try { head = execSync('git show HEAD:' + f, { encoding: 'utf8' }); } catch { process.exit(1); }
            process.exit(strip(head) === strip(require('fs').readFileSync(f, 'utf8')) ? 0 : 1);
          "; then
            echo "only capture stamps moved — the schedule is unchanged, nothing to publish"
            git reset
            exit 0
          fi
          git commit -m "auto: nfl schedule capture [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
