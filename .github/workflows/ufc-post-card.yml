# ufc-post-card.yml — full POST-card lifecycle: results → grade moneylines →
# backtest dataset → calibration → readiness → ops-status. Accumulates clean rows
# toward the public moneyline unlock. Never fakes results; no public picks unless gated.
name: ufc-post-card
# ── SCHEDULED, BECAUSE NOTHING WAS CATCHING A FINISHED CARD ──────────────────────────────────────
#
# This workflow and ufc-results-refresh were BOTH dispatch-only, and neither had ever run. So after a
# card was fought, nothing captured its results: the settlement stage could never earn a cadence
# receipt, the Lab's UFC cards would sit pending forever, and the model-vs-market comparison would
# never be graded. Every one of those was waiting on somebody remembering to press a button.
#
# 08:00 UTC daily — 04:00 ET, after the latest main card has finished. Daily rather than on fight
# nights because a card can move and a weekday card exists; the pipeline is idempotent and free, so a
# day with nothing new to grade is a no-op that costs nothing.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Build+print only", type: boolean, required: false, default: false }
      commit_artifacts: { description: "Commit UFC artifacts", type: boolean, required: false, default: true }
concurrency: { group: ufc-post-card, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  post_card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { TZ: "America/New_York" }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1, persist-credentials: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install requests
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm ci
        working-directory: app

      - name: Post-card pipeline (results → grade → backtest → readiness)
        run: |
          set -e
          python -m pipeline.ufc.build_results
          python -m pipeline.ufc.grade_moneylines
          python -m pipeline.ufc.build_backtest_dataset
          python -m pipeline.ufc.backtest_moneyline_model
          python -m pipeline.ufc.build_readiness
          python -m pipeline.ufc.build_ops_status
      # THE MODEL AGAINST THE PRICE, on the bouts just settled.
      #
      # The pre-fight snapshot recorded both probabilities before the card; this scores them on the
      # same bouts. Append-only, so a bout is graded exactly once. Non-fatal: a night with no settled
      # bout reports NOTHING_NEW and exits clean.
      - name: Grade the model-vs-market comparison
        working-directory: app
        run: |
          set -uo pipefail
          # P196 · Release I ordering fix: this job runs at 08:00 UTC and the ESPN results capture
          # it grades from runs in sport-schedules at 13:00 UTC — so a Saturday card graded on
          # MONDAY, a full day late, from a capture that existed since Sunday afternoon. The
          # capture is free (public scoreboard, no key, one request); refreshing it here removes
          # the cron-ordering lag instead of working around it. A capture failure stands on
          # last-known-good and the grader still runs.
          npx tsx scripts/ufc/capture-ufc-results.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write || \
            echo "::warning::UFC results refresh failed — grading from the committed capture"
          npx tsx scripts/ufc/grade-ufc-model-vs-market.mjs --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --write || \
            echo "::warning::UFC model-vs-market grading refused this run"

      - name: Summary (graded rows + backtestReady)
        run: |
          python -c "import json;d=json.load(open('app/public/data/ufc/backtest-summary-latest.json'));print('cleanRows',d['rowCount'],'brier',d.get('marketImpliedBrier'),'decision',d['launchDecision'])"
          python -c "import json;d=json.load(open('app/public/data/ufc/readiness-latest.json'));print('backtestReady',d['backtestReady'],'projectionsReady',d['projectionsReady'])"
      # CI reliability (2026-10-14): the contract tests that READ the records this run is about to commit —
      # about 7 s, chosen by app/scripts/ci/run-data-contracts.mjs from the staged paths. On 2026-10-14 this
      # lane's first VOID row (a correct record) broke a forecast-ledger reader and main stayed red for hours
      # because data commits skip CI; replayed against that state, this step fails in 7 s naming the test.
      # It NEVER blocks the data: the commit below runs either way, and the last step fails the run (so the
      # failure is visible and alerted) when a contract broke.
      - name: Data contracts for the staged records
        id: contracts
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.commit_artifacts != 'false' }}
        continue-on-error: true
        run: |
          git add app/public/data/ufc/ data/internal/research/ufc/model-vs-market 2>/dev/null || true
          node app/scripts/ci/run-data-contracts.mjs --staged
      - name: Commit derived UFC artifacts
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.commit_artifacts != 'false' }}
        run: |
          git add app/public/data/ufc/ data/internal/research/ufc/model-vs-market 2>/dev/null || true
          git reset -q app/public/data/ufc/*.csv 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auto: UFC post-card grading + backtest [skip ci]"
          for a in 1 2 3 4 5; do git push origin HEAD:main && exit 0; git fetch origin main && git rebase origin/main || { git rebase --abort||true; exit 1; }; done
          exit 1

      - name: Fail the run if a data contract broke (the records above are already committed)
        if: steps.contracts.outcome == 'failure'
        run: |
          echo "::error::a data contract failed for records this run committed — main is red until the reader is fixed (see 'Data contracts for the staged records')"
          exit 1
