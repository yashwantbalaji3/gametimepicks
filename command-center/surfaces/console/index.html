<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0705">
  <title>GTP CEO Command Center</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GTP CEO">
</head>
<body data-view="overview">
  <aside class="sidebar" aria-label="Sections">
    <div class="brand">
      <img src="/brand/logo.png" alt="">
      <div>
        <div class="brand-name">GameTimePicks</div>
        <div class="brand-sub">Command Center</div>
      </div>
    </div>
    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <header class="topbar">
    <div class="brand topbrand"><img src="/brand/logo.png" alt=""></div>
    <h1 class="page-title" id="page-title">Overview</h1>
    <div class="statusline" id="badges" aria-live="polite"></div>
    <button type="button" class="btn small stop-top" id="stop-top" data-stop hidden>Stop now</button>
    <button type="button" class="btn small pause-top" id="pause-top" data-pause="1">Pause all</button>
  </header>
  <main class="layout">
    <section class="view view-overview" id="overview" aria-label="Overview"></section>
    <section class="view view-queue" id="queue" aria-label="Review and approvals"></section>
    <section class="view view-calendar" id="calendar" aria-label="Content calendar"></section>
    <section class="view view-publishing" id="publishing" aria-label="Publishing"></section>
    <section class="view view-reports" id="reports" aria-label="Reports"></section>
    <section class="view view-team" aria-label="AI team">
      <div class="team-grid">
        <section class="conversation" aria-label="Conversation with the team">
          <div class="thread" id="thread"></div>
          <form class="composer" id="composer">
            <div class="chips" id="chips"></div>
            <div class="composer-row">
              <textarea id="input" rows="2" placeholder="Give the team an objective…" aria-label="Message to the team"></textarea>
              <button type="submit" class="btn primary">Send</button>
            </div>
          </form>
        </section>
        <div class="team-side">
          <section class="panel" id="agents"></section>
          <section class="panel" id="tasks"></section>
          <section class="panel" id="decisions"></section>
        </div>
      </div>
    </section>
    <section class="view view-ops" aria-label="Operations and settings">
      <div class="ops-grid">
        <section class="panel" id="controls"></section>
        <section class="panel" id="team"></section>
        <section class="panel ops-wide" id="history"></section>
      </div>
    </section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <div class="sheet-backdrop" id="more-sheet" hidden><div class="sheet" role="dialog" aria-label="More sections" id="more-list"></div></div>
  <div class="auth-screen" id="auth" hidden>
    <div class="auth-card">
      <img src="/brand/logo.png" alt="GameTimePicks">
      <h1>CEO Command Center</h1>
      <p class="muted" id="auth-msg" role="status"></p>
      <div id="auth-login" hidden>
        <button type="button" class="btn primary wide" data-login>Sign in with passkey</button>
      </div>
      <div id="auth-setup" hidden>
        <label class="muted" for="setup-token">One-time setup token</label>
        <input id="setup-token" autocomplete="off" autocapitalize="off" spellcheck="false">
        <label class="muted" for="passkey-label">Name this passkey</label>
        <input id="passkey-label" value="iPhone" maxlength="60">
        <button type="button" class="btn primary wide" data-register>Create passkey</button>
      </div>
      <div id="auth-invite" hidden>
        <p id="invite-who"></p>
        <label class="muted" for="invite-label">Name this passkey</label>
        <input id="invite-label" value="iPhone" maxlength="60">
        <button type="button" class="btn primary wide" data-register-invite>Create my account with a passkey</button>
        <p class="muted">Your account uses a passkey (Face ID, Touch ID or a security key) — no password to remember or leak.</p>
      </div>
      <div id="auth-new-passkey" hidden>
        <label class="muted" for="new-passkey-label">Name the new passkey</label>
        <input id="new-passkey-label" value="New iPhone" maxlength="60">
        <button type="button" class="btn primary wide" data-register-recovery>Create replacement passkey</button>
      </div>
      <details id="auth-recover" hidden>
        <summary>Lost your passkey?</summary>
        <input id="recovery-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx-xxxxx-xxxxx" aria-label="Recovery code">
        <button type="button" class="btn wide" data-recover>Use a recovery code</button>
      </details>
      <div id="auth-codes" hidden>
        <p><b>Save these 10 recovery codes now.</b> Each works once if you lose every passkey. They will not be shown again.</p>
        <pre id="recovery-codes"></pre>
        <button type="button" class="btn primary wide" data-codes-saved>I saved them</button>
      </div>
    </div>
  </div>

  <script src="/webauthn.js"></script>
  <script src="/app.js"></script>
</body>
</html>
