<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0705">
  <title>GTP CEO Command Center</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-view="chat">
  <header class="topbar">
    <div class="brand">
      <img src="/brand/logo.png" alt="">
      <div>
        <div class="brand-name">GameTimePicks</div>
        <div class="brand-sub">CEO Command Center</div>
      </div>
    </div>
    <div class="badges" id="badges"></div>
    <button type="button" class="btn small pause-top mobile-only" id="pause-top" data-pause="1">Pause all</button>
  </header>

  <main class="layout">
    <section class="conversation view-chat" aria-label="Conversation">
      <div class="thread" id="thread"></div>
      <form class="composer" id="composer">
        <div class="chips" id="chips"></div>
        <div class="composer-row">
          <textarea id="input" rows="2" placeholder="Give the team an objective…" aria-label="Message to the team"></textarea>
          <button type="submit" class="btn primary">Send</button>
        </div>
      </form>
    </section>

    <aside class="side" aria-label="Decisions and controls">
      <section class="panel view-decisions" id="decisions"></section>
      <section class="panel view-team" id="controls"></section>
      <section class="panel view-team" id="team"></section>
      <section class="panel view-tasks" id="tasks"></section>
      <section class="panel view-history" id="history"></section>
    </aside>
  </main>

  <nav class="tabbar mobile-only" id="tabbar" aria-label="Sections"></nav>
  <script src="/app.js"></script>
</body>
</html>
