<!doctype html>
<!-- {{template}} — "Predicted winner vs final" ({{variant}}, 1080×{{height}}). Every visible fact is filled from a
     results-accuracy bundle (recap/results-accuracy.mjs), HTML-escaped; the page makes no remote request. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>{{rawCss}}</style>
</head>
<body class="v-{{variant}}" data-template="{{template}}">
  <div class="bg">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <div class="court"><i class="cc"></i><i class="cc2"></i><i class="mid"></i><i class="arc l"></i><i class="arc r"></i></div>
    <div class="stripes"></div>
    <svg class="grain" width="1080" height="{{height}}" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
    <div class="vig"></div>
    <div class="edge"></div>
  </div>
  <div class="content">{{rawBody}}</div>
  <script>
    // Deterministic fit, run by the renderer after fonts load: shrink any [data-fit] line 2 px at a time (never below
    // 22 px or 70% of its size); then every line, every game row and the page must fit or the render is refused.
    window.__runFit = function () {
      var out = [];
      document.querySelectorAll("[data-fit]").forEach(function (el) {
        var size = parseFloat(getComputedStyle(el).fontSize), min = Math.max(22, size * 0.7);
        while (el.scrollWidth > el.clientWidth + 1 && size - 2 >= min) { size -= 2; el.style.fontSize = size + "px"; }
        out.push({ text: el.textContent.trim().slice(0, 60), fits: el.scrollWidth <= el.clientWidth + 1, size: size });
      });
      document.querySelectorAll(".row").forEach(function (row) {
        var ok = row.scrollHeight <= row.clientHeight + 1 && row.scrollWidth <= row.clientWidth + 1;
        row.querySelectorAll(".tchip, .res, .pct, .pts").forEach(function (el) { if (el.scrollWidth > el.clientWidth + 1) ok = false; });
        out.push({ text: "row " + row.dataset.event, fits: ok });
      });
      var c = document.querySelector(".content"), r = c.getBoundingClientRect();
      var last = c.lastElementChild.getBoundingClientRect();
      var minFont = 1e9;
      var walker = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) { var n = walker.currentNode; if (n.textContent.trim()) minFont = Math.min(minFont, parseFloat(getComputedStyle(n.parentElement).fontSize)); }
      var page = document.documentElement;
      return { items: out, minFontPx: minFont, pageOverflow: page.scrollWidth > 1080 || page.scrollHeight > {{height}} || last.bottom > r.bottom + 1 };
    };
  </script>
</body>
</html>
