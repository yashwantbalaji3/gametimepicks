<!doctype html>
<!-- results-card@1 — 1080×1350, up to 8 finished games of one sport on one Eastern date (NBA results only; EPL with the
     Official Forecast where one was published and settled). Every slot comes from a results bundle's claims; the term
     and the Model Performance line come from the public registry. No league logos or player images. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0A0705; --surface: #100B08; --surface-2: #1A130D;
    --text: #F4F4F5; --mute: #C9BC97; --faint: #8A8FA3;
    --accent: #34D399; --accent-mint: #7EE2A8; --miss: #F5B54A;
    --border: rgba(255,255,255,0.08);
    --headline: "Space Grotesk", "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --body: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--text); font-family: var(--body); }
  body {
    position: relative; overflow: hidden; padding: 64px 72px 56px;
    background:
      radial-gradient(900px 520px at 85% -10%, rgba(52,211,153,0.16), transparent 70%),
      radial-gradient(700px 500px at -10% 110%, rgba(52,211,153,0.08), transparent 70%),
      var(--bg);
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 64px; width: auto; }
  .brand span { font-family: var(--headline); font-weight: 700; font-size: 30px; letter-spacing: 0.04em; }
  .chip { font-family: var(--mono); font-size: 22px; letter-spacing: 0.08em; color: var(--accent-mint);
          border: 1px solid rgba(52,211,153,0.35); border-radius: 999px; padding: 10px 22px; }
  h1 { margin-top: 36px; font-family: var(--headline); font-size: 60px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 10px; font-size: 26px; color: var(--mute); }

  .games { margin-top: 28px; display: grid; gap: 12px; }
  .game { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 24px;
          background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 24px; }
  .teams { display: grid; gap: 6px; min-width: 0; }
  .side { display: flex; align-items: center; gap: 14px; font-size: 27px; color: var(--mute); min-width: 0; }
  .side .tag { flex: none; font-family: var(--headline); font-weight: 700; font-size: 22px; padding: 2px 10px; border-radius: 8px;
               background: var(--c, #3A3F4B); color: var(--ink, #FFFFFF); min-width: 70px; text-align: center; }
  .side .tag:empty { display: none; }
  .side .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .sc { margin-left: auto; font-family: var(--headline); font-weight: 700; font-size: 34px; color: var(--mute); }
  .side.win .nm, .side.win .sc { color: var(--text); }
  .fc { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; font-size: 22px; color: var(--mute);
        border-top: 1px solid var(--border); padding-top: 8px; }
  .fc .mark { font-family: var(--headline); font-weight: 700; width: 30px; height: 30px; border-radius: 50%; display: inline-flex;
              align-items: center; justify-content: center; color: var(--bg); font-size: 20px; }
  .fc.hit .mark { background: var(--accent); } .fc.miss .mark { background: var(--miss); }
  .fc b { color: var(--text); font-weight: 600; }

  .tally { margin-top: 18px; font-size: 26px; font-weight: 600; }
  footer { position: absolute; left: 72px; right: 72px; bottom: 52px; display: flex; justify-content: space-between; align-items: flex-end;
           border-top: 1px solid var(--border); padding-top: 22px; }
  footer .disc { font-size: 21px; color: var(--mute); max-width: 680px; line-height: 1.35; }
  footer .src { font-family: var(--mono); font-size: 17px; color: var(--faint); text-align: right; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="{{logoDataUri}}" alt=""><span>GAMETIMEPICKS</span></div>
    <div class="chip">{{chip}}</div>
  </header>
  <h1>{{rawHeadline}}</h1>
  <div class="sub">{{sub}}</div>
  <section class="games">{{rawGames}}</section>
  <div class="tally">{{tally}}</div>
  <footer>
    <div class="disc">{{rawDisc}}</div>
    <div class="src">Source: {{sourceName}}<br>{{commit}}</div>
  </footer>
</body>
</html>
